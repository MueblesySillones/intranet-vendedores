function route(){
  closeMenu();
  /* El hash puede traer DOS cosas: "modulo" o "cartelera/idDeLaPublicacion".
     Se parte por la primera barra y nada más: los key de módulo son slugs y
     nunca tienen barra, así que no hay ambigüedad posible. */
  const crudo = location.hash.slice(1);
  const corte = crudo.indexOf('/');
  const key = decodeURIComponent(corte < 0 ? crudo : crudo.slice(0, corte));
  const pid = corte < 0 ? '' : decodeURIComponent(crudo.slice(corte + 1));
  if(key && MAP[key] && !esCarteleraKey(key)) renderSection(key);
  else {
    document.body.classList.remove('report-mode');
    document.getElementById('view').hidden=true;
    document.getElementById('hub').hidden=false;
    renderHub();                 /* al volver a la portada, el muro se repinta */
    pintarNavHeader();
    /* despues de pintar: la publicacion recien existe en el DOM ahora */
    if(pid) enfocarPost(pid);
  }
}

/* Lleva a la publicación que pide un link compartido y la deja ABIERTA.
   Tres casos, porque una publicación puede estar en tres lugares distintos:
   fijada arriba (se despliega su tarjeta), recortada en celular (se expande),
   o entera en el feed (solo se va hasta ella). En los tres se le da un
   resaltado corto: sin eso, en un feed largo, el que llega por el link no
   sabe cuál de todas es la que le compartieron. */
function enfocarPost(pid){
  if(!pid || !Array.isArray(MURO_POSTS)) return;
  const i = MURO_POSTS.findIndex(p => p && idDePost(p) === pid);
  if(i < 0) return;                       /* se borró o venció: queda la portada */
  setTimeout(()=>{
    let art = document.querySelector('#feed .mu-post[data-pid="' + CSS.escape(pid) + '"]');
    if(!art){
      /* está fijada: no se repite en el feed, hay que abrir su tarjeta */
      const card = document.querySelector('.fix-card[data-i="' + i + '"]');
      if(card){ verFijado(i, card); art = document.querySelector('#fixAbierto .mu-post'); }
    }
    if(!art) return;
    const cuerpo = art.querySelector('.mu-cuerpo');
    if(cuerpo && cuerpo.classList.contains('recortado')){
      cuerpo.classList.remove('recortado');
      cuerpo.dataset.abierto = '1';
      const mas = art.querySelector('.mu-mas'); if(mas) mas.remove();
    }
    try{ art.scrollIntoView({behavior:'smooth', block:'start'}); }
    catch(e){ art.scrollIntoView(); }
    art.classList.add('apuntada');
    setTimeout(()=> art.classList.remove('apuntada'), 2600);
  }, 90);
}
window.addEventListener('hashchange', route);

/* ---- modulos editables desde el panel (modulos.js -> window.MODULES) ----
   Reconstruye TILES/MAP a partir de la lista guardada por el panel y suma el
   cuerpo (body) de los modulos personalizados a CONTENT. Si modulos.js no existe
   o esta vacio, se usan los TILES por defecto definidos arriba (compatibilidad). */
function applyModules(){
  /* MURO_DEMO lo definia muro-demo.js, que ya no se carga. Se deja el
     enganche por si alguna vez se vuelve a probar contenido de mentira:
     sin esa variable definida, no hace nada. */
  if(window.MURO_DEMO && Array.isArray(window.MODULES) && !window.MODULES.some(m => m.key === window.MURO_DEMO.key))
    window.MODULES.unshift(window.MURO_DEMO);
  const M = window.MODULES;
  if(!Array.isArray(M) || !M.length) return;
  TILES = M.filter(m=>!m.hidden).map((m,i)=>({
    key:m.key, n:i+1, title:m.title, desc:m.desc,
    color:m.color, icon:(I[m.icon]?m.icon:'layers'), ready:!!m.ready
  }));
  MAP = Object.fromEntries(TILES.map(t=>[t.key,t]));
  MODMAP = Object.fromEntries(M.map(m=>[m.key, m]));
  /* compatibilidad: módulos viejos con "body" -> content de tipo html */
  M.forEach(m=>{ if(!m.content && !m.builtin && typeof m.body==='string' && m.body.trim()) m.content={tipo:'html', html:m.body}; });
}

/* Cuerpo de un módulo cuyo contenido fue definido/reemplazado desde el panel */
function renderContent(c, t){
  if(!c || !c.tipo) return '';
  if(esCartelera(c))       return muroHTML(c, t);
  if(c.tipo==='coleccion') return indiceHTML(c);
  if(c.tipo==='bloques' && c.presentacion) return deckHTML(c.html||'');
  if(c.tipo==='bloques') return `<div class="manual">${c.html||''}</div>`;
  if(c.tipo==='html')   return `<div class="free-content">${c.html||''}</div>`;
  if(c.tipo==='embed')  return `<div class="report-stage"><iframe src="${esc(c.url||'')}" title="${esc(t.title)}" loading="lazy"></iframe></div>`;
  if(c.tipo==='imagen') return c.src ? galleryGrid([{file:c.src, title:t.title, download:c.download||t.title}]) : pendingHTML(t);
  if(c.tipo==='link')   return `<div class="free-content" style="text-align:center;padding:34px 0">
      <a class="dl-btn" style="display:inline-flex" href="${esc(c.url||'#')}" target="_blank" rel="noopener">${svg(I.ext)} ${esc(c.texto||'Abrir')}</a>
    </div>`;
  return '';
}

/* ===================================================================
   MURO: comunicacion interna en formato feed.
   Un modulo de tipo "muro" guarda una lista de POSTS. Cada post tiene la
   misma forma que un documento de biblioteca (titulo + html armado en el
   panel) mas quien lo publica y cuando. El cuerpo se envuelve en .manual,
   asi que adentro de un post sirven TODOS los bloques que ya existen
   (imagenes, galerias, video, PDF, plantillas de WhatsApp...).
   =================================================================== */
/* Las chapas van TINTADAS (fondo suave + texto al color pleno), no saturadas:
   con 6 tipos de colores fuertes la pantalla parece un semáforo y se deja de
   leer lo que importa. El rojo queda reservado para "Importante", y "Equipo"
   directamente va en neutro. */
const MURO_TAGS = {
  anuncio:      { t:'Anuncio',      c:'--c-hudson',    bg:'#E9EDF6', fg:'#1A4A8A', i:'megaphone' },
  promo:        { t:'Promoción',    c:'--c-norcenter', bg:'#F5EDE3', fg:'#8A5A2C', i:'tag' },
  capacitacion: { t:'Capacitación', c:'--c-caba',      bg:'#E7F0F4', fg:'#255C74', i:'book' },
  logro:        { t:'Logro',        c:'--c-canning',   bg:'#E6F1EA', fg:'#1A6A3A', i:'award' },
  importante:   { t:'Importante',   c:'--c-danger',    bg:'#FBEAE9', fg:'#B4231F', i:'shield' },
  equipo:       { t:'Equipo',       c:'--c-hudson',    bg:'#EFEDE9', fg:'#5A554D', i:'users' }
};
/* El color del avatar identifica a QUIEN publica, no al tipo de publicación:
   el mismo nombre saca siempre el mismo color. */
const AVATAR_COLORES = ['--c-hudson', '--c-caba', '--c-canning', '--c-norcenter'];
function colorDeAutor(nombre){
  const s = String(nombre || 'MyS');
  let n = 0;
  for(let i = 0; i < s.length; i++) n = (n + s.charCodeAt(i)) % 997;
  return AVATAR_COLORES[n % AVATAR_COLORES.length];
}
const MURO_LEIDOS = 'mys_muro_leidos';   /* que publicaciones ya vio, una por una */
let MURO_POSTS = [];                     /* los posts que se estan mostrando */
let MURO_KEY = null;

/* Orden del feed: lo fijado primero, despues por fecha (lo mas nuevo arriba).
   Lo fechado a futuro NO se muestra: asi cargar hoy la promo del lunes con la
   fecha del lunes funciona como una publicacion programada. */
function postsDelMuro(c){
  return ((c && c.docs) || []).filter(p => {
    if(p.archivado) return false;
    /* se archiva sola: `vence` es el ULTIMO dia que se ve. Asi la promo de
       agosto desaparece el 1 de septiembre sin que nadie haga nada, que es
       la razon numero uno por la que estas paginas se llenan de cosas
       viejas y la gente les deja de creer. */
    if(p.vence){ const dv = diasDesde(p.vence); if(dv !== null && dv > 0) return false; }
    const d = diasDesde(p.fecha);
    return d === null || d >= 0;         /* sin fecha se muestra igual */
  }).slice().sort((a,b)=>{
    if(!!b.fijado !== !!a.fijado) return b.fijado ? 1 : -1;
    return String(b.fecha||'').localeCompare(String(a.fecha||''));
  });
}

/* "Nuevo" se lleva POR PUBLICACION, no por fecha de ultima visita.
   Con fechas no alcanzaba: si el vendedor entraba a la mañana y se publicaba
   algo al mediodia (con fecha de hoy), esa publicacion no volvia a contar
   como nueva NUNCA, porque "hoy" ya no es mayor que "hoy". */
function idDePost(p){
  return String(p.id || ((p.fecha || '') + '|' + String(p.titulo || '').slice(0, 60)));
}
let LEIDOS = null;
function leidos(){
  if(LEIDOS) return LEIDOS;
  try{ LEIDOS = new Set(JSON.parse(localStorage.getItem(MURO_LEIDOS) || '[]')); }
  catch(e){ LEIDOS = new Set(); }
  return LEIDOS;
}
function primeraVez(){
  try{ return localStorage.getItem(MURO_LEIDOS) === null; }catch(e){ return true; }
}
function esPostNuevo(p){
  if(leidos().has(idDePost(p))) return false;
  /* el primer ingreso no se pinta entero de rojo: solo lo de la ultima semana */
  if(primeraVez()){ const d = diasDesde(p.fecha); return d !== null && d >= 0 && d <= 7; }
  return true;
}
function muroNoLeidos(){
  const mod = moduloMuro();
  if(!mod) return 0;
  return postsDelMuro(mod.content).filter(esPostNuevo).length;
}
function marcarMuroVisto(){
  const S = leidos();
  MURO_POSTS.forEach(p => S.add(idDePost(p)));
  /* se recorta para que la lista no crezca sin fin en el celular */
  try{ localStorage.setItem(MURO_LEIDOS, JSON.stringify(Array.from(S).slice(-400))); }catch(e){}
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaLinda(f){
  const d = diasDesde(f);
  if(d === null) return '';
  if(d <= 0) return 'Hoy';
  if(d === 1) return 'Ayer';
  if(d < 7) return 'Hace ' + d + ' días';
  if(d < 14) return 'Hace una semana';
  if(d < 31) return 'Hace ' + Math.round(d/7) + ' semanas';
  const p = f.split('-').map(Number);
  /* de otro año lleva el año: si no, una publicacion vieja se lee como reciente */
  const esteAno = new Date().getFullYear();
  return p[2] + ' de ' + MESES[p[1]-1] + (p[0] !== esteAno ? ' de ' + p[0] : '');
}
const AUTOR_DEFECTO = 'Muebles y Sillones';
function inicialesDe(nombre){
  const partes = String(nombre || AUTOR_DEFECTO).trim().split(/\s+/).slice(0,2);
  return partes.map(p => p.charAt(0).toUpperCase()).join('') || 'M';
}

/* ===================================================================
   REACCIONES — VISTA PREVIA
   Todavia no hay base de datos, asi que la reaccion se guarda en el
   telefono de quien la hace: la ve esa persona, no el resto. El numero
   que se muestra = las que ya trae la publicacion + la tuya.
   Cuando haya base de datos cambia DE DONDE sale el numero y adonde se
   escribe; esta pantalla queda igual.
   =================================================================== */
const MURO_REACC = 'mys_muro_reacciones';
/* Como en WhatsApp: UNA reaccion por persona. Elegir otra la reemplaza,
   elegir la misma la saca. */
const RE_TIPOS = {
  like:  { e:'👍', t:'Me gusta' },
  heart: { e:'❤️', t:'Me encanta' },
  wow:   { e:'😮', t:'Me sorprende' },
  haha:  { e:'😂', t:'Me divierte' },
  clap:  { e:'👏', t:'Aplausos' }
};
const RE_ORDEN = ['like', 'heart', 'wow', 'haha', 'clap'];
let REACC = null;
function reacciones(){
  if(REACC) return REACC;
  try{ REACC = JSON.parse(localStorage.getItem(MURO_REACC) || '{}'); }catch(e){ REACC = {}; }
  return REACC;
}
/* Antes se guardaba {like:1, heart:1} (se podian poner varias). Ahora es una
   sola: de lo viejo se toma la primera que valga. */
function miReaccion(p){
  const v = reacciones()[idDePost(p)];
  if(typeof v === 'string') return RE_TIPOS[v] ? v : null;
  if(v && typeof v === 'object'){
    const k = RE_ORDEN.find(x => v[x]);
    return k || null;
  }
  return null;
}
function cuentaReaccion(p, tipo){
  const base = Math.max(0, Number((p.reacciones||{})[tipo]) || 0);
  return base + (miReaccion(p) === tipo ? 1 : 0);
}
function totalReacciones(p){
  return RE_ORDEN.reduce((s, t) => s + cuentaReaccion(p, t), 0);
}
function resumenReacciones(p, i){
  const total = totalReacciones(p);
  if(!total) return '';
  /* se muestran hasta 3 caritas, las mas usadas primero */
  const usadas = RE_ORDEN.map(t => ({t, n:cuentaReaccion(p, t)})).filter(x => x.n)
    .sort((a,b) => b.n - a.n).slice(0, 3);
  const mia = miReaccion(p);
  const otros = total - (mia ? 1 : 0);
  const txt = mia ? (otros ? 'Vos y ' + otros + ' más' : 'Reaccionaste') : String(total);
  return `<div class="mu-sum"><span class="mu-sum-ic">${
      usadas.map(x => `<span title="${esc(RE_TIPOS[x.t].t)}">${RE_TIPOS[x.t].e}</span>`).join('')
    }</span><span class="mu-sum-n${mia ? ' mu-sum-yo' : ''}">${esc(txt)}</span></div>`;
}
/* ===================================================================
   "ENTERADO" — acuse de lectura (VISTA PREVIA)
   Una publicacion marcada como `confirmar:true` pide que el vendedor
   toque "Entendido". Sin base de datos la confirmacion se guarda en su
   telefono; el dia que haya base, ademas se manda al servidor y el panel
   muestra QUIEN falta. La pantalla del vendedor no cambia.
   =================================================================== */
const MURO_OK = 'mys_muro_entendido';
let ENTENDIDO = null;
function entendidos(){
  if(ENTENDIDO) return ENTENDIDO;
  try{ ENTENDIDO = new Set(JSON.parse(localStorage.getItem(MURO_OK) || '[]')); }
  catch(e){ ENTENDIDO = new Set(); }
  return ENTENDIDO;
}
function yaEntendido(p){ return entendidos().has(idDePost(p)); }
/* Una CHAPA CHICA en la cabecera, al lado del tipo. Antes era una caja
   grande con un botón y se comía media publicación para decir algo que
   se entiende con dos palabras. */
function chapaLectura(p, i){
  if(!FLAGS.lectura || !p.confirmar) return '';
  const ok = yaEntendido(p);
  return ok
    ? `<span class="mu-lec ok" id="lec-${i}" title="Quedó registrado que la leíste">${svg(I.check)} Leído</span>`
    : `<button type="button" class="mu-lec" id="lec-${i}" onclick="confirmarLeido(${i})"
        title="Lectura obligatoria. Se marca sola cuando la leas, o tocá acá.">${svg(I.shield)} Confirmar lectura</button>`;
}
function confirmarLeido(i){
  const p = MURO_POSTS[i]; if(!p || yaEntendido(p)) return;
  const S = entendidos();
  S.add(idDePost(p));
  try{ localStorage.setItem(MURO_OK, JSON.stringify(Array.from(S).slice(-400))); }catch(e){}
  const vieja = document.getElementById('lec-' + i);
  if(vieja){
    vieja.outerHTML = chapaLectura(p, i);
    const nueva = document.getElementById('lec-' + i);
    if(nueva && !sinMovimiento()) nueva.classList.add('recien');
  }
  /* el aviso de arriba solo se re-dibuja si el vendedor está mirando el
     principio: si no, la portada le da un salto justo mientras lee */
  if(window.scrollY < 220){ pintarPendientes(); renderNoti(); }
  pintarTabs();
}

/* ---- LECTURA AUTOMÁTICA ----
   Si la publicación se queda quieta en pantalla el tiempo suficiente, se
   da por leída sola. Si el vendedor pasa de largo deslizando, no. Así no
   hace falta tocar un botón para cada comunicación.
   Se exige: que la pestaña esté a la vista, que se vea una parte grande
   de la publicación, y que se mantenga TIEMPO_LECTURA sin salirse. */
const TIEMPO_LECTURA = 2000;
let obsLectura = null;
const relojes = new Map();
function vigilarLectura(){
  if(!FLAGS.lectura || !('IntersectionObserver' in window)) return;
  if(!obsLectura){
    obsLectura = new IntersectionObserver(entradas => {
      entradas.forEach(en => {
        const el = en.target, i = Number(el.dataset.lecIdx);
        const alto = en.boundingClientRect.height || 1;
        /* "se ve bien" = más de la mitad de la publicación, o media pantalla
           si la publicación es más alta que la ventana */
        const visible = en.intersectionRect.height;
        const suficiente = en.isIntersecting &&
          visible >= Math.min(alto * 0.55, window.innerHeight * 0.45);
        const anillo = el.querySelector('.lec-ring');
        if(suficiente && !document.hidden){
          if(!relojes.has(el)){
            if(anillo){ anillo.style.setProperty('--tlec', TIEMPO_LECTURA + 'ms'); anillo.classList.add('viendo'); }
            relojes.set(el, setTimeout(()=>{
              relojes.delete(el);
              if(anillo) anillo.classList.add('listo');
              confirmarLeido(i);
              /* el tilde se muestra un momento y se va: el estado ya queda
                 arriba, en la chapa verde */
              setTimeout(()=>{ if(anillo) anillo.classList.remove('viendo', 'listo'); }, 1600);
            }, TIEMPO_LECTURA));
          }
        } else if(relojes.has(el)){
          clearTimeout(relojes.get(el)); relojes.delete(el);   /* pasó de largo */
          if(anillo) anillo.classList.remove('viendo');        /* vuelve a cero */
        }
      });
    }, { threshold:[0, .25, .45, .55, .75, 1] });
  }
  document.querySelectorAll('.mu-post').forEach(art => {
    const chapa = art.querySelector('.mu-lec:not(.ok)');
    if(!chapa || art.dataset.vigilada) return;
    art.dataset.vigilada = '1';
    art.dataset.lecIdx = (chapa.id || '').replace('lec-', '');
    obsLectura.observe(art);
  });
}
/* si se va a otra app o cambia de pestaña, los relojes se frenan */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) return;
  relojes.forEach((t, el)=>{
    clearTimeout(t);
    const a = el.querySelector('.lec-ring'); if(a) a.classList.remove('viendo');
  });
  relojes.clear();
});
/* cuantas comunicaciones obligatorias le faltan confirmar */
function pendientesDeConfirmar(){
  if(!FLAGS.lectura) return [];
  const mod = moduloMuro();
  if(!mod) return [];
  return postsDelMuro(mod.content).filter(p => p.confirmar && !yaEntendido(p));
}
function pintarPendientes(){
  const caja = document.getElementById('pendientes');
  if(!caja) return;
  const faltan = pendientesDeConfirmar();
  if(!faltan.length){ caja.hidden = true; caja.innerHTML = ''; return; }
  caja.hidden = false;
  caja.innerHTML = `<span class="pe-ic">${svg(I.shield)}</span>
    <span class="pe-tx"><b>${faltan.length === 1 ? 'Tenés 1 comunicación sin confirmar'
      : 'Tenés ' + faltan.length + ' comunicaciones sin confirmar'}</b>
      <span class="pe-d">${esc(faltan[0].titulo || '')}${faltan.length > 1 ? ' y ' + (faltan.length-1) + ' más' : ''}</span></span>
    <button type="button" class="pe-btn" onclick="irAConfirmar()">Ver</button>`;
}
function irAConfirmar(){
  const faltan = pendientesDeConfirmar();
  if(!faltan.length) return;
  const id = idDePost(faltan[0]);
  const art = document.querySelector('[data-pid="' + CSS.escape(id) + '"]');
  if(art){ art.scrollIntoView({behavior:'smooth', block:'center'}); destacar(art); return; }
  /* si esta fijada no aparece en el feed: se abre la fijada */
  const fx = document.querySelector('.fix-card');
  if(fx) fx.click();
}

/* El boton del pie: dice "Reaccionar", o muestra la tuya si ya reaccionaste */
function botonReaccion(p, i){
  const mia = miReaccion(p);
  return `<span class="re-wrap">
    <button type="button" class="mu-acc re-abrir${mia ? ' on' : ''}" aria-expanded="false"
      aria-haspopup="true" onclick="abrirReacciones(${i}, this)">${
      mia ? `<span class="re-emo">${RE_TIPOS[mia].e}</span> ${esc(RE_TIPOS[mia].t)}`
          : `${svg(I.like)} Reaccionar`}</button>
  </span>`;
}

/* ---- la barrita flotante ---- */
let RE_ABIERTA = null;
function cerrarReacciones(){
  const b = document.querySelector('.re-bar');
  if(!b) return;
  const btn = b.parentElement.querySelector('.re-abrir');
  if(btn) btn.setAttribute('aria-expanded', 'false');
  b.classList.add('sale');
  setTimeout(()=>{ if(b.parentElement) b.remove(); }, 140);
  RE_ABIERTA = null;
}
function abrirReacciones(i, btn){
  const abierta = RE_ABIERTA === i;
  cerrarReacciones();
  if(abierta) return;                     /* segundo toque: se cierra */
  const p = MURO_POSTS[i]; if(!p) return;
  const mia = miReaccion(p);
  const bar = document.createElement('div');
  bar.className = 're-bar';
  bar.setAttribute('role', 'menu');
  bar.innerHTML = RE_ORDEN.map((t, n) => `
    <button type="button" class="re-op${mia === t ? ' on' : ''}" role="menuitem"
      style="--d:${n * 28}ms" title="${esc(RE_TIPOS[t].t)}" aria-label="${esc(RE_TIPOS[t].t)}"
      onclick="elegirReaccion(${i},'${t}')">${RE_TIPOS[t].e}</button>`).join('');
  btn.parentElement.appendChild(bar);
  btn.setAttribute('aria-expanded', 'true');
  RE_ABIERTA = i;
}
/* se cierra sola al tocar en cualquier otro lado, o con Escape */
document.addEventListener('click', e => {
  if(RE_ABIERTA !== null && !e.target.closest('.re-wrap')) cerrarReacciones();
}, true);
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarReacciones(); });

function elegirReaccion(i, tipo){
  const p = MURO_POSTS[i]; if(!p || !RE_TIPOS[tipo]) return;
  const id = idDePost(p), R = reacciones();
  if(miReaccion(p) === tipo) delete R[id];   /* la misma otra vez: se saca */
  else R[id] = tipo;
  try{ localStorage.setItem(MURO_REACC, JSON.stringify(R)); }catch(e){}
  cerrarReacciones();

  /* se repinta SOLO esta publicacion: volver a dibujar el feed entero haria
     saltar el scroll justo cuando tocaste el boton */
  const art = document.getElementById('mu-' + i);
  if(!art) return;
  const wrap = art.querySelector('.re-wrap');
  if(wrap) wrap.outerHTML = botonReaccion(p, i);
  const nuevoBtn = art.querySelector('.re-abrir');
  if(nuevoBtn && miReaccion(p) && !sinMovimiento()){
    nuevoBtn.classList.add('late');
    setTimeout(()=>nuevoBtn.classList.remove('late'), 300);
  }
  const sumVieja = art.querySelector('.mu-sum');
  const sumNueva = resumenReacciones(p, i);
  if(sumVieja && sumNueva) sumVieja.outerHTML = sumNueva;
  else if(sumVieja) sumVieja.remove();
  else if(sumNueva) art.querySelector('.mu-pie').insertAdjacentHTML('beforebegin', sumNueva);
}
function sinMovimiento(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

/* Una publicacion. Se usa igual en el feed y al desplegar una fijada. */
/* Ajustes de CARGA sobre el HTML que escribio el panel (modulos.js no se toca:
   se corrige el string antes de pintarlo).
   - Toda <img> decodifica fuera del hilo principal (decoding=async).
   - La primera imagen del PRIMER post visible pierde el lazy y pide prioridad
     alta: esta arriba del pliegue y puede ser el elemento LCP; con
     loading=lazy el navegador la dejaba para lo ultimo.
   - En celular, un <video> cuya proporcion ya viene escrita (--arw/--arh en el
     figure) arranca con preload=none. El preload=metadata del marcado
     disparaba la descarga (2 pedidos de 65 KB, medido) ANTES de que
     videosDelFeed() llegara a apagarlo: la etiqueta ya estaba en el DOM. */
function mediosDelPanel(html, primero){
  if(!html) return '';
  html = html.replace(/<img\b(?![^>]*\bdecoding=)/g, '<img decoding="async" ');
  if(primero){
    let hecha = false;
    html = html.replace(/<img\b[^>]*>/, m => {
      if(hecha) return m; hecha = true;
      m = m.replace(/\sloading="lazy"/, '');
      if(!/fetchpriority=/.test(m)) m = m.replace(/^<img\b/, '<img fetchpriority="high" loading="eager"');
      return m;
    });
  }
  if(enCelular()){
    /* cubre los dos envoltorios que escribe el panel: figure.m-video > .v-box > video
       y a.m-ref > span.mr-pv > video (la previa de video del feed) */
    html = html.replace(/(<[a-z]+\b[^>]*--arw[^>]*>(?:\s*<[^>]*>)*?\s*<video\b[^>]*?)preload="metadata"/g,
      '$1preload="none"');
  }
  return html;
}

function postHTML(p, i, primero){
  const tag = MURO_TAGS[p.etiqueta];
  const nuevo = esPostNuevo(p);
  return `<article class="mu-post${nuevo?' nueva':''}" data-tag="${esc(p.etiqueta||'')}" id="mu-${i}"
    data-pid="${esc(idDePost(p))}">
    ${p.fijado ? `<div class="mu-fijado">${svg(I.shield)} FIJADO</div>` : ''}
    <div class="mu-head">
      <span class="mu-av" style="background:var(${colorDeAutor(p.autor)})">${esc(inicialesDe(p.autor))}</span>
      <span class="mu-quien">
        <span class="mu-autor">${esc(p.autor || AUTOR_DEFECTO)}</span>
        <span class="mu-meta">${[p.sucursal, fechaLinda(p.fecha)].filter(Boolean).map(esc)
          .join('<span class="mu-sep">·</span>') || 'Publicado'}</span>
      </span>
      <span class="mu-marcas">
        ${nuevo ? '<span class="mu-nueva">NUEVO</span>' : ''}
        ${chapaLectura(p, i)}
        ${tag ? `<span class="mu-tag" style="background:${tag.bg};color:${tag.fg}">${svg(I[tag.i])}${esc(tag.t)}</span>` : ''}
      </span>
    </div>
    ${p.titulo ? `<div class="mu-titulo">${esc(p.titulo)}</div>` : ''}
    <div class="mu-cuerpo"><div class="manual">${mediosDelPanel(p.html || '', primero)}</div></div>
    ${FLAGS.reacciones ? resumenReacciones(p, i) : ''}
    <div class="mu-pie">
      ${FLAGS.reacciones ? botonReaccion(p, i) : ''}
      <button type="button" class="mu-acc mu-wa" onclick="muroWhatsApp(${i})" title="Compartir por WhatsApp"
        >${svg(I.whatsapp)}<span class="re-t"> Compartir</span></button>
      <button type="button" class="mu-acc solo-ic" title="Copiar el link" aria-label="Copiar el link"
        onclick="muroCopiar(${i},this)">${svg(I.ext)}</button>
      ${FLAGS.lectura && p.confirmar && !yaEntendido(p) ? `<span class="lec-ring" id="ring-${i}" aria-hidden="true">
        <svg viewBox="0 0 36 36"><circle class="pista" cx="18" cy="18" r="15"/>
          <circle class="prog" cx="18" cy="18" r="15"/></svg>
        <span class="lec-ok">${svg(I.check)}</span></span>` : ''}
    </div>
  </article>`;
}

/* El feed. Con `fijadosAparte` las publicaciones fijadas NO se listan acá:
   van arriba en miniatura (asi no tapan lo que se va publicando). */
function muroHTML(c, t, opts){
  opts = opts || {};
  MURO_POSTS = postsDelMuro(c);
  if(!MURO_POSTS.length) return `<div class="pending"><b>Todavía no hay publicaciones.</b><br>Muy pronto.</div>`;

  const enFeed = MURO_POSTS.filter(p => !(opts.fijadosAparte && p.fijado));
  /* si TODO lo que hay esta fijado (tipico del primer dia), el feed queda sin
     nada. Sin este cartel la portada muestra "NOVEDADES" y abajo el vacio. */
  if(!enFeed.length) return `<div class="pending"><b>Todo lo importante está arriba.</b><br>
    Acá van a aparecer las novedades del día a día.</div>`;
  /* solo se ofrecen los filtros de los tipos que realmente existen en el feed */
  const usados = [];
  enFeed.forEach(p => { const e = p.etiqueta; if(e && MURO_TAGS[e] && usados.indexOf(e) < 0) usados.push(e); });
  const filtros = usados.length > 1 ? `<div class="mu-filtros" id="muFiltros">
      <button type="button" class="mu-chip on" onclick="muroFiltrar('',this)">Todo</button>
      ${usados.map(e => `<button type="button" class="mu-chip" onclick="muroFiltrar('${e}',this)">
        <span class="pto" style="background:var(${MURO_TAGS[e].c})"></span>${esc(MURO_TAGS[e].t)}</button>`).join('')}
    </div>` : '';

  return `<div class="muro">${filtros}${MURO_POSTS.map((p,i)=>
      (opts.fijadosAparte && p.fijado) ? '' : postHTML(p, i, p === enFeed[0])
    ).join('')}<div class="mu-vacio" id="muVacio" hidden>No hay publicaciones de ese tipo.</div></div>`;
}

/* Recorta los posts largos DESPUES de pintarlos: recien ahi se sabe cuanto
   miden de verdad (las imagenes pueden no haber cargado, por eso tambien se
   vuelve a medir cuando terminan). */
/* el mismo umbral que usa el CSS del feed */
const MQ_CELULAR = window.matchMedia ? window.matchMedia('(max-width:640px)') : null;
function enCelular(){ return MQ_CELULAR ? MQ_CELULAR.matches : window.innerWidth <= 640; }
/* si se agranda o achica la ventana (o giran el telefono) se vuelve a decidir
   si corresponde recortar */
if(MQ_CELULAR){
  const alCambiar = ()=>{
    document.querySelectorAll('.mu-post .mu-cuerpo').forEach(c => { delete c.dataset.medido; });
    initMuro();
  };
  if(MQ_CELULAR.addEventListener) MQ_CELULAR.addEventListener('change', alCambiar);
  else if(MQ_CELULAR.addListener) MQ_CELULAR.addListener(alCambiar);   /* navegadores viejos */
}

/* Apaga el esqueleto de carga: marca cada <img> con `lista` cuando su archivo
   llego (o fallo, para no dejar un brillo eterno sobre un 404). El load de una
   imagen no burbujea: se caza en fase de captura. Las que entran por innerHTML
   ya completas (cache) se barren apenas se insertan, via MutationObserver. */
(function(){
  const lista = i => i.classList.add('lista');
  document.addEventListener('load',  e => { if(e.target && e.target.tagName === 'IMG') lista(e.target); }, true);
  document.addEventListener('error', e => { if(e.target && e.target.tagName === 'IMG') lista(e.target); }, true);
  const barrer = raiz => { if(raiz.querySelectorAll) raiz.querySelectorAll('img').forEach(i => {
    if(i.complete && i.naturalWidth > 0) lista(i); }); };
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if(n.nodeType !== 1) return;
    if(n.tagName === 'IMG'){ if(n.complete && n.naturalWidth > 0) lista(n); }
    else barrer(n);
  }))).observe(document.documentElement, { childList:true, subtree:true });
  barrer(document);
})();

function initMuro(){
  const posts = document.querySelectorAll('.mu-post');
  posts.forEach(art => {
    const cuerpo = art.querySelector('.mu-cuerpo');
    if(!cuerpo || cuerpo.dataset.medido) return;
    /* con foto/video el recorte es mas generoso: cortar a la altura del texto
       dejaba una franja de imagen que no se entiende */
    if(cuerpo.querySelector('img, video, iframe')) cuerpo.classList.add('con-media');
    /* EN ESCRITORIO NO SE RECORTA: la pantalla es grande y la publicación
       entra entera, así que se lee de corrido sin tener que abrir nada.
       El recorte es cosa del celular.
       Y cuando se recorta, se mide LO QUE QUEDA TAPADO con el tope real del
       CSS: si es poco no vale la pena, porque el botón "Ver publicación
       completa" ocupa 44px y la publicación terminaba MAS ALTA recortada
       que entera. */
    const medir = ()=>{
      if(cuerpo.dataset.abierto) return;
      if(!enCelular()){                        /* escritorio: siempre completa */
        cuerpo.classList.remove('recortado');
        const viejo = art.querySelector('.mu-mas'); if(viejo) viejo.remove();
        return;
      }
      if(art.querySelector('.mu-mas')) return;
      /* ⚠️ Una publicación CON MEDIO no se recorta: cortar la foto o el video
         a la mitad es justo lo contrario de mostrar la publicación como es.
         El recorte se guarda para el texto largo, que es donde de verdad
         tapa lo que viene abajo. */
      if(cuerpo.querySelector('.m-video, .m-img, .gallery, .m-ref')) return;
      cuerpo.classList.add('recortado');
      const tapado = cuerpo.scrollHeight - cuerpo.clientHeight;
      if(tapado < 110){ cuerpo.classList.remove('recortado'); return; }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mu-mas'; b.textContent = 'Ver publicación completa';
      b.onclick = ()=>{ cuerpo.classList.remove('recortado'); cuerpo.dataset.abierto = '1'; b.remove(); };
      cuerpo.insertAdjacentElement('afterend', b);
    };
    medir();
    cuerpo.querySelectorAll('img').forEach(im => { if(!im.complete) im.addEventListener('load', medir, {once:true}); });
    cuerpo.dataset.medido = '1';
  });
  /* se marca como visto con un respiro, asi alcanza a ver las chapas "NUEVO" */
  setTimeout(marcarMuroVisto, 2500);
}

function muroFiltrar(tag, btn){
  document.querySelectorAll('#muFiltros .mu-chip').forEach(c => c.classList.toggle('on', c === btn));
  let visibles = 0;
  document.querySelectorAll('.mu-post').forEach(a => {
    const ok = !tag || a.dataset.tag === tag;
    a.classList.toggle('oculto', !ok);
    if(ok) visibles++;
  });
  const v = document.getElementById('muVacio');
  if(v) v.hidden = visibles > 0;
}
/* ===================================================================
   EL LINK DE UNA PUBLICACIÓN

   ⚠️ Antes esto devolvía SIEMPRE el mismo link. El `(i ? '' : '')` del final
   agregaba cadena vacía en los dos casos, así que compartir la primera
   publicación o la quinta daba exactamente el mismo enlace: la portada.
   El que lo recibía tenía que buscar de qué le estaban hablando.

   Ahora el link lleva el id de la publicación, que es el mismo que guarda el
   panel y no cambia si se agregan o se borran otras. Se usa el id y NO la
   posición: la posición se corre sola en cuanto se publica algo nuevo, y un
   link compartido ayer terminaría abriendo otra publicación.

       …/intranet/#cartelera/dmtd1i0c59u4z

   Sin id —una publicación vieja que nunca pasó por el panel— cae al link de
   la cartelera, que es lo que hacía antes.
   =================================================================== */
function linkDelPost(i){
  const base = location.href.split('#')[0] + '#' + encodeURIComponent(MURO_KEY || '');
  const p = MURO_POSTS[i];
  /* la MISMA identidad que usa el resto (el "leído", el resaltado, data-pid):
     dos formas distintas de nombrar una publicación se desincronizan solas */
  return p ? base + '/' + encodeURIComponent(idDePost(p)) : base;
}
function muroWhatsApp(i){
  const p = MURO_POSTS[i]; if(!p) return;
  const txt = (p.titulo ? p.titulo + '\n' : '') + linkDelPost(i);
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
}
function muroCopiar(i, btn){
  const txt = linkDelPost(i);
  const ok = ()=>{ const o = btn.innerHTML; btn.classList.add('hecho'); btn.innerHTML = svg(I.check) + ' Copiado';
                   setTimeout(()=>{ btn.classList.remove('hecho'); btn.innerHTML = o; }, 1800); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>{});
  else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
         ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} ta.remove(); }
}

/* ===================================================================
   ENVIAR UNA PIEZA (video, placa, PDF) — o bajarla

   EL PROBLEMA
   `<a download>` con un video de 7,5 MB en un celular no "descarga al
   toque": el navegador se lo baja en silencio, la pantalla no cambia NADA,
   y recién aparece una notificación del sistema. Para el vendedor el botón
   quedó muerto. Y aunque el archivo llegue, todavía le falta el paso que
   importa: abrir WhatsApp y adjuntarlo a mano.

   LO QUE SE HACE AHORA
   Si el teléfono sabe compartir archivos (`navigator.canShare`), el botón
   abre la hoja de compartir del sistema con el ARCHIVO adentro: se elige
   WhatsApp y el video llega como video, no como link.

   ⚠️ `wa.me` NO sirve para esto. Solo acepta texto: no se le puede
   adjuntar un archivo desde una página. Por eso va el share nativo, que es
   la única forma de que el cliente reciba el video de verdad.

   En una computadora —donde no hay hoja de compartir— hace exactamente lo
   que hacía antes: descarga. Y en los dos casos el botón AVISA que está
   trabajando, que era la mitad de la queja.

   ⚠️ SE ENGANCHA POR DELEGACIÓN, no cambiando el HTML de cada botón. Ese
   HTML vive guardado adentro de modulos.js —lo escribió el panel— y
   tocarlo obligaría a volver a guardar todos los módulos.

   ⚠️ EL ARCHIVO SE EMPIEZA A BAJAR EN `pointerdown`, antes del click.
   iOS solo deja abrir la hoja de compartir mientras dura el "permiso" que
   deja un toque, y ese permiso no sobrevive a un fetch largo. Arrancando
   antes, cuando llega el click el archivo suele estar listo y la hoja abre.
   =================================================================== */
const DL_ETIQUETA = { descargar:'Descargar', enviar:'Enviar' };
let DL_PRE = null;                 /* {href, promesa} de lo que se precargó */

function puedeEnviarArchivos(){
  try{
    return !!(navigator.canShare && navigator.share &&
              navigator.canShare({ files: [new File([new Blob([1])], 'x.txt', { type:'text/plain' })] }));
  }catch(e){ return false; }
}

function nombreDeDescarga(a){
  const n = (a.getAttribute('download') || '').trim();
  if(n) return n;
  try{ return decodeURIComponent(a.getAttribute('href').split('/').pop().split('?')[0]) || 'archivo'; }
  catch(e){ return 'archivo'; }
}

/* El rótulo dice lo que el botón va a hacer EN ESTE teléfono. Se corrige
   sobre lo ya dibujado —incluido el HTML que viene de modulos.js— porque
   la pantalla se repinta muchas veces y perseguir cada punto de render es
   la forma seguridad de olvidarse de uno. */
function pintarBotonesDescarga(){
  if(!puedeEnviarArchivos()) return;
  document.querySelectorAll('a.dl-btn:not([data-envio])').forEach(a => {
    a.dataset.envio = '1';
    for(const n of a.childNodes){
      if(n.nodeType === 3 && n.nodeValue.trim() === DL_ETIQUETA.descargar){
        n.nodeValue = n.nodeValue.replace(DL_ETIQUETA.descargar, DL_ETIQUETA.enviar);
        break;
      }
    }
    a.title = 'Enviar por WhatsApp o guardar en el teléfono';
  });
}

function bajarBlob(href){
  return fetch(href, { credentials:'same-origin' }).then(r => {
    if(!r.ok) throw new Error('No se pudo traer el archivo (' + r.status + ')');
    return r.blob();
  });
}

document.addEventListener('pointerdown', e => {
  const a = e.target.closest && e.target.closest('a.dl-btn');
  if(!a || !puedeEnviarArchivos()) return;
  const href = a.getAttribute('href');
  if(!href || (DL_PRE && DL_PRE.href === href)) return;
  /* .catch vacío: si falla, el click lo vuelve a intentar y ahí sí se avisa */
  DL_PRE = { href, promesa: bajarBlob(href).catch(()=>null) };
}, true);

document.addEventListener('click', async e => {
  const a = e.target.closest && e.target.closest('a.dl-btn');
  if(!a) return;
  const href = a.getAttribute('href');
  if(!href) return;
  if(!puedeEnviarArchivos()) return;    /* escritorio: el <a download> de siempre */
  e.preventDefault();
  e.stopPropagation();
  if(a.dataset.ocupado === '1') return;

  const nombre = nombreDeDescarga(a);
  const original = a.innerHTML;
  a.dataset.ocupado = '1';
  a.classList.add('trabajando');
  a.innerHTML = svg(I.download) + ' Preparando…';
  try{
    const blob = (DL_PRE && DL_PRE.href === href ? await DL_PRE.promesa : null)
                 || await bajarBlob(href);
    const file = new File([blob], nombre, { type: blob.type || 'application/octet-stream' });
    if(navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file] });
    }else{
      guardarBlob(blob, nombre);
    }
  }catch(err){
    /* cancelar la hoja de compartir NO es un error: el vendedor se arrepintió */
    if(err && (err.name === 'AbortError' || err.name === 'NotAllowedError')){
      if(err.name === 'NotAllowedError'){
        /* iOS perdió el permiso del toque: se guarda, que es mejor que nada */
        try{ guardarBlob(await bajarBlob(href), nombre); }catch(e2){}
      }
    }else{
      console.error('Enviar/descargar:', err);
      a.innerHTML = svg(I.download) + ' No se pudo';
      setTimeout(()=>{ a.innerHTML = original; }, 2200);
      a.classList.remove('trabajando');
      delete a.dataset.ocupado;
      return;
    }
  }
  a.innerHTML = original;
  a.classList.remove('trabajando');
  delete a.dataset.ocupado;
}, true);

function guardarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const t = document.createElement('a');
  t.href = url; t.download = nombre;
  document.body.appendChild(t); t.click(); t.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
}

/* La pantalla se repinta desde muchos lados (portada, módulo, lightbox,
   fijadas que se despliegan). En vez de acordarse de llamar al rótulo en
   cada uno —y olvidarse de alguno—, se mira el DOM y listo. El trabajo
   real es un querySelectorAll con `:not([data-envio])`, así que cada
   pasada toca solo lo que acaba de aparecer. */
if(typeof MutationObserver === 'function'){
  let pendiente = false;
  new MutationObserver(() => {
    if(pendiente) return;
    pendiente = true;
    requestAnimationFrame(() => { pendiente = false; pintarBotonesDescarga(); });
  }).observe(document.documentElement, { childList:true, subtree:true });
}
document.addEventListener('DOMContentLoaded', pintarBotonesDescarga);

/* ===================================================================
   BUSCADOR
   Busca DENTRO de todo: publicaciones del muro, módulos, documentos de
   las bibliotecas y placas para descargar. Y lo importante: contesta con
   el pedazo de texto donde está la respuesta, para que el vendedor la
   lea ahi mismo sin tener que abrir y buscar de nuevo.
   =================================================================== */
/* se normaliza SIN cambiar el largo del texto: asi las posiciones que
   encuentra la busqueda sirven para recortar y resaltar el original */
const BU_MAPA = {'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','ñ':'n','à':'a','è':'e','ì':'i','ò':'o','ù':'u'};
function norm(s){ return String(s||'').toLowerCase().replace(/[áéíóúüñàèìòù]/g, c => BU_MAPA[c] || c); }
function textoDe(html){
  /* los tags se cambian por un espacio ANTES de leer el texto: si no, el
     final de un elemento y el principio del otro quedan pegados y se lee
     "DescargarMonterosso". El div sigue haciendo falta para que &amp; y
     compañía vuelvan a ser caracteres normales. */
  const d = document.createElement('div');
  d.innerHTML = String(html || '').replace(/<[^>]+>/g, ' ');
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

/* El texto de un modulo SIN sus galerias. Una galeria son 15 nombres de
   archivo y 15 veces la palabra "Descargar": metidos en el texto del modulo
   lo unico que logran es que el resultado sea ilegible. Cada placa se indexa
   aparte, con su miniatura. */
function textoSinGalerias(html){
  const d = document.createElement('div');
  d.innerHTML = String(html || '');
  d.querySelectorAll('.dl-section, .gallery').forEach(x => x.remove());
  return textoDe(d.innerHTML);
}

let BU_INDICE = null, BU_RES = [];
function armarIndice(){
  const idx = [];
  const mods = window.MODULES || [];
  const agregar = e => { if(e.titulo || e.texto) idx.push(e); };
  (mods.length ? mods : []).forEach(m => {
    if(m.hidden) return;
    const t = MAP[m.key] || {};
    const base = { key:m.key, icon:(I[m.icon] ? m.icon : (t.icon || 'layers')), color:m.color || t.color || '--c-hudson' };
    const c = m.content;
    if(esCartelera(c)){
      postsDelMuro(c).forEach(p => agregar(Object.assign({}, base, {
        tipo:'publicacion', pid:idDePost(p), titulo:p.titulo || 'Publicación',
        texto:textoDe(p.html), extra:(p.autor || '') + ' · ' + fechaLinda(p.fecha)
      })));
      return;
    }
    /* el modulo en si (nombre + subtitulo) */
    agregar(Object.assign({}, base, { tipo:'modulo', titulo:m.title || t.title || m.key,
      texto:(m.desc || t.desc || '') + ' ' + (c && c.tipo === 'bloques' ? textoSinGalerias(c.html) :
            (CONTENT[m.key] ? textoSinGalerias(CONTENT[m.key]) : '')) }));
    if(c && c.tipo === 'coleccion'){
      (c.docs || []).forEach((d, di) => { if(!d.archivado) agregar(Object.assign({}, base, {
        tipo:'documento', doc:di, titulo:d.titulo || '', texto:textoDe(d.html),
        extra:(m.title || '') + (d.etiqueta ? ' · ' + d.etiqueta : '')
      })); });
    }
    /* ── LAS PLACAS, UNA POR UNA ──────────────────────────────────────
       Viven adentro de los bloques `galeria`. Se indexan sueltas para que
       buscar "cuotas" devuelva LA PLACA con su miniatura, y no un parrafo
       que la nombra. El nombre del grupo entra en el texto, asi que
       "12 cuotas" encuentra las cuatro del grupo aunque ninguna se llame
       asi ella misma. */
    const bloques = (c && Array.isArray(c.bloques)) ? c.bloques : [];
    let hayEnBloques = false;
    bloques.forEach(bq => {
      if(!bq || bq.t !== 'galeria') return;
      const grupo = textoDe(bq.titulo || '');
      (bq.items || []).forEach(it => {
        if(!it || !it.src) return;
        hayEnBloques = true;
        agregar(Object.assign({}, base, {
          tipo:'placa',
          titulo: textoDe(it.nombre || '') || grupo || 'Placa',
          texto: [grupo, m.title || t.title || '', 'placa para descargar']
                   .filter(Boolean).join(' · '),
          img: it.src,
          extra: [m.title || t.title, grupo].filter(Boolean).join(' · ')
        }));
      });
    });
    /* el archivo viejo de galerias solo se mira si el modulo no las trae
       adentro: si no, la misma placa entraria dos veces al indice */
    if(!hayEnBloques){
      ((window.GALLERIES || {})[m.key] || []).forEach(g => agregar(Object.assign({}, base, {
        tipo:'placa', titulo:g.title || '', texto:'Placa para descargar de ' + (m.title || ''),
        img:g.file, extra:m.title || ''
      })));
    }
  });
  return idx;
}

function buscarEnTodo(q){
  if(!BU_INDICE) BU_INDICE = armarIndice();
  const palabras = norm(q).split(/\s+/).filter(p => p.length > 1);
  if(!palabras.length) return [];
  return BU_INDICE.map(e => {
    const nt = norm(e.titulo), nx = norm(e.texto);
    let puntos = 0, todas = true;
    palabras.forEach(p => {
      const enT = nt.indexOf(p) >= 0, enX = nx.indexOf(p) >= 0;
      if(!enT && !enX) todas = false;
      if(enT) puntos += 12;
      if(enX) puntos += 3;
    });
    if(!todas) return null;
    if(nt.indexOf(norm(q)) >= 0) puntos += 20;       /* el titulo dice justo eso */
    if(nx.indexOf(norm(q)) >= 0) puntos += 8;
    if(e.tipo === 'publicacion') puntos += 2;        /* lo del muro suele ser lo mas actual */
    return { e, puntos, corte:fragmento(e.texto, palabras) };
  }).filter(Boolean).sort((a,b) => b.puntos - a.puntos).slice(0, 24);
}

/* el pedazo de texto donde aparece lo buscado, con la palabra resaltada */
function fragmento(texto, palabras){
  const n = norm(texto);
  let pos = -1;
  palabras.forEach(p => { const i = n.indexOf(p); if(i >= 0 && (pos < 0 || i < pos)) pos = i; });
  if(pos < 0) return '';
  let desde = Math.max(0, pos - 90), hasta = Math.min(texto.length, pos + 230);
  if(desde > 0){ const e = texto.indexOf(' ', desde); if(e > 0 && e < pos) desde = e + 1; }
  if(hasta < texto.length){ const e = texto.lastIndexOf(' ', hasta); if(e > pos) hasta = e; }
  const trozo = texto.slice(desde, hasta);
  /* se resalta por POSICION sobre el trozo original (asi no se pierden tildes) */
  const nt = norm(trozo);
  const marcas = [];
  palabras.forEach(p => {
    let i = nt.indexOf(p);
    while(i >= 0){ marcas.push([i, i + p.length]); i = nt.indexOf(p, i + p.length); }
  });
  marcas.sort((a,b) => a[0] - b[0]);
  let out = '', cursor = 0;
  marcas.forEach(([a, b]) => {
    if(a < cursor) return;
    out += esc(trozo.slice(cursor, a)) + '<mark>' + esc(trozo.slice(a, b)) + '</mark>';
    cursor = b;
  });
  out += esc(trozo.slice(cursor));
  return (desde > 0 ? '…' : '') + out + (hasta < texto.length ? '…' : '');
}

const BU_ROTULO = { publicacion:'Publicación del muro', modulo:'Módulo', documento:'Documento', placa:'Placa' };
function pintarBusqueda(){
  const q = document.getElementById('buInput').value.trim();
  const caja = document.getElementById('buBody');
  if(q.length < 2){
    caja.innerHTML = `<div class="bu-vacio"><p class="bu-tip">Escribí lo que estás buscando y te muestro
      <b>dónde está la respuesta</b>, no una lista de links.<br><br>
      Probá con <b>cuotas</b>, <b>plazo de entrega</b>, <b>derivación</b> o el nombre de una placa.</p></div>`;
    return;
  }
  BU_RES = buscarEnTodo(q);
  if(!BU_RES.length){
    caja.innerHTML = `<div class="bu-vacio"><b>No encontré nada con “${esc(q)}”.</b>
      <p class="bu-tip" style="margin-top:8px">Probá con una sola palabra, o con otra manera de decirlo.</p></div>`;
    return;
  }
  /* la RESPUESTA: el mejor resultado que tenga texto para leer */
  const mejor = BU_RES.find(r => r.corte) || BU_RES[0];
  const otros = BU_RES.filter(r => r !== mejor);
  const im = BU_RES.indexOf(mejor);
  caja.innerHTML = `
    <div class="bu-resp">
      <div class="bu-resp-d">${esc(BU_ROTULO[mejor.e.tipo] || '')}${mejor.e.extra ? ' · ' + esc(mejor.e.extra) : ''}</div>
      <div class="bu-resp-t">${esc(mejor.e.titulo)}</div>
      ${mejor.corte ? `<div class="bu-resp-x">${mejor.corte}</div>` : ''}
      ${mejor.e.img ? `<img class="bu-img" style="width:100%;height:auto;max-height:220px;object-fit:contain;margin-top:10px" src="${esc(mejor.e.img)}" alt="">` : ''}
      <button type="button" class="bu-ir" onclick="irAResultado(${im})">${svg(I.ext)} Abrir</button>
    </div>
    ${otros.length ? `<div class="bu-t">También encontré</div>` : ''}
    ${otros.map(r => {
      const j = BU_RES.indexOf(r);
      return `<button type="button" class="bu-item" onclick="irAResultado(${j})">
        ${r.e.img ? `<img class="bu-img" src="${esc(r.e.img)}" alt="" loading="lazy">`
                  : `<span class="bu-ic" style="background:var(${r.e.color})">${svg(I[r.e.icon])}</span>`}
        <span class="bu-tx">
          <span class="bu-n">${esc(r.e.titulo)}</span>
          <span class="bu-d">${r.corte || esc(BU_ROTULO[r.e.tipo] || '')}</span>
        </span></button>`;
    }).join('')}`;
}

function irAResultado(n){
  const r = BU_RES[n]; if(!r) return;
  const e = r.e;
  cerrarBuscador();
  if(e.tipo === 'publicacion'){
    const muro = moduloMuro();
    /* si la portada es el muro se vuelve ahi; si no, se abre el modulo */
    if(muro && muro.key === e.key) showHub(); else location.hash = e.key;
    setTimeout(()=>{
      const art = document.querySelector('[data-pid="' + CSS.escape(e.pid) + '"]');
      if(art){ art.scrollIntoView({behavior:'smooth', block:'center'}); destacar(art); }
    }, 420);
    return;
  }
  if(e.tipo === 'documento'){
    location.hash = e.key;
    setTimeout(()=>{ verDoc(e.doc); }, 380);
    return;
  }
  if(e.tipo === 'placa'){
    location.hash = e.key;
    setTimeout(()=>{ openLightbox(e.img, e.titulo); }, 400);
    return;
  }
  location.hash = e.key;
}
function destacar(el){
  el.classList.add('destacado');
  setTimeout(()=>el.classList.remove('destacado'), 2000);
}

/* ===================================================================
   INTERRUPTORES
   Cosas hechas y probadas que NO se muestran todavía. Están guardadas
   acá, no borradas: prender una es cambiar su `false` por `true`.

   - reacciones  Me gusta / Me encanta / etc. Sin base de datos cada uno
                 ve SOLO las suyas: no son compartidas.
   - lectura     "Confirmar lectura" + la marca automática. Sin identidad
                 nadie puede saber QUIÉN leyó, así que hoy no le sirve a
                 quien gestiona.
   - tabbar      Barra de abajo (Inicio/Buscar/Módulos). Para cuando esto
                 sea una app; en la web el menú de arriba alcanza.

   Para verlas sin tocar el código, se pueden pedir por la dirección:
   ...?ver=reacciones,lectura
   =================================================================== */
const FLAGS = { reacciones:false, lectura:false, tabbar:false };
try{
  (new URLSearchParams(location.search).get('ver') || '').split(',')
    .forEach(f => { f = f.trim(); if(f in FLAGS) FLAGS[f] = true; });
}catch(e){}
document.addEventListener('DOMContentLoaded', ()=>{
  if(FLAGS.tabbar) document.body.classList.add('con-tabbar');
  /* el pie de cada publicacion se aprieta solo cuando las reacciones suman
     dos botones mas; sin ellas hay lugar para el rotulo "Compartir" */
  if(FLAGS.reacciones) document.body.classList.add('con-reacciones');
});
function tabIr(a){
  if(a === 'inicio'){ cerrarBuscador(); closeMenu(); showHub(); window.scrollTo({top:0, behavior:'smooth'}); }
  else if(a === 'buscar') abrirBuscador();
  else if(a === 'modulos'){ cerrarBuscador(); openMenu(); }
  pintarTabs();
}
function pintarTabs(){
  const enHub = !document.getElementById('hub').hidden;
  const buscando = !document.getElementById('buscador').hidden;
  const menu = !document.getElementById('navmenu').hidden;
  const marcar = (id, on) => { const e = document.getElementById(id); if(e) e.classList.toggle('on', on); };
  marcar('tabInicio', enHub && !buscando && !menu);
  marcar('tabBuscar', buscando);
  marcar('tabModulos', menu || (!enHub && !buscando));
  /* los mismos avisos que arriba: sin leer en el muro, y modulos con material nuevo */
  const sinLeer = moduloMuro() ? muroNoLeidos() : 0;
  const bi = document.getElementById('tabNInicio');
  if(bi){ bi.hidden = !sinLeer; bi.textContent = sinLeer > 9 ? '9+' : sinLeer; }
  const muro = moduloMuro();
  const nMod = TILES.filter(t => (!muro || t.key !== muro.key) && seccionLista(t) && esNovedad(t.key)).length;
  const bm = document.getElementById('tabNModulos');
  if(bm){ bm.hidden = !nMod; bm.textContent = nMod > 9 ? '9+' : nMod; }
}

function abrirBuscador(){
  closeMenu();
  BU_INDICE = null;                 /* se arma con lo que hay publicado ahora */
  const b = document.getElementById('buscador');
  b.hidden = false;
  document.body.classList.add('menu-open');    /* frena el scroll del fondo */
  pintarBusqueda();
  const inp = document.getElementById('buInput');
  inp.value = '';
  setTimeout(()=>inp.focus(), 60);
  pintarTabs();
}
function cerrarBuscador(){
  const b = document.getElementById('buscador');
  if(b.hidden) return;
  b.hidden = true;
  document.body.classList.remove('menu-open');
  pintarTabs();
}
document.addEventListener('DOMContentLoaded', ()=>{
  const inp = document.getElementById('buInput');
  if(inp) inp.addEventListener('input', pintarBusqueda);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') cerrarBuscador();
  /* atajo de teclado para quien la usa desde la compu */
  if((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); abrirBuscador(); }
});

/* ===================================================================
   LOBBY: si hay un modulo de tipo muro, LA PORTADA ES EL MURO.
   Arriba los accesos a los modulos (se deslizan con el dedo) y lo fijado
   en miniatura; abajo el feed. El menu de las tres rayitas sigue teniendo
   TODO, que es como se encuentra algo puntual rapido.
   Si no hay muro, la portada sigue siendo la grilla de siempre.
   =================================================================== */
/* Se llamaba 'muro' hasta agosto de 2026. Lo guardado con el nombre viejo
   se sigue leyendo: nadie tiene que migrar nada a mano. */
function esCartelera(c){ return !!c && (c.tipo === 'cartelera' || c.tipo === 'muro'); }
/* NINGUNA cartelera se lista como módulo: es la portada, no una sección.
   Se pregunta por todas y no solo por la primera — con dos carteleras
   cargadas, la segunda se colaba en el menú y en la columna del costado. */
function esCarteleraKey(key){
  return (window.MODULES || []).some(m => m.key === key && esCartelera(m.content));
}
function moduloMuro(){
  return (window.MODULES || []).find(m => esCartelera(m.content) && !m.hidden) || null;
}
/* ===================================================================
   VIDEO DE LA TARJETA SEÑALADA
   Arranca mudo y se reproduce SOLO mientras está a la vista: con varias
   publicaciones abiertas, dejar todos los videos corriendo se come los
   datos del vendedor. Al salir de pantalla se pausa.
   El botón de sonido no navega — la tarjeta entera es un link.
   =================================================================== */
/* La forma REAL, leída del archivo. El panel guarda un `ar` que puede estar
   mal (queda 16/9 por omisión aunque el video sea vertical), así que se mide
   lo que de verdad llegó: videoWidth/videoHeight y naturalWidth/naturalHeight.
   Se ajusta solo, sin que nadie tenga que declarar el formato. */
/* ¿Se puede confiar en la forma que dice el marcado? Solo si el panel MIDIO
   el archivo al subirlo (data-med). La proporcion sola no alcanza: el
   compositor escribia 16:9 por omision, asi que un video vertical llegaba
   declarado horizontal. Sin la marca se mide como siempre, bajando metadata. */
function tieneProporcion(el){
  const marco = el.closest('.m-video') || el.closest('.m-ref') || el.closest('.m-img');
  if(!marco || marco.dataset.med !== '1') return false;
  return !!(parseFloat(marco.style.getPropertyValue('--arw')) &&
            parseFloat(marco.style.getPropertyValue('--arh')));
}

/* La proporcion que el panel dejo escrita en el marco (--arw/--arh). Es lo
   que le da la forma correcta al video ANTES de bajarlo. */
function medirPorMarcado(el){
  const marco = el.closest('.m-video') || el.closest('.m-ref') || el.closest('.m-img');
  if(!marco) return;
  const an = parseFloat(marco.style.getPropertyValue('--arw'));
  const al = parseFloat(marco.style.getPropertyValue('--arh'));
  if(an && al) medirPrevia(el, an, al);
}

function medirPrevia(el, an, al){
  if(!an || !al) return;
  /* Sirve para las dos cosas: la tarjeta de "señalar" (.m-ref/.mr-pv) y un
     medio adjunto a la publicación (.m-video/.v-box). La forma se declara en
     el mismo lugar donde el maquetado la lee. */
  const caja = el.closest('.mr-pv') || el.closest('.v-box');
  const marco = el.closest('.m-ref') || el.closest('.m-video') || el.closest('.m-img');
  if(caja){ caja.style.setProperty('--arw', an); caja.style.setProperty('--arh', al); }
  if(!marco) return;
  const r = an / al;
  marco.classList.remove('midiendo', 'vertical', 'cuadrado', 'horizontal');
  marco.classList.add(r < .88 ? 'vertical' : (r <= 1.2 ? 'cuadrado' : 'horizontal'));
}
/* si la imagen de la previa ya no existe, la tarjeta vuelve a su forma
   compacta en vez de mostrar el ícono de imagen rota */
function cuidarPrevias(){
  /* un video de previa que ya no existe dejaba una caja negra para siempre */
  document.querySelectorAll('.m-ref .mr-vid').forEach(v => {
    if(v.dataset.cuidada) return;
    v.dataset.cuidada = '1';
    v.addEventListener('error', () => {
      const t = v.closest('.m-ref');
      if(t) t.classList.remove('con-previa','con-video','vertical','cuadrado','horizontal','midiendo');
      const pv = v.closest('.mr-pv');
      if(pv) pv.remove();
    }, { once:true });
  });
  document.querySelectorAll('.mr-img').forEach(i => {
    if(i.dataset.cuidada) return;
    i.dataset.cuidada = '1';
    i.addEventListener('error', () => {
      const t = i.closest('.m-ref');
      if(t) t.classList.remove('con-previa','con-foto','vertical','cuadrado','horizontal');
      const pv = i.closest('.mr-pv');
      if(pv) pv.remove();
    }, { once:true });
  });
}

function medirTodo(){
  cuidarPrevias();
  /* .mr-vid la llevan las dos: la tarjeta de señalar y el video adjunto.
     ⚠️ La marca se pone ANTES de enganchar, no adentro del callback: si el
     archivo todavía no cargó, cada re-render sumaba otro listener sobre el
     mismo elemento. Con un 404 se acumulaban para siempre. */
  document.querySelectorAll('.mr-vid').forEach(v => {
    if(v.dataset.medido) return;
    v.dataset.medido = '1';
    const listo = () => medirPrevia(v, v.videoWidth, v.videoHeight);
    if(v.videoWidth) listo();
    else {
      /* Sin metadata no hay videoWidth. Pero el panel ya dejo la proporcion
         escrita en el <figure> (--arw/--arh), asi que la forma se sabe sin
         bajar un byte — y eso es lo que permite que en celular el preload sea
         'none'. Cuando el video finalmente cargue, la medida real manda. */
      medirPorMarcado(v);
      v.addEventListener('loadedmetadata', listo, { once:true });
    }
  });
  document.querySelectorAll('.mr-img').forEach(i => {
    if(i.dataset.medido) return;
    i.dataset.medido = '1';
    const listo = () => medirPrevia(i, i.naturalWidth, i.naturalHeight);
    if(i.complete && i.naturalWidth) listo();
    else i.addEventListener('load', listo, { once:true });
  });
}

/* En la cartelera un video adjunto se comporta COMO EL FEED, no como una
   página de módulo: arranca mudo, se reproduce solo mientras está a la vista y
   el sonido se prende con el botón. Los controles del navegador quedan para
   adentro del módulo, que es donde el vendedor fue a mirarlo a propósito.
   Se le pone la clase .mr-vid para que lo agarren el mismo observador y el
   mismo medidor que las tarjetas de "señalar". */
const SON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>' +
  '<line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';

/* Le pone al mosaico la clase segun cuantas placas hay, y el "+N" sobre la
   cuarta cuando quedan mas escondidas. Se hace acá y no en el panel para que
   el mismo html sirva en el módulo (donde la galería va completa). */
function mosaicoDelFeed(){
  document.querySelectorAll('#feed .gallery, #fixAbierto .gallery').forEach(g => {
    if(g.dataset.mosaico) return;
    g.dataset.mosaico = '1';
    const tarjetas = [...g.querySelectorAll('.gcard')];
    const n = tarjetas.length;
    g.classList.add('g-' + Math.min(n, 3));
    if(n >= 4) g.classList.add('g-mas');
    const resto = n - 4;
    if(resto > 0 && tarjetas[3]){
      const tapa = document.createElement('span');
      tapa.className = 'g-resto';
      tapa.textContent = '+' + resto;
      tarjetas[3].appendChild(tapa);
    }
  });
}

/* el mismo corte que usa la hoja de estilos para "esto es un telefono" */
function enCelular(){
  try{ return window.matchMedia('(max-width:640px)').matches; }catch(e){ return false; }
}

function videosDelFeed(){
  /* ⚠️ Las FOTOS adjuntas también tienen que pasar por el medidor. Sin esto
     nunca reciben la clase `vertical` y una foto de celular (2250x4000) se
     pinta a 1170px de alto: el 130% de la pantalla para una sola publicación.
     El tope de altura que sí tenían los videos verticales no las alcanzaba. */
  document.querySelectorAll('#feed .m-img img, #fixAbierto .m-img img')
    .forEach(i => i.classList.add('mr-img'));

  document.querySelectorAll('#feed .m-video video, #fixAbierto .m-video video')
    .forEach(v => {
      if(v.dataset.feed) return;
      v.dataset.feed = '1';
      v.removeAttribute('controls');
      v.muted = true; v.loop = true; v.playsInline = true;
      /* ⚠️ En celular preload='none'. Con 'metadata' Chrome se baja el mp4
         ENTERO cuando es chico: medido, 994 KB (dos pedidos de 508 KB para un
         archivo de 497) por una publicacion de 4 segundos que nadie miro. El
         vendedor esta en el salon con su plan de datos.
         PERO solo si se puede saber la FORMA sin abrir el archivo. La
         proporcion la deja escrita el panel en el marcado (--arw/--arh); si no
         esta —contenido viejo o escrito a mano— la unica forma de saber si el
         video es vertical es la metadata, y sin ella se quedaria sin clasificar
         para siempre. Ese caso sigue pidiendo metadata. */
      v.preload = (enCelular() && tieneProporcion(v)) ? 'none' : 'metadata';
      v.classList.add('mr-vid');
      /* Sin autoplay, un video quieto puede leerse como una foto rota. El
         circulo dice que hay algo para ver y cuanto dura; se va al primer
         toque y no vuelve. */
      if(enCelular()){
        const cj = v.closest('.v-box');
        if(cj && !cj.querySelector('.mr-tocar')){
          const o = document.createElement('span');
          o.className = 'mr-tocar';
          o.setAttribute('aria-hidden', 'true');
          o.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
          cj.appendChild(o);
        }
        v.addEventListener('play', () => {
          const t = v.closest('.v-box');
          const o = t && t.querySelector('.mr-tocar');
          if(o) o.remove();
        }, { once: true });
      }
      const caja = v.closest('.v-box');
      if(caja && !caja.querySelector('.mr-son')){
        const b = document.createElement('span');
        b.className = 'mr-son';
        b.setAttribute('role', 'button');
        b.setAttribute('tabindex', '0');
        b.setAttribute('aria-label', 'Activar sonido');
        b.innerHTML = SON_SVG;
        caja.appendChild(b);
      }
    });
}

/* Arma la barra de un video del feed: pausa, avance y sonido.
   Todo lleva stopPropagation: la tarjeta de "señalar" es un link entero y
   tocar la barra tiene que controlar el video, no irse al módulo. */
function reloj(t){
  if(!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), sg = Math.floor(t % 60);
  return m + ':' + (sg < 10 ? '0' : '') + sg;
}

function barraDeVideo(v){
  const caja = v.closest('.mr-pv') || v.closest('.v-box');
  if(!caja || caja.querySelector('.mr-barra')) return;
  const son = caja.querySelector('.mr-son');

  const barra = document.createElement('div');
  barra.className = 'mr-barra';
  barra.innerHTML =
    '<button type="button" class="mr-play" aria-label="Pausar">' +
      '<svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>' +
      '<svg class="ic-pausa" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>' +
    '</button>' +
    '<span class="mr-linea" role="slider" tabindex="0" aria-label="Avanzar el video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
      '<span class="mr-riel"><span class="mr-lleno"></span><span class="mr-bolita"></span></span>' +
    '</span>' +
    '<span class="mr-reloj">0:00</span>';
  caja.appendChild(barra);
  if(son) barra.appendChild(son);          /* el sonido se muda a la barra */

  const play = barra.querySelector('.mr-play');
  const linea = barra.querySelector('.mr-linea');
  const lleno = barra.querySelector('.mr-lleno');
  const bolita = barra.querySelector('.mr-bolita');
  const txt = barra.querySelector('.mr-reloj');

  const pintar = () => {
    const d = v.duration;
    const pct = (isFinite(d) && d > 0) ? (v.currentTime / d) * 100 : 0;
    lleno.style.width = pct + '%';
    bolita.style.left = pct + '%';
    txt.textContent = reloj(v.currentTime) + (isFinite(d) ? ' / ' + reloj(d) : '');
    /* el lector de pantalla necesita el valor del slider, no solo verlo */
    linea.setAttribute('aria-valuenow', Math.round(pct));
    linea.setAttribute('aria-valuetext', reloj(v.currentTime));
    play.classList.toggle('andando', !v.paused);
    play.setAttribute('aria-label', v.paused ? 'Reproducir' : 'Pausar');
  };
  v.addEventListener('timeupdate', pintar);
  v.addEventListener('loadedmetadata', pintar);
  v.addEventListener('play', pintar);
  v.addEventListener('pause', pintar);
  pintar();

  play.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    /* pausado a mano = pausado de verdad: el observador no lo vuelve a arrancar */
    if(v.paused){ v.dataset.frenado = ''; const t = v.play(); if(t && t.catch) t.catch(()=>{}); }
    else { v.pause(); v.dataset.frenado = '1'; }
    barra.classList.add('pegada');
  });

  const buscar = e => {
    const r = linea.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const pct = Math.max(0, Math.min(1, x / r.width));
    if(isFinite(v.duration)) v.currentTime = pct * v.duration;
    pintar();
  };
  const arrancar = e => {
    e.preventDefault(); e.stopPropagation();
    linea.classList.add('tocando'); buscar(e);
    const mover = ev => { ev.preventDefault(); buscar(ev); };
    const soltar = () => {
      linea.classList.remove('tocando');
      document.removeEventListener('pointermove', mover);
      document.removeEventListener('pointerup', soltar);
    };
    document.addEventListener('pointermove', mover);
    document.addEventListener('pointerup', soltar);
  };
  linea.addEventListener('pointerdown', arrancar);
  linea.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  linea.addEventListener('keydown', e => {
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); e.stopPropagation();
    v.currentTime = Math.max(0, Math.min(v.duration || 0,
      v.currentTime + (e.key === 'ArrowRight' ? 5 : -5)));
    pintar();
  });
}

let VID_OBS = null;
function vigilarVideos(){
  mosaicoDelFeed();
  videosDelFeed();
  medirTodo();
  const vids = document.querySelectorAll('.mr-vid');
  if(!vids.length) return;
  if(!VID_OBS){
    VID_OBS = new IntersectionObserver(es => {
      es.forEach(e => {
        const v = e.target;
        if(e.isIntersecting){
          if(v.dataset.frenado) return;    /* lo paró el vendedor: se respeta */
          /* ⚠️ EN CELULAR NO ARRANCA SOLO. Entrar a la cartelera costaba
             1,68 MB, y 994 KB eran de un video de 4 segundos que se bajaba
             entero sin que nadie lo mirara. Lo que gasta no es el preload
             —eso son unos KB— sino el autoplay. El vendedor esta en el salon
             con su plan de datos: que el video empiece cuando lo toque. */
          if(enCelular()) return;
          const t = v.play(); if(t && t.catch) t.catch(()=>{});   /* si el navegador lo frena, no pasa nada */
        } else {
          v.pause();
        }
      });
    }, { threshold: .35 });
  }
  /* ⚠️ renderHub() y verFijado() reescriben el HTML entero: los <video> de la
     vuelta anterior ya no están en la página, pero el observer los seguía
     reteniendo (y con ellos su decoder). Se suelta todo y se vuelve a mirar
     lo que hay AHORA. */
  VID_OBS.disconnect();
  vids.forEach(v => { barraDeVideo(v); VID_OBS.observe(v); });
}

/* El circulo de "toca para ver". Sin autoplay hace falta un blanco grande
   para el dedo: el boton de la barra mide 30px y esto ocupa todo el video. */
document.addEventListener('click', function(e){
  const o = e.target.closest('.mr-tocar');
  if(!o) return;
  e.preventDefault(); e.stopPropagation();     /* la tarjeta es un link: no navegar */
  const caja = o.closest('.v-box') || o.closest('.mr-pv');
  const v = caja && caja.querySelector('.mr-vid');
  if(!v) return;
  v.dataset.frenado = '';
  v.dataset.tocado = '1';
  if(v.preload === 'none') v.preload = 'metadata';
  const t = v.play(); if(t && t.catch) t.catch(()=>{});
});

/* el sonido se prende de a uno: dos videos hablando a la vez no se entiende
   ninguno. Prender uno apaga el que estaba sonando. */
document.addEventListener('click', function(e){
  const b = e.target.closest('.mr-son');
  if(!b) return;
  e.preventDefault(); e.stopPropagation();     /* la tarjeta es un link: no navegar */
  /* ⚠️ Buscaba el video como HERMANO del botón (`b.parentElement`). Andaba
     mientras el botón colgaba de la caja del video, pero al mudarlo adentro
     de la barra de controles su padre pasó a ser `.mr-barra`, que no contiene
     el <video>: quedaba en null y el sonido no se prendía nunca. Se busca
     desde la caja, que es quien de verdad contiene a los dos. */
  const caja = b.closest('.mr-pv') || b.closest('.v-box');
  const v = caja && caja.querySelector('.mr-vid');
  if(!v) return;
  const prender = v.muted;
  if(prender){
    document.querySelectorAll('.mr-vid').forEach(o => { if(o !== v){ o.muted = true; } });
    document.querySelectorAll('.mr-son.suena').forEach(o => {
      o.classList.remove('suena'); o.setAttribute('aria-label','Activar sonido');
    });
  }
  v.muted = !prender;
  b.classList.toggle('suena', prender);
  b.setAttribute('aria-label', prender ? 'Silenciar' : 'Activar sonido');
  const t = v.play(); if(t && t.catch) t.catch(()=>{});
});
/* con el teclado, Enter o espacio hacen lo mismo */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest && e.target.closest('.mr-son');
  if(!b) return;
  e.preventDefault(); b.click();
});

/* ===================================================================
   EL PANEL DE LA DERECHA (solo escritorio)
   Arriba, los modulos en grilla de dos columnas: tocarlos LLEVA al modulo.
   Abajo, siempre lo mismo — las placas para descargar. No cambia segun lo
   que uno elija, porque no es una mesa de trabajo: es el atajo a lo que el
   vendedor busca veinte veces por dia con el cliente enfrente.
   Reusa TILES y esNovedad(), los mismos que alimentan el menu: si algun dia
   cambia que modulos hay, cambia en los dos lados de una.
   =================================================================== */
/* el modulo de placas, por clave; si en otra instalacion se llama distinto,
   el primero que tenga galerias adentro */
/* Un nombre GRITADO se baja a mayuscula inicial. Solo si esta entero en
   mayusculas y tiene mas de tres letras, asi las siglas cortas (PDF, IVA)
   quedan como estan. Es de presentacion: no cambia lo guardado. */
function prolijo(txt){
  const t = String(txt || '').trim();
  if(t.length < 4) return t;
  /* la primera LETRA, que puede venir despues de un signo de apertura */
  const i = t.search(/[a-záéíóúüñ]/i);
  if(i < 0) return t;
  /* si esta GRITADO entero se baja todo; si no, solo se levanta la primera.
     Asi "NUEVA LINEA" y "promos 12 cuotas" terminan igual de parejos, y
     "Normas de WhatsApp" no pierde su mayuscula del medio. */
  const gritado = t === t.toLocaleUpperCase('es') && t !== t.toLocaleLowerCase('es');
  const b = gritado ? t.toLocaleLowerCase('es') : t;
  return b.slice(0, i) + b.charAt(i).toLocaleUpperCase('es') + b.slice(i + 1);
}

/* Empareja los nombres de los grupos de placas, que vienen del modulo con la
   mayuscula que tenian cuando se cargaron. */
/* Cuantos grupos de placas se ven de entrada en el panel. Diez abajo de los
   diez modulos eran veinte renglones para barrer con la vista; con cinco la
   columna se lee de un vistazo y el resto sigue estando a un toque. */
function renderLateral(){
  const caja = document.getElementById('lateral');
  if(!caja) return;
  const lobby = document.getElementById('lobby');
  const items = TILES.filter(t => !esCarteleraKey(t.key));
  if(!items.length){                       /* solo cartelera: no hay panel que poner */
    caja.innerHTML = '';
    if(lobby) lobby.classList.add('sin-panel');
    return;
  }
  if(lobby) lobby.classList.remove('sin-panel');
  caja.innerHTML = '<div class="lat-t">Módulos</div><nav class="lat-lista">' +
    items.map(t => {
      const listo = seccionLista(t);
      const nuevo = listo && esNovedad(t.key);
      return `<button class="lat-i${listo?'':' locked'}" data-key="${esc(t.key)}"
          style="--mc:var(${t.color})"${listo
          ? ` onclick="navTo('${t.key}')"`
          : ' aria-disabled="true" disabled'} title="${esc(t.desc || t.title)}">
        <span class="lat-tx">${esc(prolijo(t.title))}</span>
        ${nuevo ? '<span class="lat-pto" title="Tiene material nuevo"></span>' : ''}
        ${listo ? '' : '<span class="lat-soon">Pronto</span>'}
      </button>`;
    }).join('') + '</nav>';
}

/* La barra de arriba mide lo que mide; el panel se cuelga abajo. El alto se
   MIDE, no se supone: cambia con el ancho de la pantalla y con los botones. */
function medirEncabezado(){
  const h = document.querySelector('.top');
  if(h) document.documentElement.style.setProperty('--hd', h.offsetHeight + 'px');
}
window.addEventListener('resize', medirEncabezado);

/* "Viernes 22 de agosto", con mayuscula al principio */
function fechaLarga(){
  try{
    const t = new Date().toLocaleDateString('es-AR',
      { weekday:'long', day:'numeric', month:'long' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }catch(e){ return ''; }
}

function renderHub(){
  const mod = moduloMuro();
  const lobby = document.getElementById('lobby');
  const hero  = document.getElementById('hero');
  const bot   = document.getElementById('botonera');
  if(!mod){                                  /* sin muro: portada clasica */
    lobby.hidden = true; hero.hidden = false; bot.hidden = false;

    return;
  }
  hero.hidden = true; bot.hidden = true;
  document.getElementById('novedades').hidden = true;

    `<div class="lobby-t"><b>Cartelera</b><span class="lobby-fecha">${fechaLarga()}</span></div>` +
