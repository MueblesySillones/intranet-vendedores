<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intranet · Vendedores · Mueblesysillones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- icono de pantalla de inicio / PWA (logo Muebles y Sillones) -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C2A26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyS Vendedores">
<style>
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#F0EDE8; --bg2:#E8E4DF; --surface:#FFFFFF;
  --ink:#111111; --ink2:#444444; --ink3:#6E6E6E;
  --border:rgba(0,0,0,0.10); --border2:rgba(0,0,0,0.06);
  --c-hudson:#1A1A2E; --c-caba:#2C6E8A; --c-canning:#3A7A55; --c-norcenter:#8A5A2C;
  --c-success:#1A6A3A; --c-warn:#9A6A00; --c-danger:#B4231F; --c-info:#1A4A8A;
}
html,body{ font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--ink); min-height:100%; }
.ico svg{ width:100%; height:100%; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.icirc{ border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--ink); flex:0 0 auto; }

/* top bar */
.top{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:13px 26px; }
.top-l{ grid-column:1; justify-self:start; display:flex; align-items:center; min-width:0; }
/* "Volver a la lista": solo aparece dentro de un documento de una biblioteca */
.lista-btn{ display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink2); font-family:inherit;
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:.2s; }
.lista-btn[hidden]{ display:none; }
.lista-btn:hover{ border-color:var(--ink); color:var(--ink); }
.lista-btn .ico{ width:16px; height:16px; flex:0 0 auto; }
.brand{ grid-column:2; justify-self:center; display:flex; align-items:center; cursor:pointer; }
.brand img{ width:104px; filter:brightness(0); opacity:.9; display:block; }
.top-r{ grid-column:3; justify-self:end; display:flex; align-items:center; gap:10px; }
.home-btn{ display:flex; align-items:center; gap:8px; padding:9px 18px; border-radius:8px; border:1.5px solid var(--ink);
  background:transparent; color:var(--ink); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; letter-spacing:.4px; transition:.2s; }
/* el atributo hidden tiene que ganarle al display:flex de arriba (si no, el boton
   "Inicio" se ve tambien en la portada, donde no hace falta) */
.home-btn[hidden]{ display:none; }
/* flecha "volver atras": retrocede UN paso (reporte -> lista -> portada) */
.back-btn{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
  border-radius:8px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink2);
  cursor:pointer; padding:0; transition:.2s; }
.back-btn[hidden]{ display:none; }
.back-btn:hover{ border-color:var(--ink); color:var(--ink); }
.back-btn .ico{ width:17px; height:17px; }
.home-btn:hover{ background:var(--ink); color:#fff; }
.home-btn .ico{ width:15px; height:15px; }
/* boton menu (solo mobile) */
/* el menu es la via principal a los modulos ahora que la portada es el muro:
   tiene que estar SIEMPRE, tambien en escritorio */
.menu-btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 16px; min-height:44px; border-radius:8px; border:1.5px solid var(--ink);
  background:transparent; color:var(--ink); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; letter-spacing:.4px; transition:.2s; }
.menu-btn:hover{ background:var(--ink); color:#fff; }
.menu-btn .ico{ width:18px; height:18px; }
/* drawer de navegacion */
.navmenu{ position:fixed; inset:0; z-index:120; }
.navmenu[hidden]{ display:none; }
.nav-ov{ position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; transition:opacity .22s ease; }
.nav-panel{ position:absolute; top:0; right:0; height:100%; width:86%; max-width:340px; background:var(--bg);
  box-shadow:-12px 0 44px rgba(0,0,0,.28); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .26s cubic-bezier(.22,.61,.36,1); }
.navmenu.open .nav-ov{ opacity:1; }
.navmenu.open .nav-panel{ transform:translateX(0); }
.nav-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 13px; border-bottom:1px solid var(--border); }
.nav-head .nh-t{ font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--ink3); }
.nav-close{ width:40px; height:40px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; }
.nav-close svg{ width:16px; height:16px; }
.nav-list{ flex:1; overflow-y:auto; padding:11px; display:flex; flex-direction:column; gap:7px; }
.nav-item{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:11px 13px; font-family:inherit; cursor:pointer; transition:border-color .15s, transform .15s; }
.nav-item:hover{ border-color:var(--ink); transform:translateX(-2px); }
.nav-item.locked{ cursor:default; opacity:.62; }
.nav-item.locked:hover{ border-color:var(--border); transform:none; }
.nav-item .ni-ic{ width:40px; height:40px; border-radius:10px; color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.nav-item .ni-ic .ico{ width:20px; height:20px; }
.nav-item .ni-tx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.nav-item .ni-t{ font-size:14px; font-weight:700; color:var(--ink); line-height:1.15; }
.nav-item .ni-d{ font-size:11px; color:var(--ink3); line-height:1.25; }
.nav-item .chip{ flex:0 0 auto; align-self:center; }
body.menu-open{ overflow:hidden; }
@media(max-width:860px){
  .menu-btn{ display:inline-flex; }
  /* el "Inicio" queda solo con el icono para que entre al lado del boton Menu.
     Se muestra unicamente dentro de una seccion (afuera lleva el atributo hidden). */
  #homeBtn{ padding:11px 13px; min-height:44px; }
  #homeBtn .hb-tx{ display:none; }
  /* "Volver a la lista" tambien queda solo con la flecha: con el texto el logo se
     le montaba encima en pantallas angostas. No se confunde con la flecha generica
     porque esa se esconde justamente cuando esta este boton. */
  .lista-btn{ padding:11px 13px; min-height:44px; }
  .lista-btn .lb-tx{ display:none; }
  .top{ padding:12px 18px; } .brand img{ width:96px; }
}
/* celulares muy angostos: los tres botones entraban justo, apretamos los espacios */
@media(max-width:380px){
  .top{ padding:12px 12px; gap:6px; }
  .top-r{ gap:6px; }
  .menu-btn{ padding:11px 10px; }
}

main{ max-width:1080px; margin:0 auto; padding:40px 26px 80px; }

/* hero */
.hero .eyebrow{ font-size:12px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--ink3); margin-bottom:12px; }
.hero h1{ font-size:clamp(26px,7vw,46px); font-weight:800; letter-spacing:-1.5px; line-height:1.08; text-wrap:balance; }
.hero p{ font-size:15px; color:var(--ink3); margin-top:10px; font-weight:400; max-width:560px; }

/* botonera */
.botonera{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:34px; }
.tile{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 22px;
  display:flex; flex-direction:column; gap:16px; cursor:pointer; font-family:inherit; transition:transform .18s, box-shadow .18s, border-color .18s; position:relative; }
.tile:hover{ transform:translateY(-4px); box-shadow:0 14px 34px rgba(0,0,0,.10); border-color:var(--ink); }
.tile.locked{ cursor:default; opacity:.62; }
.tile.locked:hover{ transform:none; box-shadow:none; border-color:var(--border); }
.tile .icirc{ width:60px; height:60px; color:#fff; }
.tile .icirc .ico{ width:28px; height:28px; }
.tile .tt{ font-size:17px; font-weight:800; letter-spacing:-.3px; line-height:1.2; }
.tile .td{ font-size:12.5px; color:var(--ink3); line-height:1.45; font-weight:500; flex:1; }
.tile .num{ position:absolute; top:18px; right:20px; font-size:13px; font-weight:800; color:var(--ink3); opacity:.55; }
/* ---- novedades: que se note lo que cambio ---- */
.novedades{ margin-top:30px; border:1px solid var(--border); border-radius:16px; background:var(--surface); padding:16px 18px; }
.nv-t{ font-size:10.5px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:var(--ink3); margin-bottom:10px; }
.nv-lista{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; }
.nv-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-family:inherit;
  transition:border-color .15s, transform .15s; }
.nv-item:hover{ border-color:var(--ink); transform:translateY(-1px); }
.nv-ic{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff; flex:0 0 auto; }
.nv-ic .ico{ width:17px; height:17px; }
.nv-tx{ flex:1; min-width:0; }
.nv-n{ display:block; font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.25; }
.nv-f{ display:block; font-size:11.5px; color:var(--ink3); margin-top:1px; }
.nv-fl{ color:var(--ink3); font-size:18px; flex:0 0 auto; }
.tile.nuevo{ border-color:var(--ink); }
.tile-nuevo{ position:absolute; top:16px; right:52px; background:var(--ink); color:#fff;
  font-size:9.5px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:30px; font-size:10.5px; font-weight:700; letter-spacing:.4px; align-self:flex-start; }
.chip .dot{ width:6px; height:6px; border-radius:50%; }
.chip.ok{ background:#D4EDDA; color:#145A2E; } .chip.ok .dot{ background:#1A6A3A; }
.chip.soon{ background:#ECE9E3; color:#7A756C; } .chip.soon .dot{ background:#A39C90; }

/* vista de seccion */
/* (el "Volver al inicio" que vivia aca adentro se saco: se vuelve con el boton
   "Inicio" de la barra de arriba, que esta presente en todas las secciones) */
.sec-head{ display:flex; align-items:center; gap:18px; margin-bottom:8px; }
.sec-head .icirc{ width:64px; height:64px; color:#fff; }
.sec-head .icirc .ico{ width:30px; height:30px; }
.sec-head h2{ font-size:clamp(24px,4vw,34px); font-weight:800; letter-spacing:-1px; line-height:1.05; }
.sec-head .sub{ font-size:14px; color:var(--ink3); margin-top:4px; font-weight:500; }
.sec-body{ margin-top:26px; }
.lead{ font-size:16px; color:var(--ink2); line-height:1.6; max-width:680px; }
.cta{ display:inline-flex; align-items:center; gap:10px; margin-top:22px; padding:15px 26px; border-radius:12px; background:var(--ink);
  color:#fff; text-decoration:none; font-size:15px; font-weight:700; letter-spacing:.3px; transition:.2s; }
.cta:hover{ opacity:.88; transform:translateY(-2px); }
.cta .ico{ width:20px; height:20px; }
.cta.alt{ background:var(--surface); color:var(--ink); border:1.5px solid var(--ink); margin-left:12px; }
.hint{ font-size:12px; color:var(--ink3); margin-top:14px; }
.report-frame{ margin-top:24px; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:#222; box-shadow:0 14px 40px rgba(0,0,0,.14); }
.report-frame iframe{ width:100%; height:560px; border:0; display:block; }

/* estado pendiente */
.pending{ margin-top:24px; background:var(--surface); border:1px dashed var(--border); border-radius:18px; padding:46px 32px; text-align:center; }
.pending .icirc{ width:78px; height:78px; margin:0 auto 20px; background:var(--bg2); color:var(--ink3); border:none; }
.pending .icirc .ico{ width:34px; height:34px; }
.pending h3{ font-size:20px; font-weight:800; letter-spacing:-.4px; }
.pending p{ font-size:14px; color:var(--ink3); margin-top:10px; line-height:1.6; max-width:460px; margin-left:auto; margin-right:auto; }
.empty-cat{ display:flex; align-items:center; gap:10px; margin-top:16px; background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:18px 20px; color:var(--ink3); font-size:14px; }
.empty-cat .ico{ width:20px; height:20px; flex:none; color:var(--ink3); }

/* galeria de imagenes / flyers */
.gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:24px; }
.gcard{ background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .18s; }
.gcard:hover{ box-shadow:0 12px 30px rgba(0,0,0,.10); }
.gcard .gimg{ width:100%; aspect-ratio:4/5; object-fit:contain; background:var(--bg2); cursor:zoom-in; display:block; }
.gcard .gmeta{ padding:14px 16px; display:flex; flex-direction:column; gap:11px; }
.gcard .gtitle{ font-size:13px; font-weight:700; color:var(--ink); line-height:1.3; }
.dl-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 12px; border-radius:10px;
  background:var(--ink); color:#fff; text-decoration:none; font-size:13px; font-weight:700; letter-spacing:.3px; transition:.2s; }
.dl-btn:hover{ opacity:.88; }
.dl-btn .ico{ width:16px; height:16px; }
/* secciones de galería plegables (para que los vendedores oculten lo que no usan) */
.m-kicker.plegable{ cursor:pointer; user-select:none; display:flex; align-items:center; gap:9px; }
.m-kicker.plegable:hover{ opacity:.82; }
.m-kicker.plegable .pleg-count{ font-size:11px; font-weight:800; color:var(--ink2); background:var(--bg2); padding:2px 9px; border-radius:20px; margin-left:auto; flex:0 0 auto; }
.m-kicker.plegable .pleg-chev{ font-size:13px; color:var(--ink3); transition:transform .2s; flex:0 0 auto; }
.dl-section.cerrada .gallery, .m-block.cerrada .gallery{ display:none; }
.cerrada > .m-kicker.plegable .pleg-chev{ transform:rotate(-90deg); }
/* visor ampliado */
#lightbox{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.86); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:56px 16px 24px; cursor:zoom-out; }
#lightbox[hidden]{ display:none; }
#lightbox img{ max-width:100%; max-height:78vh; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.5); cursor:default; }
#lightbox .lb-dl{ position:static; transform:none; }
#lightbox .lb-close{ position:absolute; top:14px; right:14px; width:44px; height:44px; border-radius:10px; border:none; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
#lightbox .lb-close .ico{ width:22px; height:22px; }
#lightbox .lb-hint{ display:flex; align-items:center; gap:8px; color:#fff; background:rgba(255,255,255,.16); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:default; }
#lightbox .lb-hint[hidden]{ display:none; }
.footer{ text-align:center; font-size:11px; color:var(--ink3); padding:30px 0 10px; letter-spacing:.5px; }
@media (max-width:860px){ .gallery{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:520px){ .gallery{ grid-template-columns:1fr; } }

/* placa / flyer a pantalla (ej. Embajadores) */
.flyer{ margin-top:24px; text-align:center; background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:18px; }
.flyer img{ max-width:520px; width:100%; border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.16); cursor:zoom-in; transition:transform .15s; display:block; margin:0 auto; }
.flyer img:hover{ transform:scale(1.01); }

@media (max-width:860px){
  .botonera{ grid-template-columns:repeat(2,1fr); gap:14px; }
  main{ padding:30px 18px 60px; }
  .report-frame iframe{ height:420px; }
  .cta.alt{ margin-left:0; margin-top:12px; }
}
@media (max-width:520px){
  .botonera{ grid-template-columns:1fr; }
  .top{ padding:11px 14px; } .brand img{ width:92px; }
  .menu-btn{ padding:11px 14px; }
  .sec-head{ gap:14px; } .sec-head .icirc{ width:52px; height:52px; }
  .cta{ width:100%; justify-content:center; } .cta.alt{ width:100%; }
  .flow .step .sd{ font-size:12px; } .nav-item .ni-d{ font-size:12px; } .benefit .bd{ font-size:12px; }
  .m-h{ font-size:17px; } .m-block{ margin-top:26px; }
  .m-kicker{ letter-spacing:1px; align-items:flex-start; line-height:1.3; } .m-kicker .n{ margin-top:1px; }
  .tut-fig img{ max-height:62vh; }
  .situ{ padding:14px 12px; } .situ .chat{ padding:12px 10px; } .situ .chat .bubble{ max-width:90%; }
  .note{ gap:10px; padding:12px 13px; } .note svg{ width:18px; height:18px; margin-top:2px; }
}

/* ---- Manual de derivaciones (contenido enriquecido) ---- */
.manual{ max-width:760px; }
.manual .m-lead{ font-size:16px; color:var(--ink2); line-height:1.6; }
.manual .m-lead b{ color:var(--ink); }
.m-block{ margin-top:38px; }
.m-kicker{ font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink3); margin-bottom:12px; display:flex; align-items:center; gap:9px; }
.m-kicker .n{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; font-size:11px; font-weight:800; letter-spacing:0; flex:0 0 auto; }
.m-kicker .ico{ width:16px; height:16px; flex:0 0 auto; }
.m-h{ font-size:20px; font-weight:800; letter-spacing:-.5px; color:var(--ink); }
.m-sub{ font-size:13px; color:var(--ink3); margin-top:3px; }
.m-p{ font-size:14.5px; color:var(--ink2); line-height:1.6; margin-top:12px; } .m-p b{ color:var(--ink); }

/* proceso con flechas */
.flow{ display:flex; align-items:stretch; margin-top:4px; }
.flow .step{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 12px; text-align:center; }
.flow .step .si{ width:36px; height:36px; margin:0 auto 9px; color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.flow .step .si svg{ width:18px; height:18px; }
.flow .step .st{ font-size:12.5px; font-weight:800; color:var(--ink); line-height:1.2; }
.flow .step .sd{ font-size:11px; color:var(--ink3); margin-top:4px; line-height:1.35; }
.flow .arrow{ display:flex; align-items:center; justify-content:center; color:var(--ink3); padding:0 6px; flex:0 0 auto; }
.flow .arrow svg{ width:20px; height:20px; }
@media(max-width:600px){ .flow{ flex-direction:column; } .flow .arrow{ transform:rotate(90deg); padding:7px 0; } }

/* chat estilo whatsapp */
.chat{ margin-top:14px; background:#E7E0D7; border:1px solid var(--border); border-radius:16px; padding:15px 14px; display:flex; flex-direction:column; gap:9px;
  background-image:radial-gradient(rgba(0,0,0,.03) 1px, transparent 1px); background-size:18px 18px; }
.chat .blabel{ font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--ink3); }
.bubble{ max-width:84%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.45; box-shadow:0 1px 1px rgba(0,0,0,.07); }
.bubble.out{ align-self:flex-end; background:#D7FBCB; border-top-right-radius:4px; color:#0d1b0d; }
.bubble.in{ align-self:flex-start; background:#fff; border-top-left-radius:4px; color:var(--ink); }
.bubble .time{ display:block; font-size:9.5px; color:rgba(0,0,0,.42); text-align:right; margin-top:4px; }
/* botones estilo whatsapp debajo de la burbuja */
.bbtns{ align-self:flex-end; width:84%; max-width:300px; display:flex; flex-direction:column; gap:3px; margin-top:2px; }
.bbtn{ background:#fff; border-radius:8px; padding:9px 10px; font-size:13px; font-weight:600; color:var(--c-caba); display:flex; align-items:center; justify-content:center; gap:7px; box-shadow:0 1px 1px rgba(0,0,0,.06); }
.bbtn .ico{ width:15px; height:15px; flex:0 0 auto; }
/* ====== Mock realista de WhatsApp ====== */
.wa{ max-width:390px; margin:18px auto 4px; border-radius:12px; overflow:hidden; box-shadow:0 16px 44px rgba(0,0,0,.20); border:1px solid var(--border); background:#efeae2; }
.wa.mini{ max-width:100%; margin:8px 0 0; }
.wa-top{ display:flex; align-items:center; gap:11px; background:#008069; color:#fff; padding:9px 13px; }
.wa-top .ico{ width:20px; height:20px; flex:0 0 auto; }
.wa-top .ico svg{ stroke:#fff; }
.wa-av{ width:38px; height:38px; border-radius:50%; background:#dfe5e7; color:#008069; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; letter-spacing:-.5px; }
.wa-id{ flex:1; min-width:0; }
.wa-name{ font-size:15px; font-weight:600; line-height:1.15; display:flex; align-items:center; gap:5px; }
.wa-name .v{ width:14px; height:14px; flex:0 0 auto; }
.wa-name .v svg{ stroke:#fff; }
.wa-status{ font-size:11.5px; opacity:.85; margin-top:1px; }
.wa-acts{ display:flex; gap:18px; align-items:center; }
.wa-body{ padding:16px 12px 18px; display:flex; flex-direction:column; gap:9px; background:#efeae2;
  background-image:radial-gradient(rgba(0,0,0,.022) 1px, transparent 1px); background-size:16px 16px; }
.wa-sys{ align-self:center; background:#fff; color:#54656f; font-size:10.5px; font-weight:700; letter-spacing:.4px; padding:5px 12px; border-radius:8px; box-shadow:0 1px 1px rgba(0,0,0,.07); margin:3px 0; text-transform:uppercase; text-align:center; }
.wa-msg{ position:relative; max-width:80%; padding:7px 9px 7px 10px; border-radius:8px; font-size:14.2px; line-height:1.42; color:#111b21; box-shadow:0 1px .6px rgba(0,0,0,.16); word-wrap:break-word; }
.wa-msg.out{ align-self:flex-end; background:#d9fdd3; border-top-right-radius:0; }
.wa-msg.in{ align-self:flex-start; background:#fff; border-top-left-radius:0; }
.wa-msg.out::after{ content:""; position:absolute; top:0; right:-8px; width:0; height:0; border:8px solid transparent; border-top-color:#d9fdd3; border-right-width:0; }
.wa-msg.in::after{ content:""; position:absolute; top:0; left:-8px; width:0; height:0; border:8px solid transparent; border-top-color:#fff; border-left-width:0; }
.wa-time{ float:right; font-size:10.5px; color:#667781; margin:7px -2px -2px 10px; display:inline-flex; align-items:center; gap:3px; }
.wa-tick{ display:inline-flex; }
.wa-tick svg{ width:16px; height:11px; stroke:#53bdeb; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
/* pie de la plantilla: en WhatsApp va pegado abajo del cuerpo, gris y chico
   (Meta lo limita a 60 caracteres) */
.wa-foot{ display:block; margin-top:4px; font-size:12.5px; color:#667781; }
.wa-btns{ align-self:flex-end; width:80%; max-width:300px; display:flex; flex-direction:column; gap:2px; margin-top:1px; }
.wa-btn{ background:#fff; color:#00a5f4; border-radius:7px; padding:9px; font-size:14px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 1px .6px rgba(0,0,0,.16); }
.wa-btn .ico{ width:16px; height:16px; flex:0 0 auto; }
/* El tamaño va en el SVG y no solo en el <span>: si algo cambia el display del
   botón, el span vuelve a ser inline, su width deja de aplicar y el ícono se
   infla hasta llenar la burbuja. Ya pasó: los íconos quedaron de 262px. */
.wa-btn .ico svg{ width:16px; height:16px; display:block; stroke:#00a5f4; fill:none; }
/* carrusel DENTRO del telefono: una burbuja de texto y abajo tarjetas que se
   deslizan. Cada tarjeta: foto obligatoria, hasta 160 caracteres y 2 botones. */
.wa-car{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; margin-top:2px;
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.wa-car::-webkit-scrollbar{ height:0; }
.wa-ccard{ flex:0 0 208px; background:#fff; border-radius:8px; overflow:hidden;
  box-shadow:0 1px .6px rgba(0,0,0,.16); scroll-snap-align:start; }
.wa-cimg{ aspect-ratio:1.91/1; background:#dfe5e7; display:grid; place-items:center; }
.wa-cimg svg{ width:30px; height:30px; stroke:#9aa7ad; fill:none; stroke-width:1.6; }
.wa-cbody{ padding:7px 9px 8px; font-size:13.2px; line-height:1.38; color:#111b21; }
.wa-cbtn{ display:flex; align-items:center; justify-content:center; gap:6px; padding:8px;
  border-top:1px solid #e9edef; color:#00a5f4; font-size:13.5px; }
.wa-cbtn svg{ width:14px; height:14px; stroke:#00a5f4; fill:none; display:block; }
.wa-hint{ align-self:center; font-size:11px; color:#667781; margin-top:2px; }
@media(max-width:520px){ .wa{ max-width:100%; } }

/* checklist */
.checklist{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
.checklist .ci{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; font-size:13.5px; font-weight:600; color:var(--ink); }
.checklist .ci svg{ width:17px; height:17px; color:var(--c-success); flex:0 0 auto; }
.checklist .ci .ci-ic{ width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:0 0 auto; }
.checklist .ci .ci-ic svg{ width:15px; height:15px; color:#fff; }
@media(max-width:520px){ .checklist{ grid-template-columns:1fr; } }

/* tarjeta de situacion (con flecha) */
.situ{ margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
.situ .sit-head{ display:flex; align-items:flex-start; gap:10px; font-size:14px; font-weight:800; color:var(--ink); line-height:1.3; }
.situ .sit-tag{ font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:#fff; background:var(--c-warn); padding:3px 9px; border-radius:20px; flex:0 0 auto; margin-top:1px; }
.situ .sit-arrow{ display:flex; align-items:center; gap:7px; color:var(--c-success); font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin:13px 0 0; }
.situ .sit-arrow svg{ width:16px; height:16px; }

/* nota / tip */
.note{ margin-top:14px; display:flex; gap:12px; background:#F4F1EA; border:1px solid var(--border); border-left:3px solid var(--nota-acc, var(--ink)); border-radius:12px; padding:13px 15px; }
.note svg{ width:20px; height:20px; color:var(--nota-acc, var(--ink)); flex:0 0 auto; margin-top:1px; }
.note .nt{ font-size:13.5px; color:var(--ink2); line-height:1.5; } .note .nt b{ color:var(--ink); }

/* tutorial chatbot (pasos con captura) */
.tut-fig{ margin:14px 0 0; background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; }
.tut-fig img{ max-width:100%; max-height:440px; border-radius:9px; box-shadow:0 4px 18px rgba(0,0,0,.10); cursor:zoom-in; transition:transform .15s; }
.tut-fig img:hover{ transform:scale(1.015); }
.tut-fig figcaption{ font-size:12.5px; font-weight:600; letter-spacing:.2px; color:var(--ink2); line-height:1.35; margin-top:11px; }

/* beneficios */
.benefits{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
.benefit{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.benefit .bi{ width:38px; height:38px; border-radius:10px; background:var(--bg2); color:var(--ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.benefit .bi svg{ width:19px; height:19px; }
.benefit .bt{ font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.25; }
.benefit .bd{ font-size:11.5px; color:var(--ink3); margin-top:2px; }
@media(max-width:520px){ .benefits{ grid-template-columns:1fr; } }

/* ---- Reporte / presentacion a pantalla completa ----
   La barra de navegacion de arriba QUEDA VISIBLE (ahi estan "Inicio" y "Menu")
   y el reporte ocupa todo el resto de la pantalla. El boton "Volver al inicio"
   del cuerpo se esconde: seria un duplicado del "Inicio" del header y le comia
   una franja de alto a la presentacion. */
body.report-mode{ display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
body.report-mode .top{ flex:0 0 auto; position:static; }
body.report-mode main{ flex:1; min-height:0; max-width:none; margin:0; padding:0; display:flex; flex-direction:column; }
body.report-mode #view{ flex:1; min-height:0; display:flex; flex-direction:column; }
body.report-mode .sec-head{ display:none; }
body.report-mode .footer{ display:none; }
body.report-mode .sec-body{ flex:1; min-height:0; margin-top:0; }
.report-stage{ height:100%; background:#fff; }
.report-stage iframe{ width:100%; height:100%; border:0; display:block; }
/* bloques imagen / embed / boton dentro de un documento .manual */
.manual .m-img{ text-align:center; }
.manual .m-img img{ max-width:100%; max-height:360px; border-radius:14px; display:block; margin:16px auto 0; cursor:zoom-in; }
.manual .m-img.tam-ch img{ max-height:200px; }
.manual .m-img.tam-gr img{ max-height:560px; }
.manual .m-img.tam-full img{ max-height:none; }
.manual .m-img figcaption{ font-size:12.5px; color:var(--ink2); text-align:center; margin-top:9px; font-weight:600; line-height:1.35; }
.manual .m-img .dl-btn{ margin-top:11px; }
/* ---- bloque VIDEO ----
   La caja toma la proporcion REAL del video (--arw/--arh que escribe el panel),
   asi que el video la llena: nunca deforma ni deja franjas negras, filmado
   vertical u horizontal.
   El tamano se controla capando el ANCHO derivado del alto (a un <video> con
   aspect-ratio no se lo puede capar por max-height: la caja igual ocuparia el
   100% del ancho y quedarian franjas a los costados).
   --alto = lo que elige el usuario; --tope = el limite de la ventana. Mandan
   las dos juntas via min(), asi el celular y la presentacion solo pisan --tope.
   OJO: todo el bloque va JUNTO y en este orden; si la regla de celular quedara
   antes que la de escritorio, la de escritorio la pisaria (misma especificidad). */
.manual .m-video{ text-align:center; margin:16px 0 0; --alto:360px; --tope:74vh; }
.manual .m-video.vert{ --alto:460px; }
.manual .m-video.tam-ch{ --alto:220px; }
.manual .m-video.tam-ch.vert{ --alto:300px; }
.manual .m-video.tam-gr{ --alto:520px; }
.manual .m-video.tam-gr.vert{ --alto:620px; }
.manual .m-video.tam-full{ --alto:1200px; }
.manual .m-video .v-box{ position:relative; margin:0 auto; border-radius:14px; overflow:hidden;
  background:#000; aspect-ratio:var(--arw,16)/var(--arh,9);
  /* los fallbacks son OBLIGATORIOS: sin ellos, un m-video al que le falte el
     style inline deja el max-width invalido y el video se estira a todo lo ancho */
  max-width:min(100%, calc(min(var(--alto), var(--tope))*var(--arw,16)/var(--arh,9))); }
.manual .m-video video, .manual .m-video iframe{ position:absolute; inset:0; width:100%; height:100%;
  border:0; display:block; object-fit:contain; background:#000; }
.manual .m-video figcaption{ font-size:12.5px; color:var(--ink2); text-align:center; margin-top:9px; font-weight:600; line-height:1.35; }
.manual .m-video .dl-btn{ margin-top:11px; }
/* red de seguridad: cualquier <video> suelto que entre por un bloque HTML libre */
.manual video{ max-width:100%; }
/* en un celular el video + el pie tienen que entrar sin scrollear */
@media (max-width:520px){ .manual .m-video{ --tope:66vh; } }
.manual .m-btn{ text-align:center; padding:10px 0; }
.manual .report-frame{ border-radius:14px; overflow:hidden; border:1px solid var(--border); margin:14px 0; }
.manual .report-frame iframe{ width:100%; border:0; display:block; height:460px; }
.manual .report-frame.report-sm iframe{ height:300px; }
.manual .report-frame.report-lg iframe{ height:680px; }
/* separador / linea divisoria: un poco mas gruesa y con aire arriba/abajo */
.manual .m-sep{ height:4px; background:var(--border); border-radius:3px; margin:18px 0; }
/* separadores ya publicados (estilo inline viejo height:1px): mismo look sin re-guardar */
.manual .db > div[style*="height:1px"][style*="--border"]{ height:4px !important; border-radius:3px; margin:18px 0; }
/* bloque PDF */
.manual .pdf-block{ margin:14px 0; }
.pdf-card{ width:100%; display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer; font:inherit; color:inherit;
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; transition:box-shadow .15s, transform .05s; }
.pdf-card:hover{ box-shadow:0 8px 26px rgba(0,0,0,.10); }
.pdf-card:active{ transform:scale(.995); }
.pdf-card .pdf-ic{ width:44px; height:44px; border-radius:11px; background:#e2483d; color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.pdf-card .pdf-ic .ico{ width:22px; height:22px; }
.pdf-card .pdf-meta{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.pdf-card .pdf-nombre{ font-weight:800; font-size:14.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pdf-card .pdf-sub{ font-size:12px; color:var(--ink3); font-weight:600; }
.pdf-card .pdf-arrow{ color:var(--ink3); flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
.pdf-card .pdf-ic .ico, .pdf-card .pdf-arrow .ico{ display:block; }
.pdf-card .pdf-arrow .ico{ width:17px; height:17px; }
.manual .pdf-dl{ text-align:center; margin-top:11px; }
#pdfview{ position:fixed; inset:0; z-index:210; background:rgba(0,0,0,.88); display:flex; flex-direction:column; }
#pdfview[hidden]{ display:none; }
.pv-bar{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:#1c1c1c; color:#fff; }
.pv-name{ flex:1; min-width:0; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pv-btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 11px; border-radius:9px; background:rgba(255,255,255,.14); color:#fff; border:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:700; text-decoration:none; }
.pv-btn:hover{ background:rgba(255,255,255,.24); }
.pv-btn .ico{ width:15px; height:15px; }
.pv-x{ padding:8px; }
@media (max-width:560px){ .pv-tx{ display:none; } }
.pv-frame{ flex:1; width:100%; border:0; background:#525659; }
/* plantilla WhatsApp (carrusel de tarjetas) */
/* ====== BLOQUE "Plantilla de WhatsApp" ======
   Se dibuja como la ve el cliente en WhatsApp. Prefijo `wt-` y NO `wa-`: el
   maquetado del telefono del Manual usa `wa-` para otra cosa y compartir las
   clases fue lo que rompio el diseno (los iconos se inflaban a 262px). */
.manual .wt{ margin:16px 0; max-width:400px; }
.manual .wt-cat{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:1px;
  text-transform:uppercase; color:#54656f; background:#fff; border:1px solid var(--border);
  border-radius:20px; padding:4px 11px; margin-bottom:8px; }
.manual .wt-msg{ display:flow-root; position:relative; background:#d9fdd3; border-radius:8px; border-top-right-radius:0;
  padding:7px 9px 7px 10px; box-shadow:0 1px .6px rgba(0,0,0,.16); color:#111b21;
  font-size:14.2px; line-height:1.42; }
.manual .wt-msg::after{ content:""; position:absolute; top:0; right:-8px; width:0; height:0;
  border:8px solid transparent; border-top-color:#d9fdd3; border-right-width:0; }
.manual .wt-hdr{ margin:-1px -3px 6px; border-radius:6px; overflow:hidden; aspect-ratio:1.91/1; background:#c9e7c2; }
.manual .wt-hdr img{ width:100%; height:100%; object-fit:cover; display:block; }
.manual .wt-hdrt{ font-weight:700; margin-bottom:3px; }
.manual .wt-body{ white-space:pre-wrap; }
.manual .wt-foot{ color:#667781; font-size:12.5px; margin-top:5px; }
.manual .wt-time{ float:right; font-size:10.5px; color:#667781; margin:6px -2px -2px 10px;
  display:inline-flex; align-items:center; gap:3px; }
.manual .wt-time svg{ width:15px; height:11px; stroke:#53bdeb; fill:none; stroke-width:2; }
.manual .wt-var{ background:rgba(0,0,0,.07); border-radius:4px; padding:0 3px; font-weight:600; }
.manual .wt-btns{ display:flex; flex-direction:column; gap:2px; margin-top:2px; }
.manual .wt-btn, .manual .wt-cbtn{ display:flex; align-items:center; justify-content:center; gap:7px;
  background:#fff; color:#00a5f4; font-size:14px; padding:9px; box-shadow:0 1px .6px rgba(0,0,0,.16); }
.manual .wt-btn{ border-radius:7px; }
.manual .wt-btn .ico, .manual .wt-cbtn .ico, .manual .wt-cimg .ico{ display:flex; flex:0 0 auto; }
.manual .wt-btn svg, .manual .wt-cbtn svg{ width:15px; height:15px; stroke:#00a5f4; fill:none; display:block; flex:0 0 auto; }
.manual .wt-car{ display:flex; gap:6px; overflow-x:auto; padding:6px 0 4px; scroll-snap-type:x mandatory; align-items:stretch; }
.manual .wt-car::-webkit-scrollbar{ height:0; }
.manual .wt-card{ display:flex; flex-direction:column; flex:0 0 210px; background:#fff; border-radius:8px; overflow:hidden;
  box-shadow:0 1px .6px rgba(0,0,0,.16); scroll-snap-align:start; }
.manual .wt-cimg{ aspect-ratio:1.91/1; background:#dfe5e7; display:grid; place-items:center; }
.manual .wt-cimg img{ width:100%; height:100%; object-fit:cover; display:block; }
.manual .wt-cimg svg{ width:28px; height:28px; stroke:#9aa7ad; fill:none; stroke-width:1.6; }
.manual .wt-cbody{ flex:1; padding:7px 9px 8px; font-size:13.2px; line-height:1.38; color:#111b21; white-space:pre-wrap; min-height:1.4em; }
.manual .wt-cbtns{ display:flex; flex-direction:column; }
.manual .wt-ph{ color:#9aa7ad; font-style:italic; }
.manual .wt-cbtn{ border-top:1px solid #e9edef; box-shadow:none; font-size:13.5px; padding:8px; }
.manual .wt-hint{ text-align:center; font-size:11px; color:var(--ink3); margin-top:3px; }

/* ---- carrusel de plantillas (bloque del panel) ----
   OJO: estas reglas van SCOPEADAS bajo .wa-carousel a propósito. Antes eran
   `.manual .wa-btn` a secas y, por ser más específicas, le ganaban al maquetado
   del teléfono de arriba (que usa las mismas clases para otra cosa): le sacaban
   el display:flex y los íconos se inflaban a 262px. Son dos componentes
   distintos que comparten nombre de clase; no se tocan porque están scopeados. */
.manual .wa-carousel{ display:flex; gap:10px; overflow-x:auto; padding:6px 2px 14px; margin-top:14px; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; }
.manual .wa-carousel .wa-card{ flex:0 0 260px; max-width:260px; background:#fff; border-radius:12px; overflow:hidden;
  box-shadow:0 1px .6px rgba(0,0,0,.16); scroll-snap-align:start; display:flex; flex-direction:column; }
.manual .wa-carousel .wa-img{ aspect-ratio:1.91/1; background:#dfe5e7; overflow:hidden; }
.manual .wa-carousel .wa-img img{ width:100%; height:100%; object-fit:cover; display:block; }
.manual .wa-carousel .wa-body{ padding:8px 10px 9px; font-size:14px; line-height:1.42; color:#111b21;
  background:none; display:block; flex:1; }
.manual .wa-carousel .wa-foot{ padding:0 10px 8px; font-size:12.5px; color:#667781; }
.manual .wa-carousel .wa-cbtns{ display:flex; flex-direction:column; }
.manual .wa-carousel .wa-btn{ display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px; border-top:1px solid #e9edef; color:#00a5f4; font-weight:500; font-size:14px;
  text-decoration:none; background:#fff; }
.manual .wa-carousel .wa-btn .ico, .manual .wa-carousel .wa-btn svg{ width:15px; height:15px; flex:0 0 auto; }
.manual .wa-carousel .wa-btn svg{ stroke:#00a5f4; fill:none; display:block; }
/* ---- BLOQUES DE DATOS (tabla / numeros / barras / podio / tarjetas) ----
   Los arma el panel de administracion. Las mismas reglas estan en
   herramientas/panel/web/styles.css bajo .doc-preview: si tocas una, toca la otra. */
.manual .m-tabla{ border:1px solid var(--border); border-radius:12px; overflow:hidden; overflow-x:auto; margin:14px 0; }
.manual .m-tabla table{ width:100%; border-collapse:collapse; min-width:380px; }
.manual .m-tabla thead{ background:var(--ink); }
.manual .m-tabla thead th{ padding:11px 14px; color:rgba(255,255,255,.72); text-align:left; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:1.1px; white-space:nowrap; }
.manual .m-tabla thead th.num{ text-align:right; }
.manual .m-tabla tbody tr:nth-child(odd){ background:var(--surface); }
.manual .m-tabla tbody tr:nth-child(even){ background:var(--bg2); }
.manual .m-tabla tbody td{ padding:10px 14px; color:var(--ink); border-bottom:1px solid rgba(0,0,0,.06); font-size:13.5px; font-weight:500; }
.manual .m-tabla tbody td.num{ text-align:right; font-weight:700; white-space:nowrap; }
.manual .m-tabla tbody tr.fx-ok td{ background:#E9F6EE; }
.manual .m-tabla tbody tr.fx-mal td{ background:#FCEDEC; }
.manual .m-tabla tbody tr.fx-total td{ background:var(--ink); color:#fff; font-weight:800; }
/* ---- tabla: ordenar tocando el titulo + buscador ----
   Solo aplica si el panel emitio el envoltorio .m-tablaw. Una tabla vieja no
   tiene ninguna de estas clases, asi que no cambia ni un pixel. */
.manual .m-tablaw{ margin:14px 0; }
.manual .m-tablaw .m-tabla{ margin:0; }
.manual .tb-bar{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
.manual .tb-q{ flex:1; min-width:170px; font:inherit; font-size:16px; padding:11px 13px; min-height:44px;
  border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--ink); box-sizing:border-box; }
.manual .tb-q:focus{ outline:none; border-color:var(--ink); }
.manual .tb-cont{ font-size:12px; color:var(--ink3); font-weight:700; }
.manual .tb-limpiar{ font:inherit; font-size:13px; font-weight:600; min-height:44px; padding:0 16px;
  border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--ink2); cursor:pointer; }
.manual .tb-limpiar:hover{ border-color:var(--ink); color:var(--ink); }
.manual .tb-pista{ font-size:11.5px; color:var(--ink3); margin:0 0 7px; }
.manual .tb-nada{ padding:18px; text-align:center; color:var(--ink3); font-size:13.5px;
  border:1px dashed var(--border); border-radius:12px; }
/* el titulo pasa a ser un boton de 44px (se toca comodo en el celular) */
.manual .m-tabla thead th.ord{ padding:0; }
.manual .m-tabla .th-b{ display:flex; align-items:center; gap:6px; width:100%; min-height:44px;
  padding:8px 14px; background:none; border:0; cursor:pointer; color:inherit; font:inherit;
  font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:1.1px; text-align:left; }
.manual .m-tabla thead th.num .th-b{ justify-content:flex-end; }
.manual .m-tabla .th-b:hover{ background:rgba(255,255,255,.09); }
.manual .m-tabla .th-c:before{ content:'\2195'; opacity:.45; font-size:11px; }
.manual .m-tabla th[aria-sort="descending"] .th-c:before{ content:'\25BC'; opacity:1; }
.manual .m-tabla th[aria-sort="ascending"] .th-c:before{ content:'\25B2'; opacity:1; }
.manual .m-tabla th[aria-sort="descending"], .manual .m-tabla th[aria-sort="ascending"]{ color:#fff; }
/* cebreado repintado por JS: al ocultar filas, nth-child dejaria huecos de color.
   VA DESPUES de las reglas nth-child de arriba, si no, no gana. */
.manual .m-tabla tbody tr.z0{ background:var(--surface); }
.manual .m-tabla tbody tr.z1{ background:var(--bg2); }

.manual .m-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:12px; margin:14px 0; }
.manual .m-kpis .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 12px; text-align:center; }
.manual .m-kpis .kpi.lead{ background:var(--ink); border-color:var(--ink); }
.manual .m-kpis .kl{ font-size:10.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--ink3); margin-bottom:6px; }
.manual .m-kpis .kpi.lead .kl{ color:rgba(255,255,255,.55); }
.manual .m-kpis .kv{ font-size:38px; font-weight:800; letter-spacing:-1.5px; line-height:1; color:var(--ink); }
.manual .m-kpis .kpi.lead .kv{ color:#fff; }
.manual .m-kpis .kt{ margin-top:8px; font-size:12px; font-weight:700; color:var(--ink3); min-height:1.1em; }
.manual .m-kpis .kt.t-up{ color:var(--c-success); } .manual .m-kpis .kt.t-down{ color:var(--c-danger); }
.manual .m-kpis .kpi.lead .kt{ color:rgba(255,255,255,.75); }

.manual .m-barras{ display:flex; flex-direction:column; gap:11px; margin:14px 0; }
.manual .m-barras .ba{ display:flex; align-items:center; gap:12px; }
.manual .m-barras .bl{ width:88px; flex:0 0 auto; text-align:right; font-size:13.5px; font-weight:700; color:var(--ink); }
.manual .m-barras .bt{ flex:1; min-width:0; height:38px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.manual .m-barras .bf{ height:100%; border-radius:10px; display:flex; align-items:center; padding:0 13px; min-width:46px; }
.manual .m-barras .bn{ font-size:15px; font-weight:800; color:#fff; white-space:nowrap; }
.manual .m-barras .br{ width:126px; flex:0 0 auto; }
.manual .m-barras .bchip{ display:inline-flex; padding:4px 10px; border-radius:30px; font-size:10.5px; font-weight:700; line-height:1.3; }
.manual .m-barras .bchip.g{ background:#D4EDDA; color:#145A2E; }
.manual .m-barras .bchip.y{ background:#FBE9C9; color:#7D5A08; }
.manual .m-barras .bchip.r{ background:#FADBD8; color:#922B21; }
.manual .m-barras .bchip.gr{ background:#E8E8E8; color:#555; }

.manual .m-podio{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:11px; margin:14px 0; }
.manual .m-podio .pod{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 10px; text-align:center; }
.manual .m-podio .pod.lead{ border:2px solid var(--c-success); }
.manual .m-podio .rank{ font-size:11px; font-weight:800; letter-spacing:1px; color:var(--ink3); }
.manual .m-podio .name{ font-size:15.5px; font-weight:800; color:var(--ink); margin:6px 0 1px; letter-spacing:-.3px; }
.manual .m-podio .suc{ font-size:10px; color:var(--ink3); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
.manual .m-podio .sales{ font-size:32px; font-weight:800; color:var(--ink); letter-spacing:-1.5px; margin-top:8px; line-height:1; }
.manual .m-podio .slbl{ font-size:10px; color:var(--ink3); font-weight:600; }
.manual .m-podio .cv{ margin-top:9px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; display:inline-block; background:#EFEBE4; color:var(--ink2); }
.manual .m-podio .pod.lead .cv{ background:#D4EDDA; color:#145A2E; }

.manual .m-tarj{ display:grid; gap:12px; margin:14px 0; }
.manual .m-tarj.cols-2{ grid-template-columns:repeat(2,1fr); }
.manual .m-tarj.cols-3{ grid-template-columns:repeat(3,1fr); }
.manual .m-tarj.cols-4{ grid-template-columns:repeat(4,1fr); }
.manual .m-tarj .tj{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 16px; display:flex; gap:14px; }
.manual .m-tarj.orient-v .tj{ flex-direction:column; }
.manual .m-tarj.orient-h .tj{ flex-direction:row; align-items:center; padding:14px 16px; }
.manual .m-tarj .tj-ic{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:#fff; flex:0 0 auto; }
.manual .m-tarj .tj-ic .ico{ width:22px; height:22px; }
.manual .m-tarj .tj-t{ font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.3px; }
.manual .m-tarj .tj-p{ font-size:12.5px; color:var(--ink3); line-height:1.5; margin-top:3px; }
@media(max-width:640px){
  .manual .m-tarj.cols-3, .manual .m-tarj.cols-4{ grid-template-columns:repeat(2,1fr); }
  .manual .m-barras .bl{ width:66px; font-size:12px; }
  .manual .m-barras .br{ width:auto; }
  .manual .m-barras .bchip{ font-size:9.5px; padding:3px 7px; }
  .manual .m-kpis .kv{ font-size:30px; }
}
@media(max-width:420px){ .manual .m-tarj{ grid-template-columns:1fr!important; } }

/* ---- BIBLIOTECA: indice de documentos de un modulo ---- */
.col-index{ display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:14px; margin-top:6px; }
.col-card{ position:relative; display:flex; flex-direction:column; gap:5px; text-align:left; font:inherit; cursor:pointer;
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 18px 18px;
  transition:box-shadow .15s, transform .06s; }
.col-card:hover{ box-shadow:0 10px 30px rgba(0,0,0,.10); }
.col-card:active{ transform:scale(.995); }
.col-card.destacada{ grid-column:1 / -1; background:var(--ink); border-color:var(--ink); padding:26px 24px 24px; }
.col-ult{ font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink);
  background:#fff; border-radius:20px; padding:4px 10px; align-self:flex-start; margin-bottom:4px; }
.col-ct{ font-size:17px; font-weight:800; color:var(--ink); letter-spacing:-.3px; line-height:1.2; }
.col-card.destacada .col-ct{ color:#fff; font-size:26px; }
.col-cm{ font-size:12px; color:var(--ink3); font-weight:600; }
.col-card.destacada .col-cm{ color:rgba(255,255,255,.6); }
.col-cir{ position:absolute; top:16px; right:16px; width:16px; height:16px; color:var(--ink3); }
.col-card.destacada .col-cir{ color:rgba(255,255,255,.5); }
.col-cir svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.col-back{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface);
  border-radius:10px; padding:9px 14px; font:inherit; font-size:13px; font-weight:700; color:var(--ink2);
  cursor:pointer; margin-bottom:14px; }
.col-back:hover{ color:var(--ink); border-color:var(--ink3); }
.dk-volver{ flex:0 0 auto; border:1px solid var(--border); background:var(--surface); border-radius:8px;
  padding:8px 13px; font:inherit; font-size:11.5px; font-weight:700; color:var(--ink2); cursor:pointer; }
.dk-volver:hover{ color:var(--ink); border-color:var(--ink3); }
@media(max-width:520px){
  .col-index{ grid-template-columns:1fr; }
  .col-card.destacada .col-ct{ font-size:21px; }
  .dk-volver{ padding:7px 10px; font-size:11px; }
}

/* ---- MODO PRESENTACION (un modulo se ve como diapositivas) ---- */
/* .sec-body en report-mode ya tiene alto definido (flex:1), asi que el deck usa height:100% */
.deck{ position:relative; height:100%; min-height:420px; display:flex; flex-direction:column; background:var(--bg); }
.deck .dk-slide{ display:none; }
.deck .dk-slide.on{ display:block; animation:dkIn .32s ease; }
@keyframes dkIn{ from{ opacity:0; transform:translateX(26px); } to{ opacity:1; transform:none; } }
/* "safe center" centra vertical si entra, y si no entra deja scrollear desde arriba */
.dk-stage{ flex:1; min-height:0; overflow-y:auto; padding:26px 28px 78px; display:flex; flex-direction:column; justify-content:safe center; }
.dk-stage .manual{ max-width:1000px; width:100%; margin:0 auto; flex-shrink:0; }
/* dentro de una diapositiva el alto util ya viene recortado por el padding del
   escenario (26px+78px): un video tiene que entrar sin empujar el resto afuera */
.dk-stage .manual .m-video{ --tope:60vh; }
.dk-bar{ position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px; padding:10px 16px;
  background:linear-gradient(to top, var(--bg) 62%, transparent); }
.dk-count{ font-size:11px; color:var(--ink3); letter-spacing:1.2px; font-weight:700; flex:0 0 auto; }
.dk-dots{ flex:1; display:flex; justify-content:center; gap:7px; flex-wrap:wrap; }
.dk-dot{ width:7px; height:7px; border-radius:50%; background:rgba(0,0,0,.18); border:none; padding:0; cursor:pointer; transition:.2s; }
.dk-dot.on{ background:var(--ink); transform:scale(1.4); }
.dk-navs{ display:flex; gap:8px; flex:0 0 auto; }
.dk-btn{ padding:9px 18px; border-radius:8px; border:1.5px solid var(--ink); background:transparent; color:var(--ink);
  font-size:12px; font-family:inherit; font-weight:700; cursor:pointer; letter-spacing:.4px; }
.dk-btn:hover{ background:var(--ink); color:var(--bg); }
.dk-btn:disabled{ opacity:.22; cursor:default; }
.dk-btn:disabled:hover{ background:transparent; color:var(--ink); }
.dk-prog{ position:absolute; top:0; left:0; height:3px; background:var(--ink); transition:width .3s ease; z-index:4; }
.dk-idx{ position:absolute; top:9px; right:14px; z-index:5; display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
  border-radius:9px; background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; }
.dk-idx .ico{ width:15px; height:15px; }
.dk-menu{ position:absolute; inset:0; z-index:9; display:none; }
.dk-menu.on{ display:block; }
.dk-menu-ov{ position:absolute; inset:0; background:rgba(0,0,0,.35); }
.dk-menu-p{ position:absolute; top:0; right:0; bottom:0; width:min(330px,86vw); background:var(--surface);
  border-left:1px solid var(--border); overflow-y:auto; padding:16px 0 20px; box-shadow:-10px 0 40px rgba(0,0,0,.16); }
.dk-menu-h{ display:flex; align-items:center; justify-content:space-between; padding:0 16px 12px; border-bottom:1px solid var(--border); }
.dk-menu-h b{ font-size:13px; }
.dk-menu-x{ border:none; background:none; font-size:19px; line-height:1; cursor:pointer; color:var(--ink3); padding:4px 8px; }
.dk-grp{ font-size:10px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink3); padding:16px 16px 6px; }
.dk-mi{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; border:none; background:none; cursor:pointer;
  padding:10px 16px; font:inherit; font-size:13.5px; color:var(--ink2); }
.dk-mi:hover{ background:var(--bg2); }
.dk-mi.on{ background:var(--bg2); color:var(--ink); font-weight:700; }
.dk-mi .mnum{ width:22px; height:22px; border-radius:50%; background:var(--bg2); color:var(--ink3); display:grid; place-items:center;
  font-size:10.5px; font-weight:800; flex:0 0 auto; }
.dk-mi.on .mnum{ background:var(--ink); color:#fff; }
@media(max-width:640px){
  .dk-stage{ padding:10px 14px 70px; }
  .dk-btn{ padding:9px 14px; font-size:11.5px; }
  .dk-dots{ display:none; }
}

/* contenido propio de modulos reemplazados desde el panel */
.free-content{ font-size:15px; line-height:1.7; color:var(--ink); }
.free-content h1,.free-content h2,.free-content h3{ line-height:1.25; margin:1.2em 0 .4em; }
.free-content p{ margin:0 0 1em; }
.free-content a{ color:var(--c-caba); }
.free-content ul,.free-content ol{ margin:0 0 1em; padding-left:1.3em; }
.free-content li{ margin:.3em 0; }
.free-content img{ max-width:100%; height:auto; border-radius:12px; }
.free-content b,.free-content strong{ font-weight:700; }

/* ===================================================================
   MURO: el feed de comunicacion interna.
   Un modulo de tipo "muro" guarda VARIOS posts (mismo formato que los
   documentos de una biblioteca, con autor y fecha). Se ven todos
   seguidos, el mas nuevo arriba, como en una red social.
   TODO el CSS del muro vive en este bloque y en ESTE orden: las reglas
   de celular van al final, si no las pisan las de escritorio.
   =================================================================== */
.muro{ max-width:660px; margin:0 auto; }

/* filtros por tipo de publicacion */
.mu-filtros{ display:flex; gap:8px; overflow-x:auto; padding:0 0 16px; scrollbar-width:none; }
.mu-filtros::-webkit-scrollbar{ display:none; }
.mu-chip{ flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; padding:8px 14px; min-height:38px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink2);
  font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:.2s; }
.mu-chip:hover{ border-color:var(--ink); color:var(--ink); }
.mu-chip.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
.mu-chip .pto{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.mu-chip.on .pto{ box-shadow:0 0 0 2px rgba(255,255,255,.5); }

/* la publicacion */
.mu-post{ background:var(--surface); border:1px solid var(--border); border-radius:16px;
  margin-bottom:18px; overflow:hidden; transition:.2s; }
.mu-post.oculto{ display:none; }
.mu-post.nueva{ border-color:rgba(26,74,138,.35); box-shadow:0 0 0 3px rgba(26,74,138,.07); }

.mu-head{ display:flex; align-items:flex-start; gap:12px; padding:16px 20px 0; }
.mu-av{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center;
  justify-content:center; color:#fff; font-weight:700; font-size:15px; letter-spacing:.5px; }
.mu-quien{ flex:1; min-width:0; }
.mu-autor{ font-size:14px; font-weight:700; color:var(--ink); line-height:1.3; }
/* una sola linea SIEMPRE: si no entra se recorta con puntos suspensivos. Si se
   deja envolver, el separador queda colgando solo al final del renglon. */
.mu-meta{ font-size:12px; color:var(--ink3); margin-top:2px; display:block;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mu-sep{ opacity:.5; margin:0 5px; }
.mu-marcas{ display:flex; align-items:center; gap:6px; flex:0 0 auto; padding-top:2px; }
.mu-tag{ display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
  font-size:11px; font-weight:700; letter-spacing:.5px; white-space:nowrap; }
.mu-tag .ico{ width:12px; height:12px; }
/* "NUEVO" avisa, no grita: si va en azul pleno le compite a la etiqueta de
   tipo y la pantalla queda con dos colores fuertes peleando. */
.mu-nueva{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
  background:#E9EDF6; color:#1A4A8A; font-size:10.5px; font-weight:700; letter-spacing:.5px; }
.mu-nueva::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--c-info); }
.mu-fijado{ display:inline-flex; align-items:center; gap:6px; padding:7px 17px; background:var(--bg2);
  border-bottom:1px solid var(--border2); font-size:11px; font-weight:700; color:var(--ink2); letter-spacing:.4px; }
.mu-fijado .ico{ width:13px; height:13px; }

/* titulo y cuerpo */
.mu-titulo{ font-size:18px; font-weight:700; line-height:1.32; letter-spacing:-.2px; color:var(--ink);
  padding:13px 20px 0; text-wrap:balance; }
.mu-cuerpo .m-p, .mu-cuerpo .m-lead{ text-wrap:pretty; }
.mu-cuerpo{ padding:10px 20px 4px; position:relative; }
.mu-cuerpo .manual{ font-size:14.5px; }
/* El feed muestra un ADELANTO, no la publicación entera: si cada tarjeta ocupa
   toda la pantalla, no se ve que hay más abajo y nadie baja.
   Con foto o video se corta más abajo: con el tope del texto se veía una
   franja de imagen sin sentido. */
.mu-cuerpo.recortado{ max-height:230px; overflow:hidden; }
.mu-cuerpo.recortado.con-media{ max-height:430px; }
.mu-cuerpo.recortado::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:72px;
  background:linear-gradient(to bottom, rgba(255,255,255,0), var(--surface) 88%); pointer-events:none; }
.mu-mas{ display:block; width:100%; padding:11px; min-height:44px; border:0; border-top:1px solid var(--border2);
  background:transparent; color:var(--c-caba); font-family:inherit; font-size:13px; font-weight:700;
  cursor:pointer; transition:.2s; }
.mu-mas:hover{ background:var(--bg2); }

/* ---- REACCIONES ----
   Un resumen arriba (cuántos reaccionaron) y los botones abajo. El color
   solo aparece cuando VOS reaccionaste: en reposo son grises, así una
   pantalla con diez publicaciones no se llena de azules y rojos. */
.mu-sum{ display:flex; align-items:center; gap:7px; padding:10px 20px 0; }
.mu-sum-ic{ display:flex; align-items:center; }
.mu-sum-ic span{ font-size:14px; line-height:1; }
.mu-sum-ic span + span{ margin-left:-2px; }
.mu-sum-n{ font-size:12.5px; color:var(--ink3); font-weight:600; font-variant-numeric:tabular-nums; }
.mu-sum-yo{ color:var(--ink2); }

/* ---- barrita flotante de reacciones (como la de WhatsApp) ---- */
.re-wrap{ position:relative; display:inline-flex; }
.re-abrir.on{ font-weight:700; color:var(--ink); border-color:var(--ink3); background:var(--bg2); }
.re-emo{ font-size:15px; line-height:1; }
.re-abrir.late .re-emo{ display:inline-block; animation:reLate .3s cubic-bezier(.2,1.6,.4,1); }
@keyframes reLate{ 40%{ transform:scale(1.45) } 100%{ transform:scale(1) } }

.re-bar{ position:absolute; bottom:calc(100% + 8px); left:-4px; z-index:30; display:flex; gap:2px;
  padding:6px; border-radius:999px; background:var(--surface); border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,.16); animation:reBarIn .18s cubic-bezier(.2,.9,.3,1) both; }
.re-bar.sale{ animation:reBarOut .14s ease-in forwards; }
@keyframes reBarIn{ from{ opacity:0; transform:translateY(8px) scale(.9) } to{ opacity:1; transform:none } }
@keyframes reBarOut{ to{ opacity:0; transform:translateY(5px) scale(.95) } }
.re-op{ width:40px; height:40px; border:0; border-radius:50%; background:transparent; cursor:pointer;
  font-size:21px; line-height:1; display:flex; align-items:center; justify-content:center;
  transition:background .15s, transform .15s cubic-bezier(.2,1.5,.4,1);
  animation:reOpIn .22s cubic-bezier(.2,1.4,.4,1) both; animation-delay:var(--d,0ms); }
@keyframes reOpIn{ from{ opacity:0; transform:scale(.4) translateY(6px) } to{ opacity:1; transform:none } }
.re-op:hover{ background:var(--bg2); transform:scale(1.18); }
.re-op:active{ transform:scale(.94); }
.re-op.on{ background:var(--bg2); box-shadow:inset 0 0 0 2px var(--ink); }
@media(prefers-reduced-motion:reduce){
  .re-bar, .re-op{ animation:none; }
  .re-op:hover{ transform:none; }
  .re-abrir.late .re-emo{ animation:none; }
}
/* el link se queda en su ícono: con cuatro botones el pie no entra en un celular */
.mu-acc.solo-ic{ padding:9px 11px; }
.mu-acc.solo-ic .ico{ width:16px; height:16px; }

/* acciones */
.mu-pie{ display:flex; align-items:center; gap:8px; padding:11px 20px 13px; border-top:1px solid var(--border2); }
.mu-acc{ display:inline-flex; align-items:center; gap:7px; padding:9px 14px; min-height:40px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink2); font-family:inherit;
  font-size:12.5px; font-weight:600; cursor:pointer; transition:.2s;
  /* sin esto "Me gusta" se parte en dos renglones dentro del botón */
  white-space:nowrap; flex:0 0 auto; }
.mu-acc:hover{ border-color:var(--ink); color:var(--ink); }
.mu-acc .ico{ width:15px; height:15px; flex:0 0 auto; }
/* OJO: la clase va prefijada. Un `.wa` suelto choca con el maquetado del
   telefono de WhatsApp del manual (`.wa{margin:18px auto}`) y descoloca el pie. */
.mu-acc.mu-wa:hover{ border-color:#25D366; color:#128C4A; }
.mu-acc.hecho{ border-color:var(--c-success); color:var(--c-success); }

/* estado vacio (ningun post pasa el filtro) */
.mu-vacio{ text-align:center; padding:44px 20px; color:var(--ink3); font-size:14px; }

/* ---- LOBBY: la portada ES el muro ----
   Arriba una fila de accesos a los modulos que se desliza con el dedo (el
   menu completo sigue estando en las tres rayitas), despues lo fijado en
   miniatura, y abajo el feed. */
#lobby[hidden]{ display:none; }
.lobby-t{ display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  max-width:660px; margin:0 auto 10px; }
.lobby-t b{ font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--ink3); }
.lobby-t a{ font-size:12.5px; font-weight:600; color:var(--c-caba); cursor:pointer; text-decoration:none; }

/* FIJADO: una franja fina, no una tarjeta. Se hace notar por el filo de color
   de la izquierda, no por ocupar lugar: lo del dia a dia tiene que entrar en
   la primera pantalla. */
.fijados{ max-width:660px; margin:0 auto 14px; }
.fijados[hidden]{ display:none; }
.fix-row{ display:flex; flex-direction:column; gap:7px; }
.fix-card{ width:100%; text-align:left; display:flex; align-items:center; gap:2px;
  padding:0 13px 0 0; min-height:46px; border-radius:10px; border:1px solid var(--border);
  border-left:3px solid var(--fx,#B4231F); background:var(--surface); cursor:pointer;
  font-family:inherit; transition:.2s; }
.fix-card:hover{ background:var(--bg2); }
.fix-ic{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:36px;
  color:var(--fx,#B4231F); }
.fix-ic .ico{ width:16px; height:16px; }
.fix-t{ flex:1; min-width:0; font-size:13px; font-weight:700; line-height:1.35; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:13px 8px 13px 0; }
.fix-ch{ flex:0 0 auto; color:var(--ink3); font-size:16px; transition:transform .22s; }
.fix-card.abierta{ background:var(--bg2); }
.fix-card.abierta .fix-ch{ transform:rotate(90deg); }
/* la publicacion fijada se despliega ACA abajo, sin sacarte de la portada */
.fix-abierto{ margin-top:12px; }
.fix-abierto:empty{ display:none; }

/* burbuja de no leidos en la tarjeta del hub */
/* va en el mismo lugar que la chapa "Nuevo" (no conviven: en la tarjeta del
   muro la cuenta de sin leer dice mas que un cartel generico) */
/* la grilla clasica solo se usa cuando NO hay muro; el atributo hidden tiene
   que ganarle al display:grid del autor */
.botonera[hidden]{ display:none; }

/* aviso de novedad sobre un modulo, en el menu (que es por donde se entra) */
.nav-item{ position:relative; }
.ni-pto{ position:absolute; top:14px; right:14px; width:9px; height:9px; border-radius:50%;
  background:var(--c-danger); }
/* contador de publicaciones sin leer en el boton Modulos */
.menu-n{ display:inline-flex; align-items:center; justify-content:center; min-width:19px; height:19px;
  padding:0 5px; margin-left:2px; border-radius:999px; background:var(--c-danger); color:#fff;
  font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }

/* ===================================================================
   BARRA DE ABAJO (solo celular)
   La navegación no se puede perder nunca: el vendedor entra 40 segundos
   entre un cliente y otro. Inicio / Buscar / Módulos siempre al alcance
   del pulgar.
   =================================================================== */
.tabbar{ display:none; }
@media(max-width:640px){
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex;
    background:rgba(255,255,255,.94); backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom,0px); }   /* barra del iPhone */
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:9px 4px 8px; min-height:56px; border:0; background:transparent;
    color:var(--ink3); font-family:inherit; cursor:pointer; position:relative;
    -webkit-tap-highlight-color:transparent; transition:color .18s; }
  .tab-ic{ width:23px; height:23px; }
  .tab-ic svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round; }
  .tab-t{ font-size:10.5px; font-weight:700; letter-spacing:.2px; }
  .tab.on{ color:var(--ink); }
  .tab.on .tab-ic svg{ stroke-width:2.1; }
  .tab:active .tab-ic{ transform:scale(.9); }
  .tab-n{ position:absolute; top:5px; left:50%; margin-left:5px; min-width:17px; height:17px;
    padding:0 5px; border-radius:999px; background:var(--c-danger); color:#fff; font-size:10px;
    font-weight:700; display:flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums; }
  .tab-n[hidden]{ display:none; }
  /* que la barra no tape el final del contenido */
  main{ padding-bottom:calc(78px + env(safe-area-inset-bottom,0px)); }
  /* en celular la navegacion vive abajo: arriba queda solo la marca */
  .top-r .buscar-btn, .top-r .menu-btn{ display:none; }
  /* la presentacion tiene su propia barra abajo */
  body.report-mode .tabbar{ display:none; }
}

/* ===================================================================
   BUSCADOR
   La idea es que RESPONDA: arriba va el fragmento de texto donde está lo
   que buscabas, no una lista de links que hay que ir abriendo. El
   vendedor lo usa parado frente al cliente.
   =================================================================== */
.buscar-btn{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px;
  border-radius:8px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink2);
  cursor:pointer; padding:0; transition:.2s; }
.buscar-btn:hover{ border-color:var(--ink); color:var(--ink); }
.buscar-btn .ico{ width:19px; height:19px; }

.buscador{ position:fixed; inset:0; z-index:120; }
.buscador[hidden]{ display:none; }
.bu-ov{ position:absolute; inset:0; background:rgba(17,17,17,.45); backdrop-filter:blur(2px);
  animation:buOv .2s ease both; }
@keyframes buOv{ from{ opacity:0 } }
.bu-panel{ position:absolute; left:50%; top:0; transform:translateX(-50%); width:min(720px,100%);
  max-height:100%; display:flex; flex-direction:column; background:var(--bg);
  border-radius:0 0 18px 18px; box-shadow:0 24px 60px rgba(0,0,0,.28);
  animation:buIn .24s cubic-bezier(.2,.9,.3,1) both; }
@keyframes buIn{ from{ opacity:0; transform:translateX(-50%) translateY(-14px) } }
.bu-head{ display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--surface);
  border-bottom:1px solid var(--border); border-radius:0 0 0 0; }
.bu-lupa{ width:20px; height:20px; color:var(--ink3); flex:0 0 auto; }
.bu-lupa svg{ width:100%; height:100%; }
.bu-input{ flex:1; min-width:0; border:0; background:transparent; font-family:inherit; font-size:16px;
  font-weight:600; color:var(--ink); outline:none; }
.bu-input::placeholder{ color:var(--ink3); font-weight:500; }
.bu-x{ flex:0 0 auto; width:36px; height:36px; border-radius:8px; border:0; background:var(--bg2);
  color:var(--ink2); font-size:15px; cursor:pointer; }
.bu-x:hover{ background:var(--ink); color:#fff; }
.bu-body{ overflow-y:auto; padding:14px 16px 22px; -webkit-overflow-scrolling:touch; }

/* la respuesta: el pedazo de texto donde está lo que buscaba */
.bu-resp{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--c-canning);
  border-radius:14px; padding:15px 17px; margin-bottom:16px; }
.bu-resp-d{ font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
  color:var(--c-canning); margin-bottom:8px; }
.bu-resp-t{ font-size:15.5px; font-weight:700; color:var(--ink); line-height:1.35; }
.bu-resp-x{ font-size:14.5px; line-height:1.6; color:var(--ink2); margin-top:8px; }
.bu-ir{ display:inline-flex; align-items:center; gap:7px; margin-top:12px; padding:9px 15px; min-height:40px;
  border-radius:9px; border:0; background:var(--ink); color:#fff; font-family:inherit; font-size:12.5px;
  font-weight:700; cursor:pointer; }
.bu-ir .ico{ width:14px; height:14px; }

.bu-t{ font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink3);
  margin:16px 2px 8px; }
.bu-item{ width:100%; text-align:left; display:flex; align-items:flex-start; gap:11px; padding:12px 14px;
  border-radius:12px; border:1px solid var(--border); background:var(--surface); cursor:pointer;
  font-family:inherit; margin-bottom:8px; transition:.15s; }
.bu-item:hover{ border-color:var(--ink); }
.bu-ic{ width:34px; height:34px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center;
  justify-content:center; color:#fff; }
.bu-ic .ico{ width:16px; height:16px; }
.bu-img{ width:44px; height:44px; border-radius:8px; object-fit:cover; flex:0 0 auto; background:var(--bg2); }
.bu-tx{ flex:1; min-width:0; }
.bu-n{ font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.3; }
/* el fragmento de un resultado de la lista se queda en 3 renglones: si no,
   un modulo largo se come toda la pantalla y tapa a los demas */
.bu-d{ font-size:12.5px; color:var(--ink3); line-height:1.45; margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* la X nativa del campo de búsqueda sobra: ya hay una para cerrar */
.bu-input::-webkit-search-cancel-button, .bu-input::-webkit-search-decoration{ -webkit-appearance:none; }
.bu-body mark{ background:#FFF0B3; color:inherit; border-radius:3px; padding:0 2px; }
.bu-vacio{ text-align:center; color:var(--ink3); font-size:14px; padding:32px 16px; }
/* al llegar desde el buscador, la publicación se señala sola un momento */
.mu-post.destacado{ box-shadow:0 0 0 3px rgba(58,122,85,.5); }
.bu-tip{ font-size:12.5px; color:var(--ink3); line-height:1.6; }
.bu-tip b{ color:var(--ink2); }

@media(max-width:640px){
  .bu-panel{ height:100%; max-height:none; border-radius:0; }
  .bu-head{ padding:12px 14px; }
  .bu-input{ font-size:16px; }   /* menos de 16px hace que iOS haga zoom al tocar */
  .bu-body{ padding:12px 14px 30px; }
}

/* ---- lectura obligatoria: una CHAPA CHICA, no una caja ----
   Se marca sola cuando la publicación se queda un rato en pantalla; el
   toque queda como atajo para quien quiera dejarlo hecho enseguida. */
.mu-lec{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px;
  border:1px solid rgba(154,106,0,.35); background:#FBF6E7; color:#8A6000;
  font-family:inherit; font-size:11px; font-weight:700; letter-spacing:.3px; cursor:pointer;
  white-space:nowrap; transition:.18s; }
.mu-lec:hover{ background:#F6EDD6; }
.mu-lec .ico{ width:12px; height:12px; }
.mu-lec.ok{ background:#EAF3EC; border-color:rgba(26,106,58,.3); color:var(--c-success); cursor:default; }
.mu-lec.recien{ animation:lecOk .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes lecOk{ 45%{ transform:scale(1.12) } 100%{ transform:scale(1) } }

/* el anillo que se llena mientras la publicación está a la vista: cuando
   termina de dar la vuelta, se da por leída y se convierte en un tilde */
.lec-ring{ margin-left:auto; width:26px; height:26px; flex:0 0 auto; position:relative;
  opacity:0; transform:scale(.7); transition:opacity .2s, transform .2s; pointer-events:none; }
.lec-ring.viendo{ opacity:1; transform:none; }
/* OJO con el `>`: la vuelta de -90° es SOLO para el aro (para que empiece a
   llenarse desde arriba). Sin el `>` alcanzaba también al SVG del tilde, que
   quedaba girado y corrido: se veía un ">" en vez de un ✓. */
.lec-ring > svg{ width:100%; height:100%; transform:rotate(-90deg); }
.lec-ring > svg circle{ fill:none; stroke-width:3; }
.lec-ring > svg .pista{ stroke:var(--border); }
.lec-ring > svg .prog{ stroke:var(--c-warn); stroke-linecap:round;
  stroke-dasharray:94.2; stroke-dashoffset:94.2; }
.lec-ring.viendo .prog{ animation:lecCarga var(--tlec,2000ms) linear forwards; }
@keyframes lecCarga{ to{ stroke-dashoffset:0 } }
.lec-ok{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--c-success); opacity:0; transform:scale(.5); }
.lec-ok .ico{ width:15px; height:15px; }
.lec-ring.listo .prog{ stroke:var(--c-success); animation:none; stroke-dashoffset:0; }
.lec-ring.listo .lec-ok{ opacity:1; transform:none; transition:.28s cubic-bezier(.2,1.5,.4,1); }
.lec-ring.listo{ opacity:1; transform:none; }
@media(prefers-reduced-motion:reduce){
  .lec-ring, .lec-ring.viendo .prog{ transition:none; }
}

/* aviso arriba de todo: te faltan confirmar cosas */
.pendientes{ display:flex; align-items:center; gap:11px; max-width:660px; margin:0 auto 14px;
  padding:12px 14px; border-radius:13px; background:#FBF6E7; border:1px solid rgba(154,106,0,.3); }
.pendientes[hidden]{ display:none; }
.pe-ic{ width:32px; height:32px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center;
  justify-content:center; background:var(--c-warn); color:#fff; }
.pe-ic .ico{ width:16px; height:16px; }
.pe-tx{ flex:1; min-width:0; font-size:13px; line-height:1.4; color:var(--ink); }
.pe-d{ display:block; font-size:12px; color:var(--ink3); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; margin-top:1px; }
.pe-btn{ flex:0 0 auto; padding:9px 15px; min-height:38px; border-radius:9px; border:0;
  background:var(--c-warn); color:#fff; font-family:inherit; font-size:12.5px; font-weight:700;
  cursor:pointer; }

/* ---- BARRA DE AVISO: "hay algo nuevo en otro modulo" ----
   Vive pegada abajo del encabezado. No interrumpe la lectura del feed, pero
   no se puede ignorar. Se cierra y no vuelve a molestar por ese cambio. */
/* NO va pegada al scroll: quedaba flotando sobre el feed y tapaba el
   encabezado de la publicación que estabas leyendo. Es un aviso, no una
   barra de navegación: se lee al entrar y se va. */
.noti{ display:flex; align-items:center; gap:11px;
  max-width:660px; margin:0 auto 16px; padding:12px 14px; border-radius:13px;
  background:var(--c-hudson); color:#fff; box-shadow:0 8px 24px rgba(26,26,46,.20);
  animation:notiEntra .42s cubic-bezier(.2,.9,.3,1) both; }
.noti[hidden]{ display:none; }
.noti-ic{ width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center;
  justify-content:center; background:rgba(255,255,255,.16); }
.noti-ic .ico{ width:16px; height:16px; }
.noti-tx{ flex:1; min-width:0; font-size:13px; line-height:1.35; }
.noti-tx b{ font-weight:700; }
.noti-ver{ flex:0 0 auto; padding:8px 14px; min-height:38px; border-radius:9px; border:0;
  background:#fff; color:var(--c-hudson); font-family:inherit; font-size:12.5px; font-weight:700;
  cursor:pointer; transition:.2s; }
.noti-ver:hover{ transform:translateY(-1px); }
.noti-x{ flex:0 0 auto; width:32px; height:32px; border-radius:8px; border:0; background:transparent;
  color:rgba(255,255,255,.75); font-size:17px; cursor:pointer; transition:.2s; }
.noti-x:hover{ background:rgba(255,255,255,.14); color:#fff; }
.noti.sale{ animation:notiSale .3s ease-in forwards; }
@keyframes notiEntra{ from{ opacity:0; transform:translateY(-14px) } to{ opacity:1; transform:none } }
@keyframes notiSale{ to{ opacity:0; transform:translateY(-10px); margin-bottom:-56px } }

/* ---- MOVIMIENTO ----
   Poco y sobrio: las publicaciones aparecen al entrar en pantalla, y lo que
   se despliega entra desde arriba. Nada gira ni rebota. */
@keyframes postEntra{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
.mu-post.entra{ animation:postEntra .42s cubic-bezier(.2,.9,.3,1) both; }
.mu-post.asoma{ opacity:0; }
.mu-post.asomo{ animation:postEntra .5s cubic-bezier(.2,.9,.3,1) both; }
.acc-card, .fix-card, .mu-chip, .mu-acc{ -webkit-tap-highlight-color:transparent; }
.acc-card:active, .fix-card:active{ transform:scale(.97); }
.mu-acc:active{ transform:scale(.96); }
/* quien pidió menos movimiento en su celular, no lo tiene */
@media(prefers-reduced-motion:reduce){
  .mu-post.entra, .mu-post.asomo, .noti{ animation:none; }
  .mu-post.asoma{ opacity:1; }
  .acc-card:active, .fix-card:active, .mu-acc:active{ transform:none; }
}

@media(max-width:640px){
  .noti{ max-width:none; top:58px; }
  .muro{ max-width:none; }
  .lobby-t, .fijados{ max-width:none; }

  /* ---- EN CELULAR EL FEED VA DE BORDE A BORDE ----
     Nada de tarjetas flotando con aire a los costados: la publicación ocupa
     todo el ancho de la pantalla, y lo que separa una de otra es un espacio
     de fondo y una línea. En ESCRITORIO no cambia nada: esto vive solo acá
     adentro. El -18px sale del padding lateral de `main` en pantalla chica. */
  .muro{ margin-left:-18px; margin-right:-18px; }
  /* los filtros y los carteles no: siguen alineados con el resto */
  .mu-filtros{ padding-left:18px; padding-right:18px; }
  .muro > .pending, .mu-vacio{ margin-left:18px; margin-right:18px; }

  .mu-post{ border-radius:0; border-left:0; border-right:0; border-top:0;
    border-bottom:1px solid var(--border); margin-bottom:0; }
  .mu-post + .mu-post{ margin-top:10px; }      /* el espacio entre publicaciones */
  /* sin bordes laterales, "sin leer" se marca con un filo en toda la
     publicación (marcar solo el título dejaba una rayita suelta al costado) */
  .mu-post.nueva{ box-shadow:inset 3px 0 0 var(--c-info); }

  /* las fotos llegan hasta el filo de la pantalla */
  .mu-cuerpo .m-img{ margin-left:-16px; margin-right:-16px; }
  .mu-cuerpo .m-img img{ max-width:none; width:100%; max-height:none; border-radius:0;
    margin-top:14px; }
  .mu-cuerpo .m-video{ margin-left:-16px; margin-right:-16px; }
