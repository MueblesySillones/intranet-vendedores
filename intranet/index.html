  .mu-cuerpo .m-video video, .mu-cuerpo .m-video iframe{ border-radius:0; }
  /* las placas para descargar también, pero conservando su pie con el botón.
     Va scopeado a .mu-cuerpo: el módulo "Material descargable" no se toca. */
  .mu-cuerpo .gallery{ margin-left:-16px; margin-right:-16px; gap:10px; }
  .mu-cuerpo .gcard{ border-radius:0; border-left:0; border-right:0; }
  .mu-cuerpo .gcard .gimg{ aspect-ratio:auto; max-height:70vh; object-fit:contain; }
  /* la fijada, al desplegarse, se ve igual que una publicación del feed */
  .fix-abierto{ margin-left:-18px; margin-right:-18px; }
  .fix-abierto .mu-post{ border-top:1px solid var(--border); }
  /* en celular las chapas se llevaban el ancho y la fecha salia cortada
     ("Central · Ay..."): bajan a su propia linea, sangradas con el texto */
  .mu-head{ padding:14px 16px 0; gap:10px; flex-wrap:wrap; }
  .mu-marcas{ order:3; width:100%; padding:2px 0 0 48px; }
  .mu-av{ width:38px; height:38px; font-size:14px; }
    /* BUG PREEXISTENTE (lo encontro el test de regresion): con el boton "Volver
     a la lista" -que solo aparece cuando la presentacion se abre desde una
     biblioteca- la barra del deck mide 418px en un celular de 390 y "Siguiente"
     queda cortado contra el borde. Se deja envolver y se achica el volver. */
  .dk-bar{ flex-wrap:wrap; row-gap:8px; }
  .dk-volver{ padding:8px 10px; font-size:11px; max-width:48%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .dk-navs{ margin-left:auto; }
  .mu-titulo{ font-size:16.5px; padding:12px 16px 0; }
  .mu-cuerpo{ padding:9px 16px 4px; }
  .mu-cuerpo.recortado{ max-height:210px; }
  .mu-cuerpo.recortado.con-media{ max-height:390px; }
  .mu-pie{ padding:10px 16px 12px; gap:7px; }
  .mu-acc{ padding:9px 12px; font-size:12px; }
  /* con cuatro botones no entran los cuatro rotulos: "Compartir" se queda con
     su icono de WhatsApp, que se reconoce solo. Los de reaccion SI conservan
     el texto: son los que hay que aprender a usar. */

  whatsapp: `
  <div class="manual">

    <p class="m-lead"><b>WhatsApp es nuestra mejor herramienta para acercar al cliente a la compra,</b> pero tiene reglas claras. Entenderlas no te limita: te da poder. El cliente nos abre la puerta cuando nos escribe, y tenemos 24 horas para charlar con total libertad. Pasado ese tiempo, todavía podemos volver a contactarlo de forma legal con plantillas aprobadas.</p>

    <div class="note">${svg(I.clock)}<div class="nt"><b>La idea en una frase:</b> el cliente abre la puerta cuando nos escribe, la aprovechamos dentro de las 24h, y la reabrimos con plantillas cuando hace falta. Todo lo demás cuelga de ahí.</div></div>

    <div class="m-block">
      <div class="m-kicker"><span class="n">1</span> LA HERRAMIENTA</div>
      <div class="m-h">Qué es WhatsApp Business API y por qué la usamos</div>
      <p class="m-sub">Existen tres WhatsApp distintos: el personal, la app Business (gratis, para un negocio chico en un solo teléfono) y la Business Platform, llamada API. Nosotros usamos la API porque está hecha para crecer.</p>
      <p class="m-p">La diferencia central es la escala. La app gratis funciona en un teléfono principal más hasta 4 dispositivos: todos ven los mismos chats, pero nadie sabe quién respondió a quién. Con la API, muchos vendedores atienden el mismo número a la vez sin pisarse, con la consulta de cada cliente registrada y medible en el sistema.</p>
      <p class="m-p">La API no se baja de una tienda de apps: se conecta a través de un proveedor oficial (BSP) o un CRM. Esto nos da algo clave para una mueblería: <b>profesionalismo y confianza</b>. Perfil de empresa, catálogo y el tilde de Cuenta Oficial verificada le dicen al cliente que habla con un negocio serio.</p>

      <div class="benefits">
        <div class="benefit"><div class="bi">${svg(I.users)}</div><div><div class="bt">1 número, vendedores ilimitados</div><div class="bd">Trabajan en simultáneo sin perder ninguna consulta</div></div></div>

        <div class="benefit"><div class="bi">${svg(I.verified)}</div><div><div class="bt">Cuenta Oficial verificada</div><div class="bd">El tilde da confianza para que el cliente compre</div></div></div>
        <div class="benefit"><div class="bi">${svg(I.store)}</div><div><div class="bt">Siempre vía proveedor</div><div class="bd">Se opera por un BSP o CRM, no desde el teléfono</div></div></div>
      </div>

      <div class="note">${svg(I.check)}<div class="nt"><b>Dato:</b> en la API NO existe el viejo límite de 256 contactos. Ese tope es de las listas de difusión de la app del celular, no del sistema que usamos nosotros. La Cloud API está disponible para todas las empresas desde mayo de 2022.</div></div>
    </div>

    <div class="m-block">
      <div class="m-kicker"><span class="n">2</span> LA REGLA DE ORO</div>
      <div class="m-h">La regla de las 24 horas: el cliente abre la puerta</div>
      <p class="m-sub">Cada vez que un cliente nos escribe o nos llama, se abre un reloj de 24 horas: la ventana de servicio. Mientras corre, respondemos con lo que queramos.</p>
      <p class="m-p">Texto, fotos del sillón, audios, videos, precios, ubicación de la sucursal: libertad total y sin costo. El reloj se cuenta desde el ÚLTIMO mensaje del cliente, no desde el nuestro.</p>

      <div class="flow">
        <div class="step"><div class="si" style="background:var(--c-success)">${svg(I.chatBubble)}</div><div class="st">Cliente escribe</div><div class="sd">Se abre la ventana de 24h</div></div>
        <div class="arrow">${svg(I.arrowR)}</div>
        <div class="step"><div class="si" style="background:var(--c-caba)">${svg(I.clock)}</div><div class="st">Tenés 24h</div><div class="sd">Fotos, precios y propuestas, gratis</div></div>
        <div class="arrow">${svg(I.arrowR)}</div>
        <div class="step"><div class="si" style="background:var(--c-canning)">${svg(I.refresh)}</div><div class="st">Responde de nuevo</div><div class="sd">El reloj vuelve a cero: +24h</div></div>
        <div class="arrow">${svg(I.arrowR)}</div>
        <div class="step"><div class="si" style="background:var(--c-danger)">${svg(I.lock)}</div><div class="st">Pasan 24h sin respuesta</div><div class="sd">La ventana se cierra: solo plantillas</div></div>
      </div>

      <p class="m-p"><b>Importante:</b> que nosotros contestemos NO estira la ventana. Lo único que vuelve el reloj a cero es que el cliente responda. Si la ventana está cerrada e intentás escribir libre, WhatsApp rechaza el mensaje y NO se entrega (error 131047, "mensaje de reenganche").</p>

        <div class="ci">${svg(I.check)} Se cuenta desde el último mensaje DEL CLIENTE</div>
        <div class="ci">${svg(I.check)} Cada respuesta del cliente reinicia el reloj a 24h</div>

      <p class="m-p">Las tres categorías están vigentes desde junio de 2023. <b>Para difundir productos de la mueblería usamos siempre Marketing.</b> Toda plantilla pasa por revisión: muchas se aprueban en minutos de forma automática; si hace falta revisión humana, puede tardar hasta 48 horas.</p>

const botonera = document.getElementById('botonera');
function seccionLista(t){ return t.ready || ((window.GALLERIES||{})[t.key]||[]).length>0; }
/* ---- NOVEDADES ----
   El panel guarda en cada modulo la fecha del ultimo cambio (`actualizado`).
   Con eso el vendedor ve de un vistazo QUE se movio desde la ultima vez que
   entro, en vez de tener que abrir todo para descubrirlo. */
const DIAS_NOVEDAD = 14;
/* Se comparan DIAS DE CALENDARIO, no milisegundos: si se mezcla la fecha
   guardada con la hora local, un cambio de hoy puede dar -1 dia y quedar
   afuera de las novedades. */
function diasDesde(f){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f||'')) return null;
  const p = f.split('-').map(Number);
  const cuando = Date.UTC(p[0], p[1]-1, p[2]);
  const h = new Date();
  const hoy = Date.UTC(h.getFullYear(), h.getMonth(), h.getDate());
  return Math.round((hoy - cuando) / 86400000);
}
function esNovedad(key){
  const m = MODMAP[key];
  if(!m) return false;
  const d = diasDesde(m.actualizado);
  return d !== null && d <= DIAS_NOVEDAD;   // negativo = guardado hoy en otra franja horaria
}
function textoNovedad(key){
  const d = diasDesde((MODMAP[key]||{}).actualizado);
  if(d === null) return '';
  if(d <= 0) return 'Actualizado hoy';
  if(d === 1) return 'Actualizado ayer';
  if(d <= 7) return 'Actualizado hace ' + d + ' días';
  return 'Actualizado hace ' + Math.round(d/7) + ' semanas';
}

/* ---- tablas: ordenar tocando el titulo + buscador ----
   Todo por delegacion en document: #secBody.innerHTML se reescribe entero en
   cada navegacion, asi que cualquier listener colgado de un nodo concreto se
   perderia. Una tabla sin el envoltorio .m-tablaw nunca entra por aca. */
(function(){
  function pelado(s){
    return (s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }
  // "1.116" -> 1116 ; "4,5%" -> 4.5 ; "$ 2.300" -> 2300 ; "Hudson" -> null
  function aNumero(v){
    var t = String(v==null?'':v).replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,'');
    if(!t || t==='-' || t==='.') return null;
    var n = parseFloat(t);
    return isFinite(n) ? n : null;
  }
  var esTotal = function(tr){ return tr.classList.contains('fx-total'); };

  function guardarOriginal(tb){
    if(tb.dataset.ini) return;
    tb.dataset.ini = '1';
    [].forEach.call(tb.rows, function(tr,i){ tr.dataset.o = i; });
  }
  // si el dueno marco "Son numeros" mandamos eso; si no, se mira el contenido
  function columnaNumerica(tabla, ci){
    var th = tabla.querySelectorAll('thead th')[ci];
    if(th && th.classList.contains('num')) return true;
    var n=0, tot=0;
    [].forEach.call(tabla.tBodies[0].rows, function(tr){
      if(esTotal(tr)) return;
      var c = tr.cells[ci]; if(!c) return;
      var t = c.textContent.trim(); if(!t) return;
      tot++; if(aNumero(t)!==null) n++;
    });
    return tot>0 && n/tot >= 0.6;
  }
  function cebrear(tb){
    var k=0;
    [].forEach.call(tb.rows, function(tr){
      tr.classList.remove('z0','z1');
      if(tr.hidden) return;
      tr.classList.add(k%2 ? 'z1' : 'z0'); k++;
    });
  }
  function ordenar(tabla, ci, dir){
    var tb = tabla.tBodies[0];
    guardarOriginal(tb);
    var num = columnaNumerica(tabla, ci);
    var normales = [].filter.call(tb.rows, function(tr){ return !esTotal(tr); });
    var totales  = [].filter.call(tb.rows, esTotal);
    var orig = function(a,b){ return (+a.dataset.o) - (+b.dataset.o); };
    if(!dir){ normales.sort(orig); }
    else {
      normales.sort(function(a,b){
        var va = ((a.cells[ci]||{}).textContent||'').trim();
        var vb = ((b.cells[ci]||{}).textContent||'').trim();
        if(!va && !vb) return orig(a,b);
        if(!va) return 1;                       // las vacias SIEMPRE al final
        if(!vb) return -1;
        var r;
        if(num){
          var na = aNumero(va), nb = aNumero(vb);
          if(na===null && nb===null) r = 0;
          else if(na===null) return 1;
          else if(nb===null) return -1;
          else r = na - nb;
        } else {
          r = pelado(va).localeCompare(pelado(vb), 'es');
        }
        if(!r) return orig(a,b);
        return dir==='asc' ? r : -r;
      });
    }
    normales.concat(totales).forEach(function(tr){ tb.appendChild(tr); });   // la fila TOTAL siempre abajo
    [].forEach.call(tabla.querySelectorAll('thead th'), function(th,i){
      th.setAttribute('aria-sort', (i===ci && dir) ? (dir==='asc'?'ascending':'descending') : 'none');
    });
    cebrear(tb);
  }
  function filtrar(w){
    var q = w.querySelector('.tb-q');
    var tabla = w.querySelector('table'); if(!tabla || !tabla.tBodies[0]) return;
    var tb = tabla.tBodies[0];
    var palabras = pelado(q ? q.value : '').split(/\s+/).filter(Boolean);
    var visibles = 0, normales = 0;
    [].forEach.call(tb.rows, function(tr){
      // el TOTAL se esconde mientras haya filtro: un total que no suma lo que se ve, miente
      if(esTotal(tr)){ tr.hidden = palabras.length > 0; return; }
      normales++;
      var txt = pelado(tr.textContent);
      var pasa = palabras.every(function(p){ return txt.indexOf(p) !== -1; });
      tr.hidden = !pasa;
      if(pasa) visibles++;
    });
    var vacio = palabras.length > 0 && visibles === 0;
    var cont = w.querySelector('.tb-cont');
    if(cont) cont.textContent = palabras.length ? (visibles + ' de ' + normales) : '';
    var lim = w.querySelector('.tb-limpiar');
    if(lim) lim.hidden = !palabras.length;
    var nada = w.querySelector('.tb-nada');
    if(nada) nada.hidden = !vacio;
    var caja = w.querySelector('.m-tabla');
    if(caja) caja.hidden = vacio;
    cebrear(tb);
  }

  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var b = e.target.closest('.m-tablaw .th-b');
    if(b){
      var th = b.closest('th'), tabla = b.closest('table');
      var ci = [].indexOf.call(th.parentNode.children, th);
      var est = th.getAttribute('aria-sort');
      // primer toque: los numeros arrancan de mayor a menor, los textos de A a Z
      var dir = est==='none' ? (columnaNumerica(tabla, ci) ? 'desc' : 'asc')
              : (est==='descending' ? 'asc' : (est==='ascending' ? '' : 'desc'));
      ordenar(tabla, ci, dir);
      return;
    }
    var lim = e.target.closest('.m-tablaw .tb-limpiar');
    if(lim){
      var w = lim.closest('.m-tablaw'), q = w.querySelector('.tb-q');
      if(q){ q.value = ''; q.focus(); }
      filtrar(w);
    }
  });
  document.addEventListener('input', function(e){
    if(!e.target.closest) return;
    var q = e.target.closest('.m-tablaw .tb-q');
    if(q) filtrar(q.closest('.m-tablaw'));
  });
})();

function plegarGalerias(root, key){
  root.querySelectorAll('.gallery').forEach((gal, i)=>{
    const head = gal.previousElementSibling;
    if(!head || !head.classList.contains('m-kicker') || head.dataset.pleg) return;
    head.dataset.pleg = '1';
    head.classList.add('plegable');
    const wrap = head.parentElement;                 // .dl-section o .m-block
    const n = gal.querySelectorAll('.gcard').length;
    const badge = document.createElement('span'); badge.className='pleg-count'; badge.textContent = n;
    const chev = document.createElement('span'); chev.className='pleg-chev'; chev.setAttribute('aria-hidden','true'); chev.textContent='▾';
    head.append(badge, chev);
    head.setAttribute('role','button'); head.setAttribute('tabindex','0');
    const lsKey = 'pleg:'+key+':'+i;
    try{ if(localStorage.getItem(lsKey)==='1') wrap.classList.add('cerrada'); }catch(e){}
    const toggle = ()=>{ const c = wrap.classList.toggle('cerrada'); try{ localStorage.setItem(lsKey, c?'1':'0'); }catch(e){} };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });

/* ---- modulos editables desde el panel (modulos.js -> window.MODULES) ----
   Reconstruye TILES/MAP a partir de la lista guardada por el panel y suma el
   cuerpo (body) de los modulos personalizados a CONTENT. Si modulos.js no existe
   o esta vacio, se usan los TILES por defecto definidos arriba (compatibilidad). */
function applyModules(){
  /* muro-demo.js solo existe en la rama donde se esta probando el muro. En
     produccion el archivo no esta y esto no hace nada. */
  if(window.MURO_DEMO && Array.isArray(window.MODULES) && !window.MODULES.some(m => m.key === window.MURO_DEMO.key))
    window.MODULES.unshift(window.MURO_DEMO);
  const M = window.MODULES;
  if(!Array.isArray(M) || !M.length) return;
  TILES = M.filter(m=>!m.hidden).map((m,i)=>({
    key:m.key, n:i+1, title:m.title, desc:m.desc,
    color:m.color, icon:(I[m.icon]?m.icon:'layers'), ready:!!m.ready
  }));
  MAP = Object.fromEntries(TILES.map(t=>[t.key,t]));
  MODMAP = Object.fromEntries(M.map(m=>[m.key, m]));
  /* compatibilidad: módulos viejos con "body" -> content de tipo html */
  M.forEach(m=>{ if(!m.content && !m.builtin && typeof m.body==='string' && m.body.trim()) m.content={tipo:'html', html:m.body}; });
}

/* Cuerpo de un módulo cuyo contenido fue definido/reemplazado desde el panel */

  if(c.tipo==='coleccion') return indiceHTML(c);

  if(c.tipo==='bloques') return `<div class="manual">${c.html||''}</div>`;
  if(c.tipo==='html')   return `<div class="free-content">${c.html||''}</div>`;
  if(c.tipo==='embed')  return `<div class="report-stage"><iframe src="${esc(c.url||'')}" title="${esc(t.title)}" loading="lazy"></iframe></div>`;
  if(c.tipo==='imagen') return c.src ? galleryGrid([{file:c.src, title:t.title, download:c.download||t.title}]) : pendingHTML(t);
  if(c.tipo==='link')   return `<div class="free-content" style="text-align:center;padding:34px 0">

/* ===================================================================
   MURO: comunicacion interna en formato feed.
   Un modulo de tipo "muro" guarda una lista de POSTS. Cada post tiene la
   misma forma que un documento de biblioteca (titulo + html armado en el
   panel) mas quien lo publica y cuando. El cuerpo se envuelve en .manual,
   asi que adentro de un post sirven TODOS los bloques que ya existen
   (imagenes, galerias, video, PDF, plantillas de WhatsApp...).
   =================================================================== */
/* Las chapas van TINTADAS (fondo suave + texto al color pleno), no saturadas:
   con 6 tipos de colores fuertes la pantalla parece un semáforo y se deja de
   leer lo que importa. El rojo queda reservado para "Importante", y "Equipo"
   directamente va en neutro. */
const MURO_TAGS = {
  anuncio:      { t:'Anuncio',      c:'--c-hudson',    bg:'#E9EDF6', fg:'#1A4A8A', i:'megaphone' },
  promo:        { t:'Promoción',    c:'--c-norcenter', bg:'#F5EDE3', fg:'#8A5A2C', i:'tag' },
  capacitacion: { t:'Capacitación', c:'--c-caba',      bg:'#E7F0F4', fg:'#255C74', i:'book' },
  logro:        { t:'Logro',        c:'--c-canning',   bg:'#E6F1EA', fg:'#1A6A3A', i:'award' },
  importante:   { t:'Importante',   c:'--c-danger',    bg:'#FBEAE9', fg:'#B4231F', i:'shield' },
  equipo:       { t:'Equipo',       c:'--c-hudson',    bg:'#EFEDE9', fg:'#5A554D', i:'users' }
};
/* El color del avatar identifica a QUIEN publica, no al tipo de publicación:
   el mismo nombre saca siempre el mismo color. */
const AVATAR_COLORES = ['--c-hudson', '--c-caba', '--c-canning', '--c-norcenter'];
function colorDeAutor(nombre){
  const s = String(nombre || 'MyS');
  let n = 0;
  for(let i = 0; i < s.length; i++) n = (n + s.charCodeAt(i)) % 997;
  return AVATAR_COLORES[n % AVATAR_COLORES.length];
}
const MURO_LEIDOS = 'mys_muro_leidos';   /* que publicaciones ya vio, una por una */
let MURO_POSTS = [];                     /* los posts que se estan mostrando */
let MURO_KEY = null;

/* Orden del feed: lo fijado primero, despues por fecha (lo mas nuevo arriba).
   Lo fechado a futuro NO se muestra: asi cargar hoy la promo del lunes con la
   fecha del lunes funciona como una publicacion programada. */
function postsDelMuro(c){
  return ((c && c.docs) || []).filter(p => {
    if(p.archivado) return false;
    /* se archiva sola: `vence` es el ULTIMO dia que se ve. Asi la promo de
       agosto desaparece el 1 de septiembre sin que nadie haga nada, que es
       la razon numero uno por la que estas paginas se llenan de cosas
       viejas y la gente les deja de creer. */
    if(p.vence){ const dv = diasDesde(p.vence); if(dv !== null && dv > 0) return false; }
    const d = diasDesde(p.fecha);
    return d === null || d >= 0;         /* sin fecha se muestra igual */
  }).slice().sort((a,b)=>{
    if(!!b.fijado !== !!a.fijado) return b.fijado ? 1 : -1;
    return String(b.fecha||'').localeCompare(String(a.fecha||''));
  });
}

/* "Nuevo" se lleva POR PUBLICACION, no por fecha de ultima visita.
   Con fechas no alcanzaba: si el vendedor entraba a la mañana y se publicaba
   algo al mediodia (con fecha de hoy), esa publicacion no volvia a contar
   como nueva NUNCA, porque "hoy" ya no es mayor que "hoy". */
function idDePost(p){
  return String(p.id || ((p.fecha || '') + '|' + String(p.titulo || '').slice(0, 60)));
}
let LEIDOS = null;
function leidos(){
  if(LEIDOS) return LEIDOS;
  try{ LEIDOS = new Set(JSON.parse(localStorage.getItem(MURO_LEIDOS) || '[]')); }
  catch(e){ LEIDOS = new Set(); }
  return LEIDOS;
}
function primeraVez(){
  try{ return localStorage.getItem(MURO_LEIDOS) === null; }catch(e){ return true; }
}
function esPostNuevo(p){
  if(leidos().has(idDePost(p))) return false;
  /* el primer ingreso no se pinta entero de rojo: solo lo de la ultima semana */
  if(primeraVez()){ const d = diasDesde(p.fecha); return d !== null && d >= 0 && d <= 7; }
  return true;
}
function muroNoLeidos(){
  const mod = moduloMuro();
  if(!mod) return 0;
  return postsDelMuro(mod.content).filter(esPostNuevo).length;
}
function marcarMuroVisto(){
  const S = leidos();
  MURO_POSTS.forEach(p => S.add(idDePost(p)));
  /* se recorta para que la lista no crezca sin fin en el celular */
  try{ localStorage.setItem(MURO_LEIDOS, JSON.stringify(Array.from(S).slice(-400))); }catch(e){}
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaLinda(f){
  const d = diasDesde(f);
  if(d === null) return '';
  if(d <= 0) return 'Hoy';
  if(d === 1) return 'Ayer';
  if(d < 7) return 'Hace ' + d + ' días';
  if(d < 14) return 'Hace una semana';
  if(d < 31) return 'Hace ' + Math.round(d/7) + ' semanas';
  const p = f.split('-').map(Number);
  /* de otro año lleva el año: si no, una publicacion vieja se lee como reciente */
  const esteAno = new Date().getFullYear();
  return p[2] + ' de ' + MESES[p[1]-1] + (p[0] !== esteAno ? ' de ' + p[0] : '');
}
const AUTOR_DEFECTO = 'Muebles y Sillones';
function inicialesDe(nombre){
  const partes = String(nombre || AUTOR_DEFECTO).trim().split(/\s+/).slice(0,2);
  return partes.map(p => p.charAt(0).toUpperCase()).join('') || 'M';
}

/* ===================================================================
   REACCIONES — VISTA PREVIA
   Todavia no hay base de datos, asi que la reaccion se guarda en el
   telefono de quien la hace: la ve esa persona, no el resto. El numero
   que se muestra = las que ya trae la publicacion + la tuya.
   Cuando haya base de datos cambia DE DONDE sale el numero y adonde se
   escribe; esta pantalla queda igual.
   =================================================================== */
const MURO_REACC = 'mys_muro_reacciones';
/* Como en WhatsApp: UNA reaccion por persona. Elegir otra la reemplaza,
   elegir la misma la saca. */
const RE_TIPOS = {
  like:  { e:'👍', t:'Me gusta' },
  heart: { e:'❤️', t:'Me encanta' },
  wow:   { e:'😮', t:'Me sorprende' },
  haha:  { e:'😂', t:'Me divierte' },
  clap:  { e:'👏', t:'Aplausos' }
};
const RE_ORDEN = ['like', 'heart', 'wow', 'haha', 'clap'];
let REACC = null;
function reacciones(){
  if(REACC) return REACC;
  try{ REACC = JSON.parse(localStorage.getItem(MURO_REACC) || '{}'); }catch(e){ REACC = {}; }
  return REACC;
}
/* Antes se guardaba {like:1, heart:1} (se podian poner varias). Ahora es una
   sola: de lo viejo se toma la primera que valga. */
function miReaccion(p){
  const v = reacciones()[idDePost(p)];
  if(typeof v === 'string') return RE_TIPOS[v] ? v : null;
  if(v && typeof v === 'object'){
    const k = RE_ORDEN.find(x => v[x]);
    return k || null;
  }
  return null;
}
function cuentaReaccion(p, tipo){
  const base = Math.max(0, Number((p.reacciones||{})[tipo]) || 0);
  return base + (miReaccion(p) === tipo ? 1 : 0);
}
function totalReacciones(p){
  return RE_ORDEN.reduce((s, t) => s + cuentaReaccion(p, t), 0);
}
function resumenReacciones(p, i){
  const total = totalReacciones(p);
  if(!total) return '';
  /* se muestran hasta 3 caritas, las mas usadas primero */
  const usadas = RE_ORDEN.map(t => ({t, n:cuentaReaccion(p, t)})).filter(x => x.n)
    .sort((a,b) => b.n - a.n).slice(0, 3);
  const mia = miReaccion(p);
  const otros = total - (mia ? 1 : 0);
  const txt = mia ? (otros ? 'Vos y ' + otros + ' más' : 'Reaccionaste') : String(total);
  return `<div class="mu-sum"><span class="mu-sum-ic">${
      usadas.map(x => `<span title="${esc(RE_TIPOS[x.t].t)}">${RE_TIPOS[x.t].e}</span>`).join('')
    }</span><span class="mu-sum-n${mia ? ' mu-sum-yo' : ''}">${esc(txt)}</span></div>`;
}
/* ===================================================================
   "ENTERADO" — acuse de lectura (VISTA PREVIA)
   Una publicacion marcada como `confirmar:true` pide que el vendedor
   toque "Entendido". Sin base de datos la confirmacion se guarda en su
   telefono; el dia que haya base, ademas se manda al servidor y el panel
   muestra QUIEN falta. La pantalla del vendedor no cambia.
   =================================================================== */
const MURO_OK = 'mys_muro_entendido';
let ENTENDIDO = null;
function entendidos(){
  if(ENTENDIDO) return ENTENDIDO;
  try{ ENTENDIDO = new Set(JSON.parse(localStorage.getItem(MURO_OK) || '[]')); }
  catch(e){ ENTENDIDO = new Set(); }
  return ENTENDIDO;
}
function yaEntendido(p){ return entendidos().has(idDePost(p)); }
/* Una CHAPA CHICA en la cabecera, al lado del tipo. Antes era una caja
   grande con un botón y se comía media publicación para decir algo que
   se entiende con dos palabras. */
function chapaLectura(p, i){
  if(!p.confirmar) return '';
  const ok = yaEntendido(p);
  return ok
    ? `<span class="mu-lec ok" id="lec-${i}" title="Quedó registrado que la leíste">${svg(I.check)} Leído</span>`
    : `<button type="button" class="mu-lec" id="lec-${i}" onclick="confirmarLeido(${i})"
        title="Lectura obligatoria. Se marca sola cuando la leas, o tocá acá.">${svg(I.shield)} Confirmar lectura</button>`;
}
function confirmarLeido(i){
  const p = MURO_POSTS[i]; if(!p || yaEntendido(p)) return;
  const S = entendidos();
  S.add(idDePost(p));
  try{ localStorage.setItem(MURO_OK, JSON.stringify(Array.from(S).slice(-400))); }catch(e){}
  const vieja = document.getElementById('lec-' + i);
  if(vieja){
    vieja.outerHTML = chapaLectura(p, i);
    const nueva = document.getElementById('lec-' + i);
    if(nueva && !sinMovimiento()) nueva.classList.add('recien');
  }
  /* el aviso de arriba solo se re-dibuja si el vendedor está mirando el
     principio: si no, la portada le da un salto justo mientras lee */
  if(window.scrollY < 220){ pintarPendientes(); renderNoti(); }
  pintarTabs();
}

/* ---- LECTURA AUTOMÁTICA ----
   Si la publicación se queda quieta en pantalla el tiempo suficiente, se
   da por leída sola. Si el vendedor pasa de largo deslizando, no. Así no
   hace falta tocar un botón para cada comunicación.
   Se exige: que la pestaña esté a la vista, que se vea una parte grande
   de la publicación, y que se mantenga TIEMPO_LECTURA sin salirse. */
const TIEMPO_LECTURA = 2000;
let obsLectura = null;
const relojes = new Map();
function vigilarLectura(){
  if(!('IntersectionObserver' in window)) return;
  if(!obsLectura){
    obsLectura = new IntersectionObserver(entradas => {
      entradas.forEach(en => {
        const el = en.target, i = Number(el.dataset.lecIdx);
        const alto = en.boundingClientRect.height || 1;
        /* "se ve bien" = más de la mitad de la publicación, o media pantalla
           si la publicación es más alta que la ventana */
        const visible = en.intersectionRect.height;
        const suficiente = en.isIntersecting &&
          visible >= Math.min(alto * 0.55, window.innerHeight * 0.45);
        const anillo = el.querySelector('.lec-ring');
        if(suficiente && !document.hidden){
          if(!relojes.has(el)){
            if(anillo){ anillo.style.setProperty('--tlec', TIEMPO_LECTURA + 'ms'); anillo.classList.add('viendo'); }
            relojes.set(el, setTimeout(()=>{
              relojes.delete(el);
              if(anillo) anillo.classList.add('listo');
              confirmarLeido(i);
              /* el tilde se muestra un momento y se va: el estado ya queda
                 arriba, en la chapa verde */
              setTimeout(()=>{ if(anillo) anillo.classList.remove('viendo', 'listo'); }, 1600);
            }, TIEMPO_LECTURA));
          }
        } else if(relojes.has(el)){
          clearTimeout(relojes.get(el)); relojes.delete(el);   /* pasó de largo */
          if(anillo) anillo.classList.remove('viendo');        /* vuelve a cero */
        }
      });
    }, { threshold:[0, .25, .45, .55, .75, 1] });
  }
  document.querySelectorAll('.mu-post').forEach(art => {
    const chapa = art.querySelector('.mu-lec:not(.ok)');
    if(!chapa || art.dataset.vigilada) return;
    art.dataset.vigilada = '1';
    art.dataset.lecIdx = (chapa.id || '').replace('lec-', '');
    obsLectura.observe(art);
  });
}
/* si se va a otra app o cambia de pestaña, los relojes se frenan */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) return;
  relojes.forEach((t, el)=>{
    clearTimeout(t);
    const a = el.querySelector('.lec-ring'); if(a) a.classList.remove('viendo');
  });
  relojes.clear();
});

/* ---- la barrita flotante ---- */
let RE_ABIERTA = null;
function cerrarReacciones(){
  const b = document.querySelector('.re-bar');
  if(!b) return;
  const btn = b.parentElement.querySelector('.re-abrir');
  if(btn) btn.setAttribute('aria-expanded', 'false');

}
function abrirReacciones(i, btn){

  cerrarReacciones();

  const p = MURO_POSTS[i]; if(!p) return;

      onclick="elegirReaccion(${i},'${t}')">${RE_TIPOS[t].e}</button>`).join('');
  btn.parentElement.appendChild(bar);
  btn.setAttribute('aria-expanded', 'true');

/* se cierra sola al tocar en cualquier otro lado, o con Escape */
document.addEventListener('click', e => {
  if(RE_ABIERTA !== null && !e.target.closest('.re-wrap')) cerrarReacciones();

function elegirReaccion(i, tipo){
  const p = MURO_POSTS[i]; if(!p || !RE_TIPOS[tipo]) return;
  const id = idDePost(p), R = reacciones();
  if(miReaccion(p) === tipo) delete R[id];   /* la misma otra vez: se saca */
  else R[id] = tipo;
  try{ localStorage.setItem(MURO_REACC, JSON.stringify(R)); }catch(e){}
  cerrarReacciones();

  /* se repinta SOLO esta publicacion: volver a dibujar el feed entero haria
     saltar el scroll justo cuando tocaste el boton */
  const art = document.getElementById('mu-' + i);
  if(!art) return;
  const wrap = art.querySelector('.re-wrap');
  if(wrap) wrap.outerHTML = botonReaccion(p, i);
  const nuevoBtn = art.querySelector('.re-abrir');
  if(nuevoBtn && miReaccion(p) && !sinMovimiento()){
    nuevoBtn.classList.add('late');
    setTimeout(()=>nuevoBtn.classList.remove('late'), 300);
  }
  const sumVieja = art.querySelector('.mu-sum');
  const sumNueva = resumenReacciones(p, i);
  if(sumVieja && sumNueva) sumVieja.outerHTML = sumNueva;
  else if(sumVieja) sumVieja.remove();
  else if(sumNueva) art.querySelector('.mu-pie').insertAdjacentHTML('beforebegin', sumNueva);
}

/* El feed. Con `fijadosAparte` las publicaciones fijadas NO se listan acá:
   van arriba en miniatura (asi no tapan lo que se va publicando). */
function muroHTML(c, t, opts){
  opts = opts || {};
  MURO_POSTS = postsDelMuro(c);
  if(!MURO_POSTS.length) return `<div class="pending"><b>Todavía no hay publicaciones.</b><br>Muy pronto.</div>`;

  const enFeed = MURO_POSTS.filter(p => !(opts.fijadosAparte && p.fijado));
  /* si TODO lo que hay esta fijado (tipico del primer dia), el feed queda sin
     nada. Sin este cartel la portada muestra "NOVEDADES" y abajo el vacio. */
  if(!enFeed.length) return `<div class="pending"><b>Todo lo importante está arriba.</b><br>
    Acá van a aparecer las novedades del día a día.</div>`;
  /* solo se ofrecen los filtros de los tipos que realmente existen en el feed */
  const usados = [];
  enFeed.forEach(p => { const e = p.etiqueta; if(e && MURO_TAGS[e] && usados.indexOf(e) < 0) usados.push(e); });
  const filtros = usados.length > 1 ? `<div class="mu-filtros" id="muFiltros">
      <button type="button" class="mu-chip on" onclick="muroFiltrar('',this)">Todo</button>
      ${usados.map(e => `<button type="button" class="mu-chip" onclick="muroFiltrar('${e}',this)">
        <span class="pto" style="background:var(${MURO_TAGS[e].c})"></span>${esc(MURO_TAGS[e].t)}</button>`).join('')}
    </div>` : '';

  return `<div class="muro">${filtros}${MURO_POSTS.map((p,i)=>
      (opts.fijadosAparte && p.fijado) ? '' : postHTML(p, i)
    ).join('')}<div class="mu-vacio" id="muVacio" hidden>No hay publicaciones de ese tipo.</div></div>`;
}

/* Recorta los posts largos DESPUES de pintarlos: recien ahi se sabe cuanto
   miden de verdad (las imagenes pueden no haber cargado, por eso tambien se
   vuelve a medir cuando terminan). */
/* el mismo umbral que usa el CSS del feed */
const MQ_CELULAR = window.matchMedia ? window.matchMedia('(max-width:640px)') : null;
function enCelular(){ return MQ_CELULAR ? MQ_CELULAR.matches : window.innerWidth <= 640; }
/* si se agranda o achica la ventana (o giran el telefono) se vuelve a decidir
   si corresponde recortar */
if(MQ_CELULAR){
  const alCambiar = ()=>{
    document.querySelectorAll('.mu-post .mu-cuerpo').forEach(c => { delete c.dataset.medido; });
    initMuro();
  };
  if(MQ_CELULAR.addEventListener) MQ_CELULAR.addEventListener('change', alCambiar);
  else if(MQ_CELULAR.addListener) MQ_CELULAR.addListener(alCambiar);   /* navegadores viejos */
}

function initMuro(){
  const posts = document.querySelectorAll('.mu-post');
  posts.forEach(art => {
    const cuerpo = art.querySelector('.mu-cuerpo');
    if(!cuerpo || cuerpo.dataset.medido) return;
    /* con foto/video el recorte es mas generoso: cortar a la altura del texto
       dejaba una franja de imagen que no se entiende */
    if(cuerpo.querySelector('img, video, iframe')) cuerpo.classList.add('con-media');
    /* EN ESCRITORIO NO SE RECORTA: la pantalla es grande y la publicación
       entra entera, así que se lee de corrido sin tener que abrir nada.
       El recorte es cosa del celular.
       Y cuando se recorta, se mide LO QUE QUEDA TAPADO con el tope real del
       CSS: si es poco no vale la pena, porque el botón "Ver publicación
       completa" ocupa 44px y la publicación terminaba MAS ALTA recortada
       que entera. */
    const medir = ()=>{
      if(cuerpo.dataset.abierto) return;
      if(!enCelular()){                        /* escritorio: siempre completa */
        cuerpo.classList.remove('recortado');
        const viejo = art.querySelector('.mu-mas'); if(viejo) viejo.remove();
        return;
      }
      if(art.querySelector('.mu-mas')) return;
      cuerpo.classList.add('recortado');
      const tapado = cuerpo.scrollHeight - cuerpo.clientHeight;
      if(tapado < 110){ cuerpo.classList.remove('recortado'); return; }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mu-mas'; b.textContent = 'Ver publicación completa';
      b.onclick = ()=>{ cuerpo.classList.remove('recortado'); cuerpo.dataset.abierto = '1'; b.remove(); };
      cuerpo.insertAdjacentElement('afterend', b);
    };
    medir();
    cuerpo.querySelectorAll('img').forEach(im => { if(!im.complete) im.addEventListener('load', medir, {once:true}); });
    cuerpo.dataset.medido = '1';
  });
  /* se marca como visto con un respiro, asi alcanza a ver las chapas "NUEVO" */
  setTimeout(marcarMuroVisto, 2500);
}

function muroFiltrar(tag, btn){

/* ===================================================================
   BUSCADOR
   Busca DENTRO de todo: publicaciones del muro, módulos, documentos de
   las bibliotecas y placas para descargar. Y lo importante: contesta con
   el pedazo de texto donde está la respuesta, para que el vendedor la
   lea ahi mismo sin tener que abrir y buscar de nuevo.
   =================================================================== */
/* se normaliza SIN cambiar el largo del texto: asi las posiciones que
   encuentra la busqueda sirven para recortar y resaltar el original */
const BU_MAPA = {'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','ñ':'n','à':'a','è':'e','ì':'i','ò':'o','ù':'u'};
function norm(s){ return String(s||'').toLowerCase().replace(/[áéíóúüñàèìòù]/g, c => BU_MAPA[c] || c); }
function textoDe(html){
  /* los tags se cambian por un espacio ANTES de leer el texto: si no, el
     final de un elemento y el principio del otro quedan pegados y se lee
     "DescargarMonterosso". El div sigue haciendo falta para que &amp; y
     compañía vuelvan a ser caracteres normales. */
  const d = document.createElement('div');
  d.innerHTML = String(html || '').replace(/<[^>]+>/g, ' ');
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

let BU_INDICE = null, BU_RES = [];
function armarIndice(){
  const idx = [];
  const mods = window.MODULES || [];
  const agregar = e => { if(e.titulo || e.texto) idx.push(e); };
  (mods.length ? mods : []).forEach(m => {
    if(m.hidden) return;
    const t = MAP[m.key] || {};
    const base = { key:m.key, icon:(I[m.icon] ? m.icon : (t.icon || 'layers')), color:m.color || t.color || '--c-hudson' };
    const c = m.content;
    if(c && c.tipo === 'muro'){
      postsDelMuro(c).forEach(p => agregar(Object.assign({}, base, {
        tipo:'publicacion', pid:idDePost(p), titulo:p.titulo || 'Publicación',
        texto:textoDe(p.html), extra:(p.autor || '') + ' · ' + fechaLinda(p.fecha)
      })));
      return;
    }
    /* el modulo en si (nombre + subtitulo) */
    agregar(Object.assign({}, base, { tipo:'modulo', titulo:m.title || t.title || m.key,
      texto:(m.desc || t.desc || '') + ' ' + (c && c.tipo === 'bloques' ? textoDe(c.html) :
            (CONTENT[m.key] ? textoDe(CONTENT[m.key]) : '')) }));
    if(c && c.tipo === 'coleccion'){
      (c.docs || []).forEach((d, di) => { if(!d.archivado) agregar(Object.assign({}, base, {
        tipo:'documento', doc:di, titulo:d.titulo || '', texto:textoDe(d.html),
        extra:(m.title || '') + (d.etiqueta ? ' · ' + d.etiqueta : '')
      })); });
    }
    /* placas para descargar: se busca por su nombre */
    ((window.GALLERIES || {})[m.key] || []).forEach(g => agregar(Object.assign({}, base, {
      tipo:'placa', titulo:g.title || '', texto:'Placa para descargar de ' + (m.title || ''),
      img:g.file, extra:m.title || ''
    })));
  });
  return idx;
}

function buscarEnTodo(q){
  if(!BU_INDICE) BU_INDICE = armarIndice();
  const palabras = norm(q).split(/\s+/).filter(p => p.length > 1);
  if(!palabras.length) return [];
  return BU_INDICE.map(e => {
    const nt = norm(e.titulo), nx = norm(e.texto);
    let puntos = 0, todas = true;
    palabras.forEach(p => {
      const enT = nt.indexOf(p) >= 0, enX = nx.indexOf(p) >= 0;
      if(!enT && !enX) todas = false;
      if(enT) puntos += 12;
      if(enX) puntos += 3;
    });
    if(!todas) return null;
    if(nt.indexOf(norm(q)) >= 0) puntos += 20;       /* el titulo dice justo eso */
    if(nx.indexOf(norm(q)) >= 0) puntos += 8;
    if(e.tipo === 'publicacion') puntos += 2;        /* lo del muro suele ser lo mas actual */
    return { e, puntos, corte:fragmento(e.texto, palabras) };
  }).filter(Boolean).sort((a,b) => b.puntos - a.puntos).slice(0, 24);
}

/* el pedazo de texto donde aparece lo buscado, con la palabra resaltada */
function fragmento(texto, palabras){
  const n = norm(texto);
  let pos = -1;
  palabras.forEach(p => { const i = n.indexOf(p); if(i >= 0 && (pos < 0 || i < pos)) pos = i; });
  if(pos < 0) return '';
  let desde = Math.max(0, pos - 90), hasta = Math.min(texto.length, pos + 230);
  if(desde > 0){ const e = texto.indexOf(' ', desde); if(e > 0 && e < pos) desde = e + 1; }
  if(hasta < texto.length){ const e = texto.lastIndexOf(' ', hasta); if(e > pos) hasta = e; }
  const trozo = texto.slice(desde, hasta);
  /* se resalta por POSICION sobre el trozo original (asi no se pierden tildes) */
  const nt = norm(trozo);
  const marcas = [];
  palabras.forEach(p => {
    let i = nt.indexOf(p);
    while(i >= 0){ marcas.push([i, i + p.length]); i = nt.indexOf(p, i + p.length); }
  });
  marcas.sort((a,b) => a[0] - b[0]);
  let out = '', cursor = 0;
  marcas.forEach(([a, b]) => {
    if(a < cursor) return;
    out += esc(trozo.slice(cursor, a)) + '<mark>' + esc(trozo.slice(a, b)) + '</mark>';
    cursor = b;
  });
  out += esc(trozo.slice(cursor));
  return (desde > 0 ? '…' : '') + out + (hasta < texto.length ? '…' : '');
}

const BU_ROTULO = { publicacion:'Publicación del muro', modulo:'Módulo', documento:'Documento', placa:'Placa' };
function pintarBusqueda(){
  const q = document.getElementById('buInput').value.trim();
  const caja = document.getElementById('buBody');
  if(q.length < 2){
    caja.innerHTML = `<div class="bu-vacio"><p class="bu-tip">Escribí lo que estás buscando y te muestro
      <b>dónde está la respuesta</b>, no una lista de links.<br><br>
      Probá con <b>cuotas</b>, <b>plazo de entrega</b>, <b>derivación</b> o el nombre de una placa.</p></div>`;
    return;
  }
  BU_RES = buscarEnTodo(q);
  if(!BU_RES.length){
    caja.innerHTML = `<div class="bu-vacio"><b>No encontré nada con “${esc(q)}”.</b>
      <p class="bu-tip" style="margin-top:8px">Probá con una sola palabra, o con otra manera de decirlo.</p></div>`;
    return;
  }
  /* la RESPUESTA: el mejor resultado que tenga texto para leer */
  const mejor = BU_RES.find(r => r.corte) || BU_RES[0];
  const otros = BU_RES.filter(r => r !== mejor);
  const im = BU_RES.indexOf(mejor);
  caja.innerHTML = `
    <div class="bu-resp">
      <div class="bu-resp-d">${esc(BU_ROTULO[mejor.e.tipo] || '')}${mejor.e.extra ? ' · ' + esc(mejor.e.extra) : ''}</div>
      <div class="bu-resp-t">${esc(mejor.e.titulo)}</div>
      ${mejor.corte ? `<div class="bu-resp-x">${mejor.corte}</div>` : ''}
      ${mejor.e.img ? `<img class="bu-img" style="width:100%;height:auto;max-height:220px;object-fit:contain;margin-top:10px" src="${esc(mejor.e.img)}" alt="">` : ''}
      <button type="button" class="bu-ir" onclick="irAResultado(${im})">${svg(I.ext)} Abrir</button>
    </div>
    ${otros.length ? `<div class="bu-t">También encontré</div>` : ''}
    ${otros.map(r => {
      const j = BU_RES.indexOf(r);
      return `<button type="button" class="bu-item" onclick="irAResultado(${j})">
        ${r.e.img ? `<img class="bu-img" src="${esc(r.e.img)}" alt="" loading="lazy">`
                  : `<span class="bu-ic" style="background:var(${r.e.color})">${svg(I[r.e.icon])}</span>`}
        <span class="bu-tx">
          <span class="bu-n">${esc(r.e.titulo)}</span>
          <span class="bu-d">${r.corte || esc(BU_ROTULO[r.e.tipo] || '')}</span>
        </span></button>`;
    }).join('')}`;
}

function irAResultado(n){
  const r = BU_RES[n]; if(!r) return;
  const e = r.e;
  cerrarBuscador();
  if(e.tipo === 'publicacion'){
    const muro = moduloMuro();
    /* si la portada es el muro se vuelve ahi; si no, se abre el modulo */
    if(muro && muro.key === e.key) showHub(); else location.hash = e.key;
    setTimeout(()=>{
      const art = document.querySelector('[data-pid="' + CSS.escape(e.pid) + '"]');
      if(art){ art.scrollIntoView({behavior:'smooth', block:'center'}); destacar(art); }
    }, 420);
    return;
  }
  if(e.tipo === 'documento'){
    location.hash = e.key;
    setTimeout(()=>{ verDoc(e.doc); }, 380);
    return;
  }
  if(e.tipo === 'placa'){
    location.hash = e.key;
    setTimeout(()=>{ openLightbox(e.img, e.titulo); }, 400);
    return;
  }
  location.hash = e.key;
}
function destacar(el){
  el.classList.add('destacado');
  setTimeout(()=>el.classList.remove('destacado'), 2000);
}

/* ---- barra de abajo ---- */
function tabIr(a){
  if(a === 'inicio'){ cerrarBuscador(); closeMenu(); showHub(); window.scrollTo({top:0, behavior:'smooth'}); }
  else if(a === 'buscar') abrirBuscador();
  else if(a === 'modulos'){ cerrarBuscador(); openMenu(); }
  pintarTabs();
}
function pintarTabs(){
  const enHub = !document.getElementById('hub').hidden;
  const buscando = !document.getElementById('buscador').hidden;
  const menu = !document.getElementById('navmenu').hidden;
  const marcar = (id, on) => { const e = document.getElementById(id); if(e) e.classList.toggle('on', on); };
  marcar('tabInicio', enHub && !buscando && !menu);
  marcar('tabBuscar', buscando);
  marcar('tabModulos', menu || (!enHub && !buscando));
  /* los mismos avisos que arriba: sin leer en el muro, y modulos con material nuevo */
  const sinLeer = moduloMuro() ? muroNoLeidos() : 0;
  const bi = document.getElementById('tabNInicio');
  if(bi){ bi.hidden = !sinLeer; bi.textContent = sinLeer > 9 ? '9+' : sinLeer; }
  const muro = moduloMuro();
  const nMod = TILES.filter(t => (!muro || t.key !== muro.key) && seccionLista(t) && esNovedad(t.key)).length;
  const bm = document.getElementById('tabNModulos');
  if(bm){ bm.hidden = !nMod; bm.textContent = nMod > 9 ? '9+' : nMod; }
}

function abrirBuscador(){
  closeMenu();
  BU_INDICE = null;                 /* se arma con lo que hay publicado ahora */
  const b = document.getElementById('buscador');
  b.hidden = false;
  document.body.classList.add('menu-open');    /* frena el scroll del fondo */
  pintarBusqueda();
  const inp = document.getElementById('buInput');
  inp.value = '';
  setTimeout(()=>inp.focus(), 60);
  pintarTabs();
}
function cerrarBuscador(){
  const b = document.getElementById('buscador');
  if(b.hidden) return;
  b.hidden = true;
  document.body.classList.remove('menu-open');
  pintarTabs();
}
document.addEventListener('DOMContentLoaded', ()=>{
  const inp = document.getElementById('buInput');
  if(inp) inp.addEventListener('input', pintarBusqueda);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') cerrarBuscador();
  /* atajo de teclado para quien la usa desde la compu */
  if((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); abrirBuscador(); }
});

/* ===================================================================
   LOBBY: si hay un modulo de tipo muro, LA PORTADA ES EL MURO.
   Arriba los accesos a los modulos (se deslizan con el dedo) y lo fijado
   en miniatura; abajo el feed. El menu de las tres rayitas sigue teniendo
   TODO, que es como se encuentra algo puntual rapido.
   Si no hay muro, la portada sigue siendo la grilla de siempre.
   =================================================================== */
function moduloMuro(){
  return (window.MODULES || []).find(m => m.content && m.content.tipo === 'muro' && !m.hidden) || null;
}
function renderHub(){
  const mod = moduloMuro();
  const lobby = document.getElementById('lobby');
  const hero  = document.getElementById('hero');
  const bot   = document.getElementById('botonera');
  if(!mod){                                  /* sin muro: portada clasica */
    lobby.hidden = true; hero.hidden = false; bot.hidden = false;
    renderBotonera();
    return;
  }
  hero.hidden = true; bot.hidden = true;
  document.getElementById('novedades').hidden = true;
  lobby.hidden = false;
  MURO_KEY = mod.key;
  document.getElementById('feed').innerHTML =
    `<div class="lobby-t"><b>Novedades</b></div>` +
    muroHTML(mod.content, MAP[mod.key], {fijadosAparte:true});
  renderFijados();
  renderNoti();
  pintarPendientes();
  pintarContadorMenu();
  initMuro();
  animarEntradas(document.getElementById('feed'));
  vigilarLectura();
}

/* Lo fijado va en una FRANJA FINA: se despliega abajo cuando la tocan. Tiene
   que llamar la atencion sin ocupar lugar, para que lo del dia a dia quede a
   la vista apenas entran. */
let FIX_ABIERTO = null;
function renderFijados(){
  const cont = document.getElementById('fijados');
  /* se repinta la caja: si queda dicho que habia una abierta, el primer toque
     "cierra" una tarjeta que ya no existe y no pasa nada en pantalla */
  FIX_ABIERTO = null;
  const fij = MURO_POSTS.map((p,i) => ({p,i})).filter(x => x.p.fijado);
  if(!fij.length){ cont.hidden = true; cont.innerHTML = ''; return; }
  cont.hidden = false;
  cont.innerHTML = `<div class="fix-row">${fij.map(({p,i}) => {
      const tag = MURO_TAGS[p.etiqueta];
      const color = tag ? tag.fg : '#B4231F';
      return `<button type="button" class="fix-card" data-i="${i}" onclick="verFijado(${i},this)"
        style="--fx:${color}">
        <span class="fix-ic">${svg(I[tag ? tag.i : 'shield'])}</span>
        <span class="fix-t">${esc(p.titulo || 'Publicación')}</span>
        <span class="fix-ch">›</span>
      </button>`;
    }).join('')}</div>
    <div class="fix-abierto" id="fixAbierto"></div>`;
}
function verFijado(i, btn){
  const caja = document.getElementById('fixAbierto');
  document.querySelectorAll('.fix-card').forEach(c => c.classList.toggle('abierta', c === btn && FIX_ABIERTO !== i));
  if(FIX_ABIERTO === i){                    /* segunda vez: se cierra */
    FIX_ABIERTO = null; caja.innerHTML = '';
    return;
  }
  FIX_ABIERTO = i;
  caja.innerHTML = postHTML(MURO_POSTS[i], i);
  const art = caja.querySelector('.mu-post');
  if(art) art.classList.add('entra');
  initMuro();
  vigilarLectura();      /* la fijada suele ser justo la que pide confirmación */
}

/* ---- BARRA DE AVISO ----
   Una sola a la vez, y la que se ve es la que el vendedor NO puede descubrir
   solo: si cambió algo en otro modulo, no lo ve en la portada. Las
   publicaciones nuevas ya se ven abajo, asi que solo se avisan si son varias.
   Cerrarla la calla hasta que haya un cambio distinto. */
const NOTI_CERRADA = 'mys_noti_cerrada';
function renderNoti(){
  const caja = document.getElementById('noti');
  if(!caja) return;
  /* UNA sola alerta a la vez. Si hay comunicaciones obligatorias sin
     confirmar, eso manda: apilar dos avisos hace que no se lea ninguno. */
  if(pendientesDeConfirmar().length){ caja.hidden = true; caja.innerHTML = ''; return; }
  const mods = TILES.filter(t => t.key !== MURO_KEY && seccionLista(t) && esNovedad(t.key));
  const nuevas = MURO_POSTS.filter(esPostNuevo).length;
  let firma = '', ico = 'megaphone', texto = '', accion = '';
  if(mods.length){
    firma = 'm:' + mods.map(t => t.key + ':' + (MODMAP[t.key]||{}).actualizado).join('|');
    ico = 'refresh';
    texto = mods.length === 1
      ? `Hay material nuevo en <b>${esc(mods[0].title)}</b>`
      : `Hay material nuevo en <b>${mods.length} módulos</b>`;
    accion = mods.length === 1
      ? `<button type="button" class="noti-ver" onclick="openSection('${mods[0].key}')">Ver</button>`
      : `<button type="button" class="noti-ver" onclick="openMenu()">Ver</button>`;
  } else if(nuevas > 1){
    firma = 'p:' + nuevas + ':' + (MURO_POSTS[0]||{}).fecha;
    texto = `<b>${nuevas} publicaciones nuevas</b> desde la última vez`;
    accion = `<button type="button" class="noti-ver" onclick="irAPrimeraNueva()">Ver</button>`;
  }
  let cerrada = '';
  try{ cerrada = localStorage.getItem(NOTI_CERRADA) || ''; }catch(e){}
  if(!firma || firma === cerrada){ caja.hidden = true; caja.innerHTML = ''; return; }
  caja.dataset.firma = firma;
  caja.hidden = false;
  caja.innerHTML = `<span class="noti-ic">${svg(I[ico])}</span>
    <span class="noti-tx">${texto}</span>${accion}
    <button type="button" class="noti-x" onclick="cerrarNoti()" aria-label="Cerrar aviso">✕</button>`;
}
function cerrarNoti(){
  const caja = document.getElementById('noti');
  try{ localStorage.setItem(NOTI_CERRADA, caja.dataset.firma || ''); }catch(e){}
  caja.classList.add('sale');
  setTimeout(()=>{ caja.hidden = true; caja.classList.remove('sale'); caja.innerHTML = ''; }, 300);
}
function irAPrimeraNueva(){
  const art = document.querySelector('.mu-post.nueva');
  if(art) art.scrollIntoView({behavior:'smooth', block:'start'});
  cerrarNoti();
}

/* ---- las publicaciones aparecen al entrar en pantalla ----
   Se hace con IntersectionObserver y NO con un timer: si el vendedor no
   llego hasta ahi, no hay animacion que correr. La clase se SACA al ver la
   tarjeta, asi que si el navegador no soporta nada, el feed igual se ve. */
let muroObs = null;
function revelar(el, animar){
  el.classList.remove('asoma');
  if(animar) el.classList.add('asomo');
  if(muroObs) muroObs.unobserve(el);
}
/* RED DE SEGURIDAD (esto ya rompio una vez): si el scroll salta de golpe -por
   un ancla, un scrollIntoView o un flick fuerte-, el observer NO ve las
   tarjetas que pasaron de largo entre dos cuadros y quedaban INVISIBLES para
   siempre. Asi que todo lo que ya llego a la altura de la ventana se revela
   si o si, lo haya visto el observer o no. */
function revelarPasadas(){
  document.querySelectorAll('.mu-post.asoma').forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight + 80) revelar(el, true);
  });
}
let revPend = false;
function pedirRevelar(){
  if(revPend) return;
  revPend = true;
  requestAnimationFrame(()=>{
    revPend = false;
    revelarPasadas();
    /* el aviso de lecturas pendientes se pone al dia cuando volvés arriba:
       actualizarlo mientras leés abajo le daría un salto a la pantalla */
    if(window.scrollY < 120) pintarPendientes();
  });
}
window.addEventListener('scroll', pedirRevelar, {passive:true});
window.addEventListener('resize', pedirRevelar, {passive:true});

function animarEntradas(cont){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)) return;
  if(!muroObs){
    muroObs = new IntersectionObserver((entradas)=>{
      entradas.forEach(en=>{ if(en.isIntersecting) revelar(en.target, true); });
    }, {threshold:0, rootMargin:'0px 0px -40px 0px'});
  }
  cont.querySelectorAll('.mu-post:not(.asomo)').forEach((el, i)=>{
    if(el.dataset.obs) return;
    el.dataset.obs = '1';
    el.classList.add('asoma');
    el.style.animationDelay = Math.min(i, 4) * 55 + 'ms';   /* escalonado corto */
    muroObs.observe(el);
  });
  /* ultimo seguro: pase lo que pase, a los 2s no queda nada escondido */
  setTimeout(()=>{ cont.querySelectorAll('.mu-post.asoma').forEach(el => revelar(el, true)); }, 2000);
}

/* ===================================================================
   BIBLIOTECA: un modulo guarda VARIOS documentos (ej. un reporte por mes).
   El vendedor ve primero el indice y elige cual abrir. Los archivados no
   se listan (el panel los conserva pero no se publican a la vista).
   =================================================================== */
let COL_KEY = null;                       /* modulo de tipo biblioteca abierto */
let COL_DOC = null;                       /* documento abierto dentro de esa biblioteca */

/* La flecha del header retrocede UN paso:
   documento abierto -> lista de la biblioteca -> portada. */
function volverAtras(){
  if(COL_KEY !== null && COL_DOC !== null) volverIndice();
  else showHub();
}

/* Que botones muestra la barra de arriba, segun donde estes:
     portada            -> ninguno
     modulo / indice    -> [flecha atras] [Inicio]
     reporte abierto    -> [Volver a la lista (izquierda)] [Inicio]
   Dentro de un reporte, la flecha generica haria lo MISMO que "Volver a la
   lista", asi que se esconde para no repetir el mismo boton dos veces. */
function pintarNavHeader(){
  const enSeccion = !document.getElementById('view').hidden;
  const enDoc = enSeccion && COL_KEY !== null && COL_DOC !== null;
  document.getElementById('listaBtn').hidden = !enDoc;
  document.getElementById('backBtn').hidden  = !enSeccion || enDoc;
  document.getElementById('homeBtn').hidden  = !enSeccion;
  try{ pintarTabs(); }catch(e){}      /* la barra de abajo sigue lo mismo */
}
function docsVisibles(c){ return ((c && c.docs) || []).filter(d => !d.archivado); }
function resumenDoc(d){
  if(!d.presentacion) return '';
  /* lo mas fiable es contar lo que realmente quedo armado en el html */
  let n = (d.html || '').split('<section class="dk-slide"').length - 1;
  if(n < 1){                       /* respaldo: mismo criterio que usa el panel */
    let cuerpo = 0; n = 0;
    (d.bloques || []).forEach(b => { if(b.t==='diapo'){ if(cuerpo) n++; cuerpo = 0; } else cuerpo++; });
    if(cuerpo) n++;
  }
  return n ? n + (n===1 ? ' diapositiva' : ' diapositivas') : '';
}
function indiceHTML(c){
  const docs = docsVisibles(c);
  if(!docs.length) return `<div class="pending"><b>Todavía no hay nada publicado acá.</b><br>Muy pronto.</div>`;
  return `<div class="col-index">${docs.map((d,i)=>{
    const meta = [d.etiqueta, resumenDoc(d)].filter(Boolean).map(esc).join(' · ');
    return `<button type="button" class="col-card${i===0?' destacada':''}" onclick="verDoc(${i})">
      ${i===0 ? '<span class="col-ult">Último</span>' : ''}
      <span class="col-ct">${esc(d.titulo||'')}</span>
      ${meta ? `<span class="col-cm">${meta}</span>` : ''}
      <span class="col-cir">${svg(I.ext)}</span>
    </button>`;
  }).join('')}</div>`;
}
function verDoc(i){
  const mod = MODMAP[COL_KEY]; if(!mod || !mod.content) return;
  const d = docsVisibles(mod.content)[i]; if(!d) return;
  COL_DOC = i;                         /* la flecha ahora vuelve a la lista, no a la portada */
  pintarNavHeader();
  const volver = '← Volver a la lista';
  const body = document.getElementById('secBody');
  if(d.presentacion){
    body.innerHTML = deckHTML(d.html||'', volver);
    document.body.classList.add('report-mode');
    initDeck();
  } else {
    body.innerHTML = `<button type="button" class="col-back" onclick="volverIndice()">${volver}</button>`
                   + `<div class="manual">${d.html||''}</div>`;
    document.body.classList.remove('report-mode');
    dkSlides = [];
    plegarGalerias(body, COL_KEY + ':' + i);
  }
  window.scrollTo(0,0);
}
function volverIndice(){ if(COL_KEY) renderSection(COL_KEY); }

/* ===================================================================
   MODO PRESENTACION: un modulo armado en el panel se ve como diapositivas.
   El panel ya entrego el contenido cortado en <section class="dk-slide">
   con data-titulo / data-grupo; aca solo le ponemos la navegacion encima.
   =================================================================== */
function deckHTML(html, volver){
  return `<div class="deck" id="deck">
    <div class="dk-prog" id="dkProg"></div>
    <button class="dk-idx" onclick="dkMenu(true)" aria-label="Ver todas las diapositivas">
      <span class="ico"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span> Diapositivas
    </button>
    <div class="dk-stage" id="dkStage"><div class="manual">${html}</div></div>
    <div class="dk-bar">
      ${volver ? `<button type="button" class="dk-volver" onclick="volverIndice()">${esc(volver)}</button>` : ''}
      <span class="dk-count" id="dkCount"></span>
      <div class="dk-dots" id="dkDots"></div>
      <div class="dk-navs">
        <button class="dk-btn" id="dkPrev" onclick="dkMover(-1)">← Anterior</button>
        <button class="dk-btn" id="dkNext" onclick="dkMover(1)">Siguiente →</button>
      </div>
    </div>
    <div class="dk-menu" id="dkMenu">
      <div class="dk-menu-ov" onclick="dkMenu(false)"></div>
      <div class="dk-menu-p">
        <div class="dk-menu-h"><b>Contenido</b><button class="dk-menu-x" onclick="dkMenu(false)" aria-label="Cerrar">✕</button></div>
        <div id="dkMenuList"></div>
      </div>
    </div>
  </div>`;
}
let dkCur = 0, dkSlides = [];
function initDeck(){
  const deck = document.getElementById('deck');
  dkSlides = deck ? [...deck.querySelectorAll('.dk-slide')] : [];
  if(!dkSlides.length) return;
  document.getElementById('dkDots').innerHTML = dkSlides.map((s,i)=>
    `<button class="dk-dot" onclick="dkGo(${i})" aria-label="Diapositiva ${i+1}"></button>`).join('');
  let html = '', grpAnt = null;
  dkSlides.forEach((s,i)=>{
    const g = s.dataset.grupo || '';
    if(g && g !== grpAnt){ html += `<div class="dk-grp">${esc(g)}</div>`; grpAnt = g; }
    html += `<button class="dk-mi" data-i="${i}" onclick="dkGo(${i});dkMenu(false)">`
          + `<span class="mnum">${i+1}</span>${esc(s.dataset.titulo || ('Diapositiva '+(i+1)))}</button>`;
  });
  document.getElementById('dkMenuList').innerHTML = html;
  const st = document.getElementById('dkStage');
  let tX = null, tY = null;
  st.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; tX=t.clientX; tY=t.clientY; }, {passive:true});
  st.addEventListener('touchend', e=>{
    if(tX===null) return;
    const t=e.changedTouches[0], dx=t.clientX-tX, dy=t.clientY-tY; tX=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) dkMover(dx<0?1:-1);
  }, {passive:true});
  dkCur = 0; dkPintar();
}
function dkPintar(){
  const n = dkSlides.length; if(!n) return;
  dkSlides.forEach((s,i)=>s.classList.toggle('on', i===dkCur));
  document.getElementById('dkProg').style.width = ((dkCur+1)/n*100)+'%';
  document.getElementById('dkCount').textContent = (dkCur+1)+' / '+n;
  document.getElementById('dkPrev').disabled = dkCur===0;
  document.getElementById('dkNext').disabled = dkCur===n-1;
  document.querySelectorAll('#dkDots .dk-dot').forEach((d,i)=>d.classList.toggle('on', i===dkCur));
  document.querySelectorAll('#dkMenuList .dk-mi').forEach(b=>b.classList.toggle('on', +b.dataset.i===dkCur));
  const st = document.getElementById('dkStage'); if(st) st.scrollTop = 0;
}
function dkGo(i){ if(i<0 || i>=dkSlides.length || i===dkCur) return; dkCur = i; dkPintar(); }
function dkMover(d){ dkGo(dkCur + d); }
function dkMenu(on){ const m = document.getElementById('dkMenu'); if(m) m.classList.toggle('on', !!on); }
document.addEventListener('keydown', e=>{
  if(!dkSlides.length || !document.getElementById('deck')) return;
  if(document.getElementById('dkMenu').classList.contains('on')) return;
  if(e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault(); dkMover(1); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); dkMover(-1); }
});

/* carga modulos y galerias siempre frescos (evita cache al actualizar) */
(function(){
  function loadGalerias(){
    var g=document.createElement('script');
    g.src='galerias.js?v='+(new Date().getTime());
    g.onload=function(){ applyModules(); renderHub(); route(); };
    g.onerror=function(){ window.GALLERIES=window.GALLERIES||{}; applyModules(); renderHub(); route(); };
    document.head.appendChild(g);
  }
  /* contenido de prueba del muro: existe solo en la rama de trabajo */
  function loadMuroDemo(){
    var d=document.createElement('script');
    d.src='muro-demo.js?v='+(new Date().getTime());
    d.onload=loadGalerias;
    d.onerror=loadGalerias;      /* en produccion el archivo no existe: se sigue igual */
    document.head.appendChild(d);
  }
  var m=document.createElement('script');
  m.src='modulos.js?v='+(new Date().getTime());
  m.onload=loadMuroDemo;
  m.onerror=loadMuroDemo;
  document.head.appendChild(m);
})();
</script>
