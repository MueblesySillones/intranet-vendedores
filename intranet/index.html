<!-- La hoja de Google Fonts era EL unico recurso que bloqueaba el primer pintado:
     medido, el primer render esperaba 1:1 a que respondiera fonts.googleapis.com
     (una vez tardo 14 segundos y la pagina quedo BLANCA todo ese tiempo).
     Se carga sin bloquear (media=print hasta que llega) y mientras tanto el texto
     sale con el respaldo de metricas ajustadas de aca abajo. El peso 300 se saco
     porque no lo usa nadie (los usados son 400-800). -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script>
/* ARRANQUE TEMPRANO DE LOS DATOS. Antes, modulos.js (257 KB) recien se pedia
   cuando el navegador terminaba de parsear TODO este documento, y galerias.js
   esperaba en fila a que terminara modulos.js: dos viajes en serie, al final.
   Medido, ese era el grueso del "element render delay" del LCP (1,5 s en el
   modulo Descargables). Aca se disparan los dos pedidos YA y en paralelo;
   recien se pinta cuando el documento este parseado Y los datos hayan llegado
   (la compuerta __mysArrancar vive al final del <body>, donde ya existen
   applyModules/renderHub/route).
   Tambien se fue el ?v=timestamp: ese numero cambiaba EN CADA VISITA, asi que
   el navegador volvia a bajar los 257 KB completos aunque nada hubiera
   cambiado. Sin el sufijo, Vercel manda ETag y max-age=0 must-revalidate:
   cada visita PREGUNTA igual al servidor si hay version nueva (frescura
   intacta) pero si no la hay la respuesta es un 304 vacio, no el archivo
   entero. */
(function(){
  window.__mysCarga = { faltan:2, listo:false, corrido:false };
  function hecho(){
    if(--window.__mysCarga.faltan > 0) return;
    window.__mysCarga.listo = true;
    if(window.__mysArrancar) window.__mysArrancar();
  }
  function traer(src, alTerminar){
    var s = document.createElement('script');
    s.src = src; s.onload = alTerminar; s.onerror = alTerminar;
    document.head.appendChild(s);
  }
  /* Antes esto pedia ademas muro-demo.js cuando se abria en local. Ese
     archivo se saco del repo (era contenido inventado de prueba), asi que
     lo unico que quedaba era un 404 en el camino critico cada vez que se
     miraba la vista previa desde el panel. */
  traer('modulos.js', hecho);
  traer('galerias.js', function(){
    window.GALLERIES = window.GALLERIES || {};   /* si fallo, que no rompa */
    hecho();
  });
})();
</script>

  whatsapp: `
  <div class="manual">

    <p class="m-lead"><b>WhatsApp es nuestra mejor herramienta para acercar al cliente a la compra,</b> pero tiene reglas claras. Entenderlas no te limita: te da poder. El cliente nos abre la puerta cuando nos escribe, y tenemos 24 horas para charlar con total libertad. Pasado ese tiempo, todavía podemos volver a contactarlo de forma legal con plantillas aprobadas.</p>

    <div class="note">${svg(I.clock)}<div class="nt"><b>La idea en una frase:</b> el cliente abre la puerta cuando nos escribe, la aprovechamos dentro de las 24h, y la reabrimos con plantillas cuando hace falta. Todo lo demás cuelga de ahí.</div></div>

    <div class="m-block">
      <div class="m-kicker"><span class="n">1</span> LA HERRAMIENTA</div>
      <div class="m-h">Qué es WhatsApp Business API y por qué la usamos</div>
      <p class="m-sub">Existen tres WhatsApp distintos: el personal, la app Business (gratis, para un negocio chico en un solo teléfono) y la Business Platform, llamada API. Nosotros usamos la API porque está hecha para crecer.</p>
      <p class="m-p">La diferencia central es la escala. La app gratis funciona en un teléfono principal más hasta 4 dispositivos: todos ven los mismos chats, pero nadie sabe quién respondió a quién. Con la API, muchos vendedores atienden el mismo número a la vez sin pisarse, con la consulta de cada cliente registrada y medible en el sistema.</p>
      <p class="m-p">La API no se baja de una tienda de apps: se conecta a través de un proveedor oficial (BSP) o un CRM. Esto nos da algo clave para una mueblería: <b>profesionalismo y confianza</b>. Perfil de empresa, catálogo y el tilde de Cuenta Oficial verificada le dicen al cliente que habla con un negocio serio.</p>

const botonera = document.getElementById('botonera');
function seccionLista(t){ return t.ready || ((window.GALLERIES||{})[t.key]||[]).length>0; }
/* ---- NOVEDADES ----
   El panel guarda en cada modulo la fecha del ultimo cambio (`actualizado`).
   Con eso el vendedor ve de un vistazo QUE se movio desde la ultima vez que
   entro, en vez de tener que abrir todo para descubrirlo. */
const DIAS_NOVEDAD = 14;
/* Se comparan DIAS DE CALENDARIO, no milisegundos: si se mezcla la fecha
   guardada con la hora local, un cambio de hoy puede dar -1 dia y quedar
   afuera de las novedades. */
function diasDesde(f){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f||'')) return null;
  const p = f.split('-').map(Number);
  const cuando = Date.UTC(p[0], p[1]-1, p[2]);
  const h = new Date();
  const hoy = Date.UTC(h.getFullYear(), h.getMonth(), h.getDate());
  return Math.round((hoy - cuando) / 86400000);
}
function esNovedad(key){
  const m = MODMAP[key];
  if(!m) return false;
  const d = diasDesde(m.actualizado);
  if(d !== null && d <= DIAS_NOVEDAD) return true;   // negativo = guardado hoy en otra franja horaria
  /* Un aviso archivado no toca `actualizado` del modulo, porque el modulo no
     se guardo. Pero para el vendedor ES material nuevo ahi adentro. */
  const post = archivadosEn(key)[0];
  const da = post ? diasDesde(post.fecha) : null;
  return da !== null && da <= DIAS_NOVEDAD;
}
function textoNovedad(key){
  const d = diasDesde((MODMAP[key]||{}).actualizado);
  if(d === null) return '';
  if(d <= 0) return 'Actualizado hoy';
  if(d === 1) return 'Actualizado ayer';
  if(d <= 7) return 'Actualizado hace ' + d + ' días';
  return 'Actualizado hace ' + Math.round(d/7) + ' semanas';
}

    <span class="num">${String(t.n).padStart(2,'0')}</span>
    ${nv?'<span class="tile-nuevo">Nuevo</span>':''}
    <div class="icirc" style="background:var(${t.color})">${svg(I[t.icon])}</div>

    <div class="td">${esc(t.desc)}</div>
    <span class="chip ${r?'ok':'soon'}"><span class="dot"></span>${r?'Disponible':'Próximamente'}</span>
  </button>`; }).join('');
  renderNovedades(); }

function renderNovedades(){
  const caja = document.getElementById('novedades');
  if(!caja) return;
  const nuevos = TILES.filter(t => seccionLista(t) && esNovedad(t.key));
  if(!nuevos.length){ caja.hidden = true; caja.innerHTML = ''; return; }
  caja.hidden = false;
  caja.innerHTML = '<div class="nv-t">Novedades</div><div class="nv-lista">' +
    nuevos.map(t => `<button class="nv-item" onclick="openSection('${t.key}')">
      <span class="nv-ic" style="background:var(${t.color})">${svg(I[t.icon])}</span>
      <span class="nv-tx"><span class="nv-n">${esc(t.title)}</span>
      <span class="nv-f">${esc(textoNovedad(t.key))}</span></span>
      <span class="nv-fl">›</span></button>`).join('') + '</div>';
}

function openLightbox(src, name){
  const lb=document.getElementById('lightbox');
  lb.innerHTML = `<button class="lb-close" aria-label="Cerrar" onclick="event.stopPropagation();closeLightbox()">${svg(I.x)}</button>`
    + `<img id="lbimg" src="${esc(src)}" alt="Vista ampliada" onclick="event.stopPropagation()">`
    + `<div class="lb-hint" id="lbHint" hidden onclick="event.stopPropagation()">📱 Girá el teléfono para verla más grande</div>`
    + `<a class="dl-btn lb-dl" href="${esc(src)}" download="${esc(name||'')}" onclick="event.stopPropagation()">${svg(I.download)} Descargar</a>`;
  lb.hidden=false;
  const img=document.getElementById('lbimg');
  if(img.complete) chequearHintLightbox(); else img.onload=chequearHintLightbox;
}
function chequearHintLightbox(){
  const lb=document.getElementById('lightbox');
  if(!lb || lb.hidden) return;
  const img=document.getElementById('lbimg'), hint=document.getElementById('lbHint');
  if(!img || !hint || !img.naturalWidth) return;
  const apaisada = img.naturalWidth > img.naturalHeight*1.15;   // claramente horizontal
  const vertical = window.innerHeight > window.innerWidth;      // celular parado
  hint.hidden = !(apaisada && vertical);
}
window.addEventListener('resize', chequearHintLightbox);

/* ---- tablas: ordenar tocando el titulo + buscador ----
   Todo por delegacion en document: #secBody.innerHTML se reescribe entero en
   cada navegacion, asi que cualquier listener colgado de un nodo concreto se
   perderia. Una tabla sin el envoltorio .m-tablaw nunca entra por aca. */
(function(){
  function pelado(s){
    return (s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }
  // "1.116" -> 1116 ; "4,5%" -> 4.5 ; "$ 2.300" -> 2300 ; "Hudson" -> null
  function aNumero(v){
    var t = String(v==null?'':v).replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,'');
    if(!t || t==='-' || t==='.') return null;
    var n = parseFloat(t);
    return isFinite(n) ? n : null;
  }
  var esTotal = function(tr){ return tr.classList.contains('fx-total'); };

  function guardarOriginal(tb){
    if(tb.dataset.ini) return;
    tb.dataset.ini = '1';
    [].forEach.call(tb.rows, function(tr,i){ tr.dataset.o = i; });
  }
  // si el dueno marco "Son numeros" mandamos eso; si no, se mira el contenido
  function columnaNumerica(tabla, ci){
    var th = tabla.querySelectorAll('thead th')[ci];
    if(th && th.classList.contains('num')) return true;
    var n=0, tot=0;
    [].forEach.call(tabla.tBodies[0].rows, function(tr){
      if(esTotal(tr)) return;
      var c = tr.cells[ci]; if(!c) return;
      var t = c.textContent.trim(); if(!t) return;
      tot++; if(aNumero(t)!==null) n++;
    });
    return tot>0 && n/tot >= 0.6;
  }
  function cebrear(tb){
    var k=0;
    [].forEach.call(tb.rows, function(tr){
      tr.classList.remove('z0','z1');
      if(tr.hidden) return;
      tr.classList.add(k%2 ? 'z1' : 'z0'); k++;
    });
  }
  function ordenar(tabla, ci, dir){
    var tb = tabla.tBodies[0];
    guardarOriginal(tb);
    var num = columnaNumerica(tabla, ci);
    var normales = [].filter.call(tb.rows, function(tr){ return !esTotal(tr); });
    var totales  = [].filter.call(tb.rows, esTotal);
    var orig = function(a,b){ return (+a.dataset.o) - (+b.dataset.o); };
    if(!dir){ normales.sort(orig); }
    else {
      normales.sort(function(a,b){
        var va = ((a.cells[ci]||{}).textContent||'').trim();
        var vb = ((b.cells[ci]||{}).textContent||'').trim();
        if(!va && !vb) return orig(a,b);
        if(!va) return 1;                       // las vacias SIEMPRE al final
        if(!vb) return -1;
        var r;
        if(num){
          var na = aNumero(va), nb = aNumero(vb);
          if(na===null && nb===null) r = 0;
          else if(na===null) return 1;
          else if(nb===null) return -1;
          else r = na - nb;
        } else {
          r = pelado(va).localeCompare(pelado(vb), 'es');
        }
        if(!r) return orig(a,b);
        return dir==='asc' ? r : -r;
      });
    }
    normales.concat(totales).forEach(function(tr){ tb.appendChild(tr); });   // la fila TOTAL siempre abajo
    [].forEach.call(tabla.querySelectorAll('thead th'), function(th,i){
      th.setAttribute('aria-sort', (i===ci && dir) ? (dir==='asc'?'ascending':'descending') : 'none');
    });
    cebrear(tb);
  }
  function filtrar(w){
    var q = w.querySelector('.tb-q');
    var tabla = w.querySelector('table'); if(!tabla || !tabla.tBodies[0]) return;
    var tb = tabla.tBodies[0];
    var palabras = pelado(q ? q.value : '').split(/\s+/).filter(Boolean);
    var visibles = 0, normales = 0;
    [].forEach.call(tb.rows, function(tr){
      // el TOTAL se esconde mientras haya filtro: un total que no suma lo que se ve, miente
      if(esTotal(tr)){ tr.hidden = palabras.length > 0; return; }
      normales++;
      var txt = pelado(tr.textContent);
      var pasa = palabras.every(function(p){ return txt.indexOf(p) !== -1; });
      tr.hidden = !pasa;
      if(pasa) visibles++;
    });
    var vacio = palabras.length > 0 && visibles === 0;
    var cont = w.querySelector('.tb-cont');
    if(cont) cont.textContent = palabras.length ? (visibles + ' de ' + normales) : '';
    var lim = w.querySelector('.tb-limpiar');
    if(lim) lim.hidden = !palabras.length;
    var nada = w.querySelector('.tb-nada');
    if(nada) nada.hidden = !vacio;
    var caja = w.querySelector('.m-tabla');
    if(caja) caja.hidden = vacio;
    cebrear(tb);
  }

  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var b = e.target.closest('.m-tablaw .th-b');
    if(b){
      var th = b.closest('th'), tabla = b.closest('table');
      var ci = [].indexOf.call(th.parentNode.children, th);
      var est = th.getAttribute('aria-sort');
      // primer toque: los numeros arrancan de mayor a menor, los textos de A a Z
      var dir = est==='none' ? (columnaNumerica(tabla, ci) ? 'desc' : 'asc')
              : (est==='descending' ? 'asc' : (est==='ascending' ? '' : 'desc'));
      ordenar(tabla, ci, dir);
      return;
    }
    var lim = e.target.closest('.m-tablaw .tb-limpiar');
    if(lim){
      var w = lim.closest('.m-tablaw'), q = w.querySelector('.tb-q');
      if(q){ q.value = ''; q.focus(); }
      filtrar(w);
    }
  });
  document.addEventListener('input', function(e){
    if(!e.target.closest) return;
    var q = e.target.closest('.m-tablaw .tb-q');
    if(q) filtrar(q.closest('.m-tablaw'));
  });
})();

/* ===================================================================
   AVISOS ARCHIVADOS EN UN MODULO
   Un aviso importante tiene dos vidas: hoy, arriba de la cartelera, y
   despues, cuando el vendedor lo va a buscar tres semanas mas tarde.
   Antes eso se resolvia escribiendo lo mismo dos veces, a mano.
   Ahora la publicacion deja anotado a que modulo pertenece (`archivar`) y
   el modulo PREGUNTA cuales lo señalan. NO hay copia: la publicacion sigue
   siendo una sola, la de la cartelera. Por eso corregirle una falta de
   ortografia, o borrarla, se ve en los dos lados sin sincronizar nada.
   =================================================================== */
function archivadosEn(key){
  if(!key) return [];
  const salida = [];
  (window.MODULES || []).forEach(m => {
    if(!esCartelera(m.content)) return;
    /* postsDelMuro es el mismo filtro que usa la cartelera: lo programado
       todavia no sale, lo vencido ya no se ve, lo archivado tampoco */
    postsDelMuro(m.content).forEach(p => { if(p.archivar === key) salida.push(p); });
  });
  return salida.sort((a,b) => String(b.fecha||'').localeCompare(String(a.fecha||'')));
}
function archivadosHTML(key){
  const posts = archivadosEn(key);
  if(!posts.length) return '';
  return `<section class="arch">
    <div class="arch-t">${svg(I.megaphone)}<span>De la cartelera</span>
      <span class="arch-n">${posts.length}</span></div>
    ${posts.map(p => {
      const tag = MURO_TAGS[p.etiqueta];
      return `<article class="arch-i"${tag ? ` style="--at:${tag.fg}"` : ''}>
        <div class="arch-h">
          ${tag ? `<span class="arch-tag" style="background:${tag.bg};color:${tag.fg}">
            ${svg(I[tag.i])}${esc(tag.t)}</span>` : ''}
          <span class="arch-f">${esc(fechaLinda(p.fecha))}</span>
        </div>
        <h3 class="arch-tt">${esc(p.titulo || '')}</h3>
        <div class="manual">${p.html || ''}</div>
      </article>`;
    }).join('')}
  </section>`;
}

/* De donde sale el HTML de un modulo. Lo usan la vista completa y la mesa de
   escritorio: si algun dia cambia el orden de las fuentes, cambia para las dos
   de una, que es la unica forma de que no se separen. */
function cuerpoDeModulo(key, t){
  const mod = MODMAP[key];
  /* Los avisos de la cartelera van ARRIBA del contenido fijo del modulo: son
     lo nuevo, y en un modulo de avisos lo nuevo es justo lo que se viene a
     buscar. La cartelera nunca se archiva dentro de si misma. */
  const arch = (mod && esCartelera(mod.content)) ? '' : archivadosHTML(key);
  if(mod && mod.content && mod.content.tipo) return arch + renderContent(mod.content, t);
  if(DOWNLOAD_GROUPS[key]) return arch + groupsHTML(DOWNLOAD_GROUPS[key]);
  if(CONTENT[key]) return arch + CONTENT[key];
  const imgs = (window.GALLERIES||{})[key] || [];
  if(imgs.length) return arch + galleryHTML(imgs, t);
  /* con avisos adentro el modulo NO esta vacio: decir "todavia no hay nada"
     seria mentira, y encima abajo de algo que si esta */
  return arch || pendingHTML(t);
}
function renderSection(key){
  const t = MAP[key];
  document.getElementById('secIcon').style.background = `var(${t.color})`;
  document.getElementById('secIcon').innerHTML = svg(I[t.icon]);
  document.getElementById('secTitle').textContent = t.title;
  document.getElementById('secSub').textContent = t.desc;
  const mod = MODMAP[key];
  let embed = false, presenta = false, esMuro = false;
  COL_KEY = (mod && mod.content && mod.content.tipo === 'coleccion') ? key : null;
  MURO_KEY = (mod && esCartelera(mod.content)) ? key : null;
  if(mod && mod.content && mod.content.tipo){
    embed = mod.content.tipo === 'embed';
    presenta = mod.content.tipo === 'bloques' && !!mod.content.presentacion;
    esMuro = esCartelera(mod.content);
  }
  const body = cuerpoDeModulo(key, t);
  document.getElementById('secBody').innerHTML = body;
  if(esMuro){ initMuro(); animarEntradas(document.getElementById('secBody')); vigilarLectura(); }
  /* En celular los grupos arrancan PLEGADOS: son 10 y con todo abierto la
     pagina medía 31,6 pantallas. Asi lo primero que se ve son los nombres, y
     llegar a una placa son dos toques. Lo que el vendedor abra o cierre a
     mano se recuerda igual, y vale para los dos lados. */
  /* Adentro de un modulo los videos conservan los controles del navegador,
     pero en celular tampoco se bajan solos: se tocan y ahi arrancan. */
  if(enCelular())
    document.getElementById('secBody').querySelectorAll('video')
      .forEach(v => { if(!v.dataset.tocado) v.preload = 'none'; });
  plegarGalerias(document.getElementById('secBody'), key,
                 window.matchMedia('(max-width:640px)').matches);
  ponerIndice(document.getElementById('secBody'));
  document.body.classList.toggle('report-mode', embed || presenta || (key==='reporte' && !(mod && mod.content && mod.content.tipo)));
  if(presenta) initDeck(); else dkSlides = [];
  document.getElementById('hub').hidden = true;
  document.getElementById('view').hidden = false;
  COL_DOC = null;                      /* al entrar a un modulo no hay documento abierto */
  document.body.classList.remove('con-mesa');   /* main vuelve a ser una caja centrada */
  medirEncabezado();          /* el indice salta con --hd: se mide tambien aca */
  pintarNavHeader();
  window.scrollTo(0,0);
}
/* ===================================================================
   INDICE DE UN MODULO LARGO
   Toma los titulos que ya existen en el modulo mas los avisos archivados de
   la cartelera, en el orden en que estan, y arma una lista para saltar.
   =================================================================== */
const IND_MINIMO = 4;      /* con menos de esto, el indice estorba mas que ayuda */
const IND_ABIERTO = 6;     /* de aca para arriba arranca plegado */

function ponerIndice(root){
  if(!root || root.querySelector('.ind')) return;
  const tits = [...root.querySelectorAll('.arch-tt, .m-h, .m-h2')]
    .filter(e => (e.textContent || '').trim());
  if(tits.length < IND_MINIMO) return;
  tits.forEach((e, i) => { if(!e.id) e.id = 'ind-' + i; });
  const plegado = tits.length > IND_ABIERTO;
  const caja = document.createElement('nav');
  caja.className = 'ind' + (plegado ? ' cerrado' : '');
  caja.setAttribute('aria-label', 'Índice del módulo');
  caja.innerHTML =
    `<button type="button" class="ind-t" aria-expanded="${plegado ? 'false' : 'true'}">
      <span>En este módulo</span><span class="ind-n">${tits.length}</span>
      <span class="ind-chev" aria-hidden="true">▾</span>
    </button>
    <ol class="ind-l">${tits.map((e, i) =>
      `<li><button type="button" data-ir="${i}">${esc((e.textContent || '').trim())}</button></li>`
    ).join('')}</ol>`;
  root.insertBefore(caja, root.firstChild);

  caja.querySelector('.ind-t').addEventListener('click', () => {
    const c = caja.classList.toggle('cerrado');
    caja.querySelector('.ind-t').setAttribute('aria-expanded', c ? 'false' : 'true');
  });
  caja.querySelectorAll('[data-ir]').forEach(b => {
    b.addEventListener('click', () => {
      const t = tits[+b.dataset.ir];
      if(!t) return;
      /* si el titulo cayo adentro de una galeria plegada, primero se abre */
      const cerrada = t.closest('.cerrada');
      if(cerrada) cerrada.classList.remove('cerrada');
      t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// hace plegable cada grilla de imágenes: la cabecera (.m-kicker) abre/cierra la galería,
// muestra cuántas placas tiene, y recuerda el estado por vendedor (localStorage).
function plegarGalerias(root, key, cerradaPorDefecto){
  root.querySelectorAll('.gallery').forEach((gal, i)=>{
    const head = gal.previousElementSibling;
    if(!head || !head.classList.contains('m-kicker') || head.dataset.pleg) return;
    head.dataset.pleg = '1';
    head.classList.add('plegable');
    const wrap = head.parentElement;                 // .dl-section o .m-block
    const n = gal.querySelectorAll('.gcard').length;
    const badge = document.createElement('span'); badge.className='pleg-count'; badge.textContent = n;
    const chev = document.createElement('span'); chev.className='pleg-chev'; chev.setAttribute('aria-hidden','true'); chev.textContent='▾';
    head.append(badge, chev);
    head.setAttribute('role','button'); head.setAttribute('tabindex','0');
    const lsKey = 'pleg:'+key+':'+i;
    /* En el panel de la derecha arrancan CERRADAS: son 10 grupos y 47 placas,
       y abiertas medían 22 pantallas de scroll. Cerradas, los 10 grupos entran
       de una y llegar a una placa son dos toques. Lo que el vendedor abre o
       cierra a mano se recuerda igual, y vale para los dos lados. */
    try{
      const guardado = localStorage.getItem(lsKey);
      if(guardado === '1' || (guardado === null && cerradaPorDefecto))
        wrap.classList.add('cerrada');
    }catch(e){ if(cerradaPorDefecto) wrap.classList.add('cerrada'); }
    const toggle = ()=>{ const c = wrap.classList.toggle('cerrada'); try{ localStorage.setItem(lsKey, c?'1':'0'); }catch(e){} };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
}
