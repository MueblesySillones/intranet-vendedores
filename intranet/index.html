/* Lo fijado va en una FRANJA FINA: se despliega abajo cuando la tocan. Tiene
   que llamar la atencion sin ocupar lugar, para que lo del dia a dia quede a
   la vista apenas entran. */
let FIX_ABIERTO = null;
function renderFijados(){
  const cont = document.getElementById('fijados');
  /* se repinta la caja: si queda dicho que habia una abierta, el primer toque
     "cierra" una tarjeta que ya no existe y no pasa nada en pantalla */
  FIX_ABIERTO = null;
  const fij = MURO_POSTS.map((p,i) => ({p,i})).filter(x => x.p.fijado);
  if(!fij.length){ cont.hidden = true; cont.innerHTML = ''; return; }
  cont.hidden = false;
  cont.innerHTML = `<div class="fix-row">${fij.map(({p,i}) => {
      const tag = MURO_TAGS[p.etiqueta];
      const color = tag ? tag.fg : '#B4231F';
      return `<button type="button" class="fix-card" data-i="${i}" onclick="verFijado(${i},this)"
        style="--fx:${color}">
        <span class="fix-ic">${svg(I[tag ? tag.i : 'shield'])}</span>
        <span class="fix-t">${esc(p.titulo || 'Publicación')}</span>
        <span class="fix-ch">›</span>
      </button>`;
    }).join('')}</div>
    <div class="fix-abierto" id="fixAbierto"></div>`;
}
function verFijado(i, btn){
  const caja = document.getElementById('fixAbierto');
  document.querySelectorAll('.fix-card').forEach(c => c.classList.toggle('abierta', c === btn && FIX_ABIERTO !== i));
  if(FIX_ABIERTO === i){                    /* segunda vez: se cierra */
    FIX_ABIERTO = null; caja.innerHTML = '';
    return;
  }
  FIX_ABIERTO = i;
  caja.innerHTML = postHTML(MURO_POSTS[i], i, true);  /* recien abierto: esta EN pantalla */
  const art = caja.querySelector('.mu-post');
  if(art) art.classList.add('entra');
  initMuro();
  vigilarVideos();       /* la fijada se inyecta ahora: sus videos todavía no estaban */
  vigilarLectura();      /* la fijada suele ser justo la que pide confirmación */
}

/* ---- BARRA DE AVISO ----
   Una sola a la vez, y la que se ve es la que el vendedor NO puede descubrir
   solo: si cambió algo en otro modulo, no lo ve en la portada. Las
   publicaciones nuevas ya se ven abajo, asi que solo se avisan si son varias.
   Cerrarla la calla hasta que haya un cambio distinto. */
const NOTI_CERRADA = 'mys_noti_cerrada';
function renderNoti(){
  const caja = document.getElementById('noti');
  if(!caja) return;
  /* UNA sola alerta a la vez. Si hay comunicaciones obligatorias sin
     confirmar, eso manda: apilar dos avisos hace que no se lea ninguno. */
  if(pendientesDeConfirmar().length){ caja.hidden = true; caja.innerHTML = ''; return; }
  const mods = TILES.filter(t => t.key !== MURO_KEY && seccionLista(t) && esNovedad(t.key));
  const nuevas = MURO_POSTS.filter(esPostNuevo).length;
  let firma = '', ico = 'megaphone', texto = '', accion = '';
  if(mods.length){
    firma = 'm:' + mods.map(t => t.key + ':' + (MODMAP[t.key]||{}).actualizado).join('|');
    ico = 'refresh';
    texto = mods.length === 1
      ? `Hay material nuevo en <b>${esc(mods[0].title)}</b>`
      : `Hay material nuevo en <b>${mods.length} módulos</b>`;
    accion = mods.length === 1
      ? `<button type="button" class="noti-ver" onclick="openSection('${mods[0].key}')">Ver</button>`
      : `<button type="button" class="noti-ver" onclick="openMenu()">Ver</button>`;
  } else if(nuevas > 1){
    firma = 'p:' + nuevas + ':' + (MURO_POSTS[0]||{}).fecha;
    texto = `<b>${nuevas} publicaciones nuevas</b> desde la última vez`;
    accion = `<button type="button" class="noti-ver" onclick="irAPrimeraNueva()">Ver</button>`;
  }
  let cerrada = '';
  try{ cerrada = localStorage.getItem(NOTI_CERRADA) || ''; }catch(e){}
  if(!firma || firma === cerrada){ caja.hidden = true; caja.innerHTML = ''; return; }
  caja.dataset.firma = firma;
  caja.hidden = false;
  caja.innerHTML = `<span class="noti-ic">${svg(I[ico])}</span>
    <span class="noti-tx">${texto}</span>${accion}
    <button type="button" class="noti-x" onclick="cerrarNoti()" aria-label="Cerrar aviso">✕</button>`;
}
function cerrarNoti(){
  const caja = document.getElementById('noti');
  try{ localStorage.setItem(NOTI_CERRADA, caja.dataset.firma || ''); }catch(e){}
  caja.classList.add('sale');
  setTimeout(()=>{ caja.hidden = true; caja.classList.remove('sale'); caja.innerHTML = ''; }, 300);
}
function irAPrimeraNueva(){
  const art = document.querySelector('.mu-post.nueva');
  if(art) art.scrollIntoView({behavior:'smooth', block:'start'});
  cerrarNoti();
}

/* ---- las publicaciones aparecen al entrar en pantalla ----
   Se hace con IntersectionObserver y NO con un timer: si el vendedor no
   llego hasta ahi, no hay animacion que correr. La clase se SACA al ver la
   tarjeta, asi que si el navegador no soporta nada, el feed igual se ve. */
let muroObs = null;
function revelar(el, animar){
  el.classList.remove('asoma');
  if(animar) el.classList.add('asomo');
  if(muroObs) muroObs.unobserve(el);
}
/* RED DE SEGURIDAD (esto ya rompio una vez): si el scroll salta de golpe -por
   un ancla, un scrollIntoView o un flick fuerte-, el observer NO ve las
   tarjetas que pasaron de largo entre dos cuadros y quedaban INVISIBLES para
   siempre. Asi que todo lo que ya llego a la altura de la ventana se revela
   si o si, lo haya visto el observer o no. */
function revelarPasadas(){
  document.querySelectorAll('.mu-post.asoma').forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight + 80) revelar(el, true);
  });
}
let revPend = false;
function pedirRevelar(){
  if(revPend) return;
  revPend = true;
  requestAnimationFrame(()=>{
    revPend = false;
    revelarPasadas();
    /* el aviso de lecturas pendientes se pone al dia cuando volvés arriba:
       actualizarlo mientras leés abajo le daría un salto a la pantalla */
    if(window.scrollY < 120) pintarPendientes();
  });
}
window.addEventListener('scroll', pedirRevelar, {passive:true});
window.addEventListener('resize', pedirRevelar, {passive:true});

function animarEntradas(cont){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)) return;
  if(!muroObs){
    muroObs = new IntersectionObserver((entradas)=>{
      entradas.forEach(en=>{ if(en.isIntersecting) revelar(en.target, true); });
    }, {threshold:0, rootMargin:'0px 0px -40px 0px'});
  }
  cont.querySelectorAll('.mu-post:not(.asomo)').forEach((el, i)=>{
    if(el.dataset.obs) return;
    el.dataset.obs = '1';
    el.classList.add('asoma');
    el.style.animationDelay = Math.min(i, 4) * 55 + 'ms';   /* escalonado corto */
    muroObs.observe(el);
  });
  /* ultimo seguro: pase lo que pase, a los 2s no queda nada escondido */
  setTimeout(()=>{ cont.querySelectorAll('.mu-post.asoma').forEach(el => revelar(el, true)); }, 2000);
}

/* ===================================================================
   BIBLIOTECA: un modulo guarda VARIOS documentos (ej. un reporte por mes).
   El vendedor ve primero el indice y elige cual abrir. Los archivados no
   se listan (el panel los conserva pero no se publican a la vista).
   =================================================================== */
let COL_KEY = null;                       /* modulo de tipo biblioteca abierto */
let COL_DOC = null;                       /* documento abierto dentro de esa biblioteca */

/* La flecha del header retrocede UN paso:
   documento abierto -> lista de la biblioteca -> portada. */
function volverAtras(){
  if(COL_KEY !== null && COL_DOC !== null) volverIndice();
  else showHub();
}

/* Que botones muestra la barra de arriba, segun donde estes:
     portada            -> ninguno
     modulo / indice    -> [flecha atras] [Inicio]
     reporte abierto    -> [Volver a la lista (izquierda)] [Inicio]
   Dentro de un reporte, la flecha generica haria lo MISMO que "Volver a la
   lista", asi que se esconde para no repetir el mismo boton dos veces. */
function pintarNavHeader(){
  const enSeccion = !document.getElementById('view').hidden;
  const enDoc = enSeccion && COL_KEY !== null && COL_DOC !== null;
  document.getElementById('listaBtn').hidden = !enDoc;
  document.getElementById('backBtn').hidden  = !enSeccion || enDoc;
  document.getElementById('homeBtn').hidden  = !enSeccion;
  try{ pintarTabs(); }catch(e){}      /* la barra de abajo sigue lo mismo */
}
function docsVisibles(c){ return ((c && c.docs) || []).filter(d => !d.archivado); }
function resumenDoc(d){
  if(!d.presentacion) return '';
  /* lo mas fiable es contar lo que realmente quedo armado en el html */
  let n = (d.html || '').split('<section class="dk-slide"').length - 1;
  if(n < 1){                       /* respaldo: mismo criterio que usa el panel */
    let cuerpo = 0; n = 0;
    (d.bloques || []).forEach(b => { if(b.t==='diapo'){ if(cuerpo) n++; cuerpo = 0; } else cuerpo++; });
    if(cuerpo) n++;
  }
  return n ? n + (n===1 ? ' diapositiva' : ' diapositivas') : '';
}
function indiceHTML(c){
  const docs = docsVisibles(c);
  if(!docs.length) return `<div class="pending"><b>Todavía no hay nada publicado acá.</b><br>Muy pronto.</div>`;
  return `<div class="col-index">${docs.map((d,i)=>{
    const meta = [d.etiqueta, resumenDoc(d)].filter(Boolean).map(esc).join(' · ');
    return `<button type="button" class="col-card${i===0?' destacada':''}" onclick="verDoc(${i})">
      ${i===0 ? '<span class="col-ult">Último</span>' : ''}
      <span class="col-ct">${esc(d.titulo||'')}</span>
      ${meta ? `<span class="col-cm">${meta}</span>` : ''}
      <span class="col-cir">${svg(I.ext)}</span>
    </button>`;
  }).join('')}</div>`;
}
function verDoc(i){
  const mod = MODMAP[COL_KEY]; if(!mod || !mod.content) return;
  const d = docsVisibles(mod.content)[i]; if(!d) return;
  COL_DOC = i;                         /* la flecha ahora vuelve a la lista, no a la portada */
  pintarNavHeader();
  const volver = '← Volver a la lista';
  const body = document.getElementById('secBody');
  if(d.presentacion){
    body.innerHTML = deckHTML(d.html||'', volver);
    document.body.classList.add('report-mode');
    initDeck();
  } else {
    body.innerHTML = `<button type="button" class="col-back" onclick="volverIndice()">${volver}</button>`
                   + `<div class="manual">${d.html||''}</div>`;
    document.body.classList.remove('report-mode');
    dkSlides = [];
    plegarGalerias(body, COL_KEY + ':' + i);
  }
  window.scrollTo(0,0);
}
function volverIndice(){ if(COL_KEY) renderSection(COL_KEY); }

/* ===================================================================
   MODO PRESENTACION: un modulo armado en el panel se ve como diapositivas.
   El panel ya entrego el contenido cortado en <section class="dk-slide">
   con data-titulo / data-grupo; aca solo le ponemos la navegacion encima.
   =================================================================== */
function deckHTML(html, volver){
  return `<div class="deck" id="deck">
    <div class="dk-prog" id="dkProg"></div>
    <button class="dk-idx" onclick="dkMenu(true)" aria-label="Ver todas las diapositivas">
      <span class="ico"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span> Diapositivas
    </button>
    <div class="dk-stage" id="dkStage"><div class="manual">${html}</div></div>
    <div class="dk-bar">
      ${volver ? `<button type="button" class="dk-volver" onclick="volverIndice()">${esc(volver)}</button>` : ''}
      <span class="dk-count" id="dkCount"></span>
      <div class="dk-dots" id="dkDots"></div>
      <div class="dk-navs">
        <button class="dk-btn" id="dkPrev" onclick="dkMover(-1)">← Anterior</button>
        <button class="dk-btn" id="dkNext" onclick="dkMover(1)">Siguiente →</button>
      </div>
    </div>
    <div class="dk-menu" id="dkMenu">
      <div class="dk-menu-ov" onclick="dkMenu(false)"></div>
      <div class="dk-menu-p">
        <div class="dk-menu-h"><b>Contenido</b><button class="dk-menu-x" onclick="dkMenu(false)" aria-label="Cerrar">✕</button></div>
        <div id="dkMenuList"></div>
      </div>
    </div>
  </div>`;
}
let dkCur = 0, dkSlides = [];
function initDeck(){
  const deck = document.getElementById('deck');
  dkSlides = deck ? [...deck.querySelectorAll('.dk-slide')] : [];
  if(!dkSlides.length) return;
  document.getElementById('dkDots').innerHTML = dkSlides.map((s,i)=>
    `<button class="dk-dot" onclick="dkGo(${i})" aria-label="Diapositiva ${i+1}"></button>`).join('');
  let html = '', grpAnt = null;
  dkSlides.forEach((s,i)=>{
    const g = s.dataset.grupo || '';
    if(g && g !== grpAnt){ html += `<div class="dk-grp">${esc(g)}</div>`; grpAnt = g; }
    html += `<button class="dk-mi" data-i="${i}" onclick="dkGo(${i});dkMenu(false)">`
          + `<span class="mnum">${i+1}</span>${esc(s.dataset.titulo || ('Diapositiva '+(i+1)))}</button>`;
  });
  document.getElementById('dkMenuList').innerHTML = html;
  const st = document.getElementById('dkStage');
  let tX = null, tY = null;
  st.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; tX=t.clientX; tY=t.clientY; }, {passive:true});
  st.addEventListener('touchend', e=>{
    if(tX===null) return;
    const t=e.changedTouches[0], dx=t.clientX-tX, dy=t.clientY-tY; tX=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) dkMover(dx<0?1:-1);
  }, {passive:true});
  dkCur = 0; dkPintar();
}
function dkPintar(){
  const n = dkSlides.length; if(!n) return;
  dkSlides.forEach((s,i)=>s.classList.toggle('on', i===dkCur));
  document.getElementById('dkProg').style.width = ((dkCur+1)/n*100)+'%';
  document.getElementById('dkCount').textContent = (dkCur+1)+' / '+n;
  document.getElementById('dkPrev').disabled = dkCur===0;
  document.getElementById('dkNext').disabled = dkCur===n-1;
  document.querySelectorAll('#dkDots .dk-dot').forEach((d,i)=>d.classList.toggle('on', i===dkCur));
  document.querySelectorAll('#dkMenuList .dk-mi').forEach(b=>b.classList.toggle('on', +b.dataset.i===dkCur));
  const st = document.getElementById('dkStage'); if(st) st.scrollTop = 0;
}
function dkGo(i){ if(i<0 || i>=dkSlides.length || i===dkCur) return; dkCur = i; dkPintar(); }
function dkMover(d){ dkGo(dkCur + d); }
function dkMenu(on){ const m = document.getElementById('dkMenu'); if(m) m.classList.toggle('on', !!on); }
document.addEventListener('keydown', e=>{
  if(!dkSlides.length || !document.getElementById('deck')) return;
  if(document.getElementById('dkMenu').classList.contains('on')) return;
  if(e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault(); dkMover(1); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); dkMover(-1); }
});

/* La otra mitad del arranque temprano del <head>: los pedidos de modulos.js y
   galerias.js ya estan volando desde alla arriba. Aca —cuando el documento
   termino de parsear y por fin existen applyModules/renderHub/route— se pinta,
   ya sea porque los datos llegaron antes (llamada directa de abajo) o cuando
   terminen de llegar (los onload del <head> llaman a __mysArrancar). */
window.__mysArrancar = function(){
  if(!window.__mysCarga || !window.__mysCarga.listo || window.__mysCarga.corrido) return;
  window.__mysCarga.corrido = true;
  applyModules(); renderHub(); route();
};
window.__mysArrancar();
</script>
</body>
</html>
